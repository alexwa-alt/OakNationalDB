const UNITS = {"1ForcesPhysics": ["Two forces of equal size, acting in opposite directions on an object, are balanced.", "The resultant force is the sum of the forces acting on the object, taking into account their direction.", "When forces are balanced there is no resultant force and no change in speed.", "When there are two forces acting in opposite directions, the resultant force acts in the direction of the bigger force.", "The greater the resultant force on a given object, the greater or faster the change in speed.", "Objects can have energy because they are: moving, raised, hot, stretched/squashed, or contain chemicals that can react.", "When an object is said to have energy, this is really just saying the object has certain properties.", "Objects can have gravitational, thermal, elastic, chemical and kinetic stores of energy.", "Having energy means having properties that allow objects to interact, cause changes and make things happen.", "Friction is the force of one surface gripping or rubbing on another.", "Friction prevents or slows down movement between surfaces.", "Friction is caused by the roughness of surfaces.", "Lubricants are substances added between two surfaces to reduce friction.", "Forces are measured with a newton meter.", "Forces are measure in newtons (N).", "With no force, newton meters need to be adjusted to zero.", "Newton meters should be selected by considering the scale.", "Repeat readings help check for mistakes.", "Categoric variables come in distinct types. Continous variables can take any value on a numerical scale.", "Bar charts are used when the variable you changed in an experiment is categoric.", "An effective lubricant reduces the friction force.", "A conclusion states what you found out in an experiment and also explains how you know.", "Lubricants are substances added between two surfaces to reduce the friction between them.", "In a fair test, only the variable we are testing is changed.", "In a fair test, everything we are not testing is kept the same for every measurement.", "Repeat measurements help check for anomalous results.", "A mean combines repeat measurements  into a single result.", "Contact forces only act when objects are touching.", "Non-contact forces can act with or without the objects touching.", "Friction is a contact force that slows or prevents movement.", "Drag is a contact force that pushes against objects moving through liquids or gases.", "Energy cannot be created or destroyed.", "Energy can be transferred by forces that change the properties of an object (or system).", "Force arrows show the direction of a force.", "The length of a force arrow shows the size of a force.", "A force arrow is drawn starting from a point that shows where the force acts.", "Force arrows are best labelled as the force acting on (object A) by (object B).", "The motion of faster objects is harder to stop.", "The motion of heavier objects is harder to stop.", "Objects with a greater mass need a greater force to start or stop it moving, and to change the direction of motion.", "A force is a push or a pull.", "A force is needed to change the motion or shape of an object."], "2Solid, liquid, gas states and changes of stateChemistry": ["The condensing point and boiling point are the same temperature for a substance, for water this is 100\u00b0C.", "Steam is water in the gas state.", "A substance increases in volume in the gas state when boiled.", "A substance decreases in volume in the liquid state when condensed.", "Particles move further apart when boiled and move closer together when condensed.", "The heavy base of a Bunsen burner does not get hot", "Opening the air hole on a Bunsen burner changes the flame from orange and sooty to a hotter, cleaner, blue flame.", "Adjusting the gas tap controls the size of the Bunsen burner flame.", "A splint used to light a Bunsen burner should be lit from the nearest Bunsen burner that is already lit.", "A lit splint should be carried with the flame angled slightly downwards and shielded by the other hand.", "States of matter can have differing amounts of energy.", "Solid states have the least energy, gas states have the most energy.", "A substance in its liquid state can evaporate at temperatures below its boiling point.", "The hotter the water, the more quickly it evaporates.", "Water evaporates at temperatures that are lower than 100\u2103.", "When it melts, a substance changes from the solid state to the liquid state.", "When it freezes, a substance changes from the liquid state to the solid state.", "At temperatures below its melting point, a substance is in its solid state.", "At temperatures above its freezing point, a substance is in its liquid state.", "The melting point and freezing point of a pure substance are the same temperature.", "In the solid state, forces of attraction between particles hold them in fixed positions.", "In the liquid state, particles are held together but have enough energy to break free to move around.", "The stronger the force of attraction between particles in a substance, the higher its melting point.", "Water freezes at 0\u00baC, room temperature is about 20\u00baC and body temperature is about 37\u00baC.", "The bulb of a thermometer is made of very thin glass and is delicate.", "In the gas state a substance can flow, it fills the whole of a container and can be compressed.", "In the gas state, particles of a substance are moving very quickly in random directions with gaps between them.", "In the gas state, particles have enough energy to be free of the attractive forces between them.", "There is nothing at all between the particles in a gas.", "A substance may have a solid, liquid and gas state", "In the solid state a substance has a fixed shape, it does not flow and cannot be compressed", "In the liquid state a substance can flow, it fills the shape of its container and cannot be compressed", "All substances are made of particles that are too small to see"], "3CellsBiology": ["Cells have a 3D shape (not 2D as they often appear in textbooks).", "Common structures of animal cells can be shown in diagrams.", "These structures include the cytoplasm, cell membrane, nucleus and mitochondria.", "Each structure in an animal cell has a specific function.", "Cells can be represented using 2D and 3D scientific models.", "Unicellular organisms are made of a single living cell.", "Multicellular organisms are made of more than one cell (sometimes millions), and different cells take on different jobs.", "In multicellular organisms, cells join together to form tissues with specific jobs.", "An organ is a group of tissues working together to do a specific job, and organs work together in an organ system.", "Unicellular organisms have different structures that have adaptations to help them function and stay alive.", "All organisms are made up of living building blocks called cells.", "Cells are usually too small to see with the unaided eye.", "The cells that make up tissue on a slide can be observed using a light microscope.", "Changing the magnification and focus of a light microscope enables cell structures to be observed.", "Plant cells have some common structures.", "Some of these structures are common with animal cells, such as the cytoplasm, cell membrane, nucleus and mitochondria.", "Plant cells have additional structures including the cell wall and vacuole, and some have chloroplasts.", "Each structure in a plant cell has a specific function.", "Plant cells can be adapted with different shapes and structures.", "The cells that make up tissue can be viewed using a light microscope.", "A sample of tissue can be prepared on a slide to view using a microscope.", "Adding a stain can make it easier to see some parts of cells.", "Changing the magnification and focus of a light microscope enables stained cell structures to be observed.", "Observations from a light microscope can be recorded in a scientific line drawing.", "The animal and plant cell models describe common features of cells.", "Not all cells have all these features, and some cells have additional ones.", "Specialised cells in animals and plants have shapes, sizes, and structures, that are adapted for the jobs the cells do.", "Examples of specialised cells include red blood cells in animals and root hair cells in plants.", "The same life processes happen in all living organisms.", "These life processes include movement, reproduction, sensitivity, growth, respiration, excretion and nutrition.", "All living organisms are made from other living organisms when they reproduce.", "Movement is a sign of life when the organism moves itself to achieve something.", "All these processes happen at some stage in the life cycle of every living organism."], "4Our solar system and beyondPhysics": ["Earth was once thought to be flat, with all the stars and the Sun moving around it.", "Until the 16th century most people thought Earth was at the centre of the universe.", "Observations with telescopes provide evidence that helps us to understand the universe.", "In summer there are more daylight hours, compared to winter, the Sun appears higher in the sky and it is warmer.", "When it is summer in northern hemisphere countries it is winter in southern hemisphere countries.", "Earth spins on an axis that is tilted at an angle of 23.5 degrees.", "In June, the northern hemisphere is tilted towards the Sun, so has summer.", "In June, the southern hemisphere is tilted away from the Sun, so has winter.", "Gravitational forces pull (attract) objects towards the centre of large objects like planets, moons and stars.", "The greater the mass of an object, the stronger its gravity.", "The gravity of a planet, moon or star extends far into space, but gets weaker with distance.", "Earth\u2019s gravity pulls the Moon towards the centre of Earth, changing the Moon's direction, making it orbit around Earth.", "The Sun's gravity pulls Earth towards the centre of the Sun, changing Earth's direction, making it orbit around the Sun.", "Heating a surface from directly overhead is more effective than heating a surface at a different angle.", "When rays of light hit a surface face-on, they are less spread out than if they hit at an angle.", "At a place on Earth, the heating effect of the Sun is greatest at midday and lowest at sunrise and sunset.", "Over a day, Earth's spin changes the Sun's height in the sky and the angle at which the Sun's rays arrive at a place.", "A star is an extremely large sphere of hot gas that gives out light.", "A planet is a very large sphere of rock or gas that orbits a star.", "Our solar system includes the Sun (a star) and all the objects that orbit the Sun.", "Orbiting the Sun are: 8 planets (many of which have moons), dwarf planets and smaller objects such as asteroids.", "Distances between objects in our solar system are very, very large compared to the sizes of the objects.", "The seasons change because of Earth\u2019s tilted axis, which does not change direction as Earth orbits the Sun.", "In June, the northern hemisphere is tilted towards the Sun so has summer, and the southern hemisphere has winter.", "In December, the northern hemisphere is tilted away from the Sun so has winter, and the southern hemisphere has summer.", "The seasons that occur at a place on Earth can be explained by the different angles made to the sun's rays over a year.", "Countries near the Equator do not experience summers and winters as they stay close to \u2018face-on\u2019 to the Sun all year.", "The Sun is a star, an extremely hot sphere of gas that emits light.", "The stars in the night sky are much smaller and dimmer than the Sun because they are much further away.", "A light-year is the distance light travels in one year. This is large enough to be suitable for distances in space.", "In the universe, stars are found in groups called galaxies, with billions of stars in each one.", "There are billions of galaxies in the universe.", "Earth is a planet. It is a sphere that spins once every 24 hours.", "Earth's spin explains day and night.", "Earth orbits the Sun, with each orbit taking 365.25 days (1 year).", "Earth orbits the Sun in an almost perfect circle.", "The Moon orbits the Earth about once per month (27.3 days), this explains why the Moon appears to change shape."], "5SolutionsChemistry": ["Brownian motion is the random motion of particles suspended in a medium.", "Particles of a substance released into a fluid (a gas or liquid) move around and are pushed by other particles.", "Substances that have particles that are free to move will eventually reach a random distribution throughout.", "At higher temperatures, particles in a gas or solution move more quickly.", "Suspensions are not solutions, as solid particles can be seen, and eventually will settle over time.", "Forces of attraction between solute particles have to be overcome for something to dissolve.", "In a mixture, one particle may fit into spaces between another type, making the total volume less than expected.", "Not every substance can be dissolved (is soluble) in a solvent.", "Dissolving is not the same as melting, but both are physical processes.", "A method provides step-by-step instructions for how to carry out an investigation.", "Methods should include how equipment is used and specific amounts of substances used.", "Methods should be written so that they are both repeatable and reproducible.", "Methods are written concisely, using clear language and command words.", "A solution is formed when a soluble solid dissolves in an appropriate solvent", "In chemistry, mass is measured in grams (g)", "The mass of substances that are mixed adds together to give the total mass of the mixture (mass is conserved)", "Laboratory equipment are designed for specific uses and choice of equipment impacts the quality of results", "Mass can be measured on a balance, in grams", "Volume can be measured in a measuring cylinder, in cm\u00b3", "Laboratory apparatus are designed for specific uses and choice of apparatus impacts the quality of results", "Equipment can be communicated using 2D drawings/images", "Scientific diagrams illustrate how equipment is used together for practical investigations", "A pure material is made of only one type of substance", "A pure material has a fixed melting point and boiling point", "Impurities change the melting and boiling point of a material", "A mixture contains two or more types of substances which can be easily separated", "Mixtures melt or boil over a range of temperatures", "At a given temperature, there is a limit to how much solute can dissolve in a solvent.", "Solutes may become insoluble as a solution cools.", "Lines of best fit can be used to predict unknowns values if one variable is known.", "Data from multiple investigations can be plotted on the same graph for ease of comparison.", "Scientists transfer data to graphs in order to find any trends in the collected data.", "The type of data collected affects the type of graph used to present it.", "A line of best fit can help to identify and describe relationships between variables.", "Conclusions refer to both the independent and dependent variables when describing the data collected.", "The solubility of a substance could depend upon the size of the solute pieces, the choice or temperature of the solvent.", "The independent and dependent variables, and any measurements taken during an investigation, are recorded in a table.", "Aspects of an investigation that can be changed and measured are known as variables", "The independent variable is what is changed in an investigation", "The dependent variable is what is observed / measured in an investigation", "Variables that are kept the same each time are called control variables", "In a fair test, only the variable being tested is changed so that it is clear that it made a difference to the results"], "6EcosystemsBiology": ["Prey have adaptations to help them avoid being hunted, and predators are adapted to help them capture prey.", "Some common adaptations of prey animals are that they have good camouflage or that they are nocturnal.", "Some common adaptations of predators are big teeth, good eyesight and the ability to run fast.", "Some toxic substances are persistent (they stay in the environment and do not break down).", "If consumed, persistent toxic substances can be passed up the food chain.", "The bioaccumulation of toxic substances can cause damage to organisms, particularly top predators.", "The use of pesticides in farming can cause bioaccumulation.", "Ecosystems are made up of living organisms, which interact and depend on each other, and their physical environment.", "Habitats are where plants and animals live, and they contain living (biotic) and non-living (abiotic) parts.", "Organisms interact with the environment in which they live.", "All species have adaptations which make them suited to their environment.", "Changes to the environment may make it harder for organisms to survive in a particular habitat.", "Producers are organisms that can make their own food, including plants and some microorganisms.", "Consumers (e.g. humans and other animals) cannot make their own food; they get their food by eating other organisms.", "A food chain diagram shows the feeding relationships between populations of organisms.", "The arrows in a food chain diagram represent transfers of biomass.", "A change in the size of a population will affect other populations in the food chain.", "A community of organisms is made up of interacting populations of species.", "A food web diagram represents several interconnected food chains within a community of organisms.", "A change in the size of a population will affect other populations in the food web.", "All consumers, including humans, depend on producers because they make all of the food for the rest of the food chain.", "Plants produce edible seeds and fruits after pollination (transfer pollen from the anthers of flowers to the stigma).", "Many plants depend on animals such as insects to pollinate them, and on animals such as birds to disperse their seeds.", "Because of food chains and pollination, producers and consumers are interdependent.", "Pollinators are important, ensuring there is food security for humans (having enough food to feed the human population).", "Predators are hunters and prey are hunted.", "Different factors can affect the population sizes of predators and prey (e.g. disease).", "There is a relationship between the predator and prey population sizes, each is impacted by changes in the other.", "Biodiversity is the number of different species that live in a place.", "Biodiversity is important as it keeps habitats healthy, and provides humans with food, medicines and other resources.", "Humans have a negative impact on biodiversity through habitat destruction and pollution of the environment.", "Humans can take action to help maintain biodiversity, such as through conservation activities.", "Genetic diversity can be conserved through seed banks and other forms of gene banks.", "Farmers use chemicals called  fertilisers to produce more crops.", "Farmers use chemicals called pesticides to produce more crops.", "Some pesticides kill insects and this helps crops to grow because they are not being eaten.", "Some pesticides kill other plants (weeds) that compete with the crops to grow.", "Fertilisers and pesticides can be harmful to the environment and wildlife."], "7Sound, light and visionPhysics": ["Luminous objects give out light, non\u2013luminous objects do not.", "All surfaces reflect light. Mirror\u2013like surfaces reflect light in a regular way, other surfaces scatter light.", "For anything to be seen, light from it (either emitted or reflected) must enter the eye.", "Light enters the eye through a hole (the pupil) and is detected by the light\u2013sensitive back surface (the retina).", "Beams of light can only be seen if the light hits something and reflects (or scatters) towards an eye.", "Sound reflects from hard surfaces. An echo is when a sound is heard again after reflecting and travelling back.", "Smooth, flat surfaces help to produce echoes. Irregular surfaces reflect sound in many directions, spreading it out.", "The particles of harder materials are held together by stronger forces so sound waves can\u2019t make them vibrate much.", "Soft surfaces absorb a lot of sound because sound waves transfer energy by making the particles in them vibrate.", "Noise (unwanted sound) can be reduced by using soft materials to absorb it or hard materials to reflect it.", "Light travelling in one direction (along a ray) that hits a mirror reflects (bounces off the mirror) in one direction.", "The \u2018normal\u2019 is an imaginary line drawn at 90\u00b0 to the point of reflection.", "The angles of incidence and reflection are measured to the normal.", "The angle of reflection is always equal to the angle of incidence, the other side of the normal.", "On a graph, a line of best fit highlights the main pattern of the data, ignoring small errors.", "Light reflects from mirrors obeying the laws of reflection. Some reflects into our eyes causing an image to be  seen.", "The image in a mirror is located where the light rays seem to have come from.", "A reflection appears to be directly opposite the object, the same distance behind the mirror as the object is in front.", "The image in a mirror is the right way up but is laterally inverted.", "Transparent objects transmit light (let light travel through them). Opaque objects do not transmit light through them.", "Light travels in straight lines at an extremely high speed, spreading out as it travels.", "Light rays are straight arrows added to diagrams to show the direction that some light is travelling.", "A shadow is an unlit area in the shape of an object that is blocking light.", "All sounds are caused by vibrations. Some vibrations are too small or too fast to see.", "The volume of a sound means how loud or quiet it is. The pitch of a sound means how high or low it is.", "Amplitude is a measure of the distance or size of a vibration. The greater the amplitude, the louder a sound.", "Frequency is a measure of how often the vibrations occur. The greater the frequency, the higher the pitch.", "Sounds of different volume and pitch can be produced by controlling the amplitude and frequency of vibrations.", "Sound spreads out and becomes quieter (lower amplitude vibrations) as it travels.", "Sound travels through a medium by vibrations being passed on between the particles of the medium.", "Sound travels faster through liquids than gases as the particles are closer so vibrations can be passed on more easily.", "Sound travels fastest through solids due to strong attractive forces between particles so many vibrate when one does.", "Sound waves are caused by vibrations of particles so sound can't travel through a vacuum (where there are no particles).", "A vibrating object causes nearby air particles to vibrate too.", "Air particles are knocked forwards but then spread backwards when the object moves back.", "Vibrating air particles knock into their neighbours and set them vibrating too, in the same way.", "The pattern of vibrating particles creates a sound wave. Sound does not involve air particles travelling.", "Scientific models often only accurately reflect some aspects of what they represent."], "8Heredity and DNABiology": ["Genetic material is made of DNA.", "DNA is a long chemical molecule, made of two chains of smaller chemical units joined together.", "All of the DNA in a cell is called the genome.", "The chains are spiralled around one another in a double helix, with links across the middle.", "Scientific models of DNA can be evaluated for their strengths and weaknesses.", "DNA is a chemical substance that can be extracted from the cells of organisms such as fruit.", "DNA molecules cannot usually be seen with the unaided eye, but clumps of it can be seen when a lot of it is extracted.", "Observing or following an appropriate method to extract DNA from fruit (e.g. kiwi fruit).", "Discussion of apparatus and techniques used to filter the tissue and extract the DNA.", "Observing and describing the appearance of the DNA after extraction.", "All organisms have a genome, and there are similarities and differences between the genomes of different organisms.", "The genome is made of DNA, wound up into tightly-packed structures called chromosomes.", "Human body cells have 23 pairs of chromosomes, stored in the nucleus; bacteria have one that is stored in the cytoplasm.", "Sections of the DNA in chromosomes are called genes, which store instructions for inherited features and life processes.", "Other sections are non-coding DNA, which contains instructions that controls when the information in genes is used.", "Plant and animal cells are made of parts including a cell membrane, cytoplasm and a nucleus.", "In plant, animal and fungi cells, the genetic material is stored in the nucleus.", "Bacteria are microorganisms and do not have a nucleus; their genetic material is stored in the cytoplasm.", "The genetic material of all organisms is made of a chemical substance called DNA.", "DNA is built from molecules that form a code used as instructions to build inherited features and control life processes", "Reproduction (having offspring) is part of the life cycle of all organisms.", "When organisms reproduce they make offspring of the same kind (species resemblance).", "Heredity is the process of organisms passing on features to their offspring.", "Offspring inherit features from both parents, so they look similar to them and one another (family resemblance).", "Usually offspring vary and are not identical to their parents or one another (except for identical twins).", "Biological features are inherited when genetic material is passed from parents to their offspring during reproduction.", "Genetic material provides instructions for growth and other life processes.", "Only features caused by instructions in the genetic material can be inherited.", "Features caused by lifestyle and the environment cannot be inherited.", "Examples of features caused by genetic information (e.g. eye colour) and by the environment (e.g. scars).", "DNA was discovered in 1869, but scientists did not work out its structure until 1953.", "Scientists collected evidence and shared findings to develop a model to describe the structure of DNA.", "Rosalind Franklin\u2019s team in London used X-rays to produce an image of a DNA molecule in1952.", "Maurice Wilkins from Franklin\u2019s group showed the picture to James Watson from Cambridge.", "Watson and Francis Crick used the picture evidence to complete a model to describe the double helix structure of DNA."], "9Separation techniquesChemistry": ["Chromatography can be used for both separation of minute samples and analysis.", "A pure substance will only produce one spot on a chromatogram.", "A mixture will produce many spots on a chromatogram.", "Comparing chromatograms can help to identify an unknown component in a sample.", "Pencil is insoluble in water.", "Simple distillation is used to separate a mixture containing only two substances.", "Fractional distillation separates mixtures with 3+ substances, or substances with similar boiling points.", "Slower heating during distillation allows for more controlled boiling of individual components.", "If the condenser warms up it becomes less effective and more gas will escape.", "Evaporation can remove solvent from a solution, leading to the production of a saturated solution.", "Crystallisation reforms a solute as crystals from a saturated solution following a change in conditions.", "Solvents evaporate into the air around you during the process of crystallisation.", "Larger crystals form when the solvent evaporates more slowly.", "Heating a solution makes the solvent evaporate more quickly.", "Magnets attract iron and steel", "Insoluble solids can be separated from a liquid using a filter by a process known as filtration.", "Filter paper is folded to make a pocket that fits in a filter funnel for filtering fine particles", "A drop of water on a filter funnel helps keep the filter paper cone open for easy filtering", "Immiscible liquids do not mix and if allowed to settle, one will float above the other.", "Immiscible liquids can be separated by decanting or using a separating funnel.", "If left, miscible liquids do not separate into layers.", "The boiling points of liquids can be used to separate miscible liquids by changing states.", "The properties of the substances in a mixture help to determine the technique best suited to separate them.", "When mixtures contain more than two components, multiple techniques may be needed to separate them.", "Creating a solution of an existing mixture can allow a specific technique to be used for separation.", "Separating salt from rock salt requires: making a solution, filtration, and crystallisation.", "A liquid can be separated from a solution by vaporising it and then quickly condensing it.", "Distillation works due to one part of a solution having a different boiling point than the other part.", "A condenser should be kept cold to speed up condensation.", "The liquid collected (distillate) is pure."], "10Human skeleton and musclesBiology": ["A muscle attached to a bone exerts a force on the bone when the muscle contracts, which makes the bone move.", "Biomechanics is the study of this movement.", "A moment is the turning effect of the force when a bone pivots at a joint.", "The size of the moment when a bone pivots at a joint can be calculated.", "Bones meet at joints.", "Muscles can move bones.", "Muscles can only pull, by contracting, and cannot push.", "Some muscles work together in antagonistic pairs to move bones at a joint.", "The human body contains muscles.", "Muscles are a type of tissue made up of specialised cells.", "Muscles can contract and relax.", "Muscles need sugar and oxygen to contract.", "Different types of muscle have roles in organ systems, including cardiac muscle, smooth muscle and skeletal muscle.", "The human body contains a skeleton made up of bones.", "A joint is where two or more bones meet.", "The skeleton supports the body and provides protection for organs and tissues.", "Bones are made of living tissue made up of cells.", "Red and white blood cells are made in the bone marrow."], "11Heating and coolingPhysics": ["If left for long enough, all objects in a room will reach the same temperature as the room.", "Heating a solid makes its particles vibrate more quickly.", "Heating a liquid makes its particles move around more quickly.", "Heating a solid or liquid causes the separation of its particles to increase.", "Heating a solid or liquid causes it to expand.", "The higher the temperature of a hot drink, the faster its particles are moving.", "A hot drink makes the particles in the air around it move more quickly.", "The particles of a hot drink begin to move less quickly as they transfer energy to the air particles.", "The greater the temperature difference between a hot drink and the air, the faster it cools down.", "It is easier to increase the temperature of some materials than others.", "The mass of particles and the attractive forces between particles are different in different substances.", "Different substances need different amounts of heating to reach the same temperature.", "The same amount of different materials at the same temperature can cause different amounts of heating.", "The higher the specific heat capacity, the more energy 1 kg of a substance has, at a temperature, in the thermal store.", "The directions in which particles in a substance move are random. This is true of solids, liquids and gases.", "The higher the temperature, the faster the particles vibrate in a solid or move past each other in a liquid or gas.", "Energy needs to be transferred to an object to raise its temperature.", "For two identical objects, the one at a higher temperature has more energy.", "For two objects made of the same substance at the same temperature, the one with more particles has more energy.", "Thermometers measure temperature in degrees Celsius (\u00baC).", "Glass thermometers are fragile and need to be handled with care.", "To accurately read the scale on a glass thermometer, your eye needs to be level with the top of the coloured liquid.", "Pure ice melts at 0\u00baC and pure water boils at 100\u00baC.", "If left for long enough, all objects in a room will reach the same temperature.", "Mixing hot water with cold water results in water cooler than the hot water and warmer than the cold.", "When hot and cold water are mixed, the temperature is closer to that of the water there was more of.", "A cold object placed in hot water makes the water particles move more slowly and those in the object move more quickly.", "A hot object placed in cold water makes the water particles move more quickly and those in the object move more slowly.", "The temperature along a thermal conductor increases quickly when it is heated.", "The temperature along a thermal insulator increases very slowly when it is heated.", "In thermal conductors, vibrating particles quickly cause the particles near to them to vibrate as well.", "In thermal insulators, it is hard for vibrating particles to cause the particles near to them to vibrate as well.", "Particle vibrations are passed on more quickly between a hot object and conductor than a hot object and an insulator.", "Materials that contain trapped air provide good insulation because gases are very poor thermal conductors.", "Wrapping an object in an insulator keeps a hot object warm and a cold object cool."], "12DiffusionBiology": ["Particles of a liquid can move through a material by diffusion if the material is permeable.", "Observe a liquid diffusing into a jelly cube.", "Predict and observe effect of temperature on the diffusion of a liquid into a jelly cube.", "Predict and observe effect of cube size on the diffusion of a liquid into a jelly cube.", "Use ideas about particles and diffusion to explain these observations.", "Particles of some substances are small enough to diffuse through holes in a selectively-permeable membrane.", "Particles of these substances move through the selectively-permeable membrane in both directions.", "Predict the direction of net movement of particles through a selectively-permeable membrane.", "Observe the direction of net movement of a substance through a selectively-permeable membrane (e.g. Visking tubing).", "Explain observations of the diffusion of a substance through a selectively-permeable membrane.", "All substances, including the cell cytoplasm and substances within it, are made up of particles.", "Particles of some substances diffuse into and out of a cell by moving through small holes in the cell membrane.", "The particles that make up some substances are too big to diffuse through the holes in the cell membrane.", "The cell membrane is selectively-permeable because only some substances can diffuse through it.", "The net movement of particles through a cell membrane is down a concentration gradient.", "These particles move in random directions and collide all the time.", "Concentration is the number of particles in a volume of liquid or gas.", "The net movement of particles is down a concentration gradient.", "Diffusion is the passive movement of particles of a substance from an area of higher to lower concentration."], "13Climate change and living sustainablyBiologyChemistryPhysics": ["The climate is the average weather conditions for a particular location over a long period of time.", "Emissions of greenhouse gases from human activities are causing global warming and climate change.", "Climate change includes an increase in the frequency of extreme weather events such as droughts, storms and floods.", "Data predict an increased frequency of extreme weather events with increasing global temperature.", "We all need to work together to reduce emissions of greenhouse gases to limit climate change.", "Producing food for humans and other animals uses resources and releases greenhouse gases that lead to climate change.", "Land-use change, farming, processing, transport, retail and packaging all add to the carbon footprint of food.", "Meat and plant-based products have different carbon footprints.", "Food production is more sustainable when it has a smaller, negative impact on the environment.", "Changes in diet and a reduction in food waste can help us eat more sustainably by lowering greenhouse gas emissions.", "Temperature data show an unusual, rapid increase in the Earth's average surface temperature over the last century or so.", "This recent increase in average surface temperature is called global warming.", "There is a correlation between data showing increasing temperature and data showing increasing greenhouse gas emissions.", "Most scientists agree that emissions from human activities are increasing the greenhouse effect, causing global warming.", "Thermal insulators can reduce the energy needed to heat a building.", "Improving a building's insulation makes it easier to heat it using only renewable resources.", "Thermostats can control temperature automatically in different rooms and help reduce unnecessary heating.", "The greater the temperature difference between the inside and outside of a house, the faster it warms up or cools down", "Planting near a house increases the outside temperature on cold days and decreases it on hot days", "Renewable resources do not run out because they are replenished faster than they are used up.", "A resource is sustrainable it is maintained a certain level for as long as it is needed.", "Some resources, such as wood, are only renewable if they are used sustainably.", "We cannot have sustainable transport that uses petrol or diesel fuel.", "Altering the design of a building can make it more sustainable.", "A gardener can use a greenhouse to keep plants warm.", "A greenhouse maintains the optimal temperature range for the growth and survival of the plants.", "A natural greenhouse effect maintains optimal temperature range for life on Earth.", "Greenhouse gases in Earth\u2019s atmosphere cause the natural greenhouse effect.", "Human activities are increasing the amount of greenhouse gases in the atmosphere, increasing the greenhouse effect.", "Waste is often sent to incinerators or landfill sites, which are sources of greenhouse gases.", "Reuse, reduce, recycle is what we can do to minimise waste.", "Sustainable use of resources helps ensure that they are available for future generations."], "1Human digestive systemBiology": ["Carbohydrates, proteins and fats in food are broken down by digestion into smaller molecules that can be absorbed.", "Nutrients are absorbed into the blood, which transports them around the body to where they are needed by cells.", "The molecules of some nutrients are small enough to be absorbed into the blood by diffusion.", "Adaptations of the small intestine lining that increase the amount of absorption.", "Bacteria are living organisms; each bacterium is a microorganism made of a single living cell.", "Some bacteria are pathogens that cause diseases, but many bacteria are harmless and some are helpful.", "Helpful bacteria live inside the human digestive system.", "They release enzymes that digest food we cannot digest ourselves.", "They also help to protect us against pathogens that enter the digestive system by competing against them.", "The differences between mechanical and chemical digestion and where they take place.", "Food is made up of carbohydrates, proteins and fats.", "Enzymes are biological molecules that act as catalysts to speed up chemical digestion of carbohydrate, protein and fat.", "Enzymes digest carbohydrates into starch and sugars, proteins into amino acids, and fats into fatty acids and glycerol.", "Chemical reagents can be used to test for large food molecules including protein, fat, and carbohydrates such as starch.", "Chemical reagents can be used to test for smaller food molecules, such as sugars from the breakdown of starch.", "Interpretation of qualitative food test results.", "Major organs of the human digestive system and the order in which food moves through them.", "The functions of the organs, tissues and glands of the digestive system and how they are adapted to break down food.", "Food that cannot be digested is passed out of the body as faeces."], "2Atoms, elements and compoundsChemistry": ["Reactants are the chemicals that react in a chemical reaction.", "Products are the chemicals that are formed in a chemical reaction.", "The products and reactants in a chemical reaction contain exactly the same atoms.", "The atoms in the products of a chemical reaction are bonded differently to the same atoms in the reactants.", "All matter is made up of atoms.", "Dalton\u2019s model of an atom is of a sphere that cannot be broken up.", "An element is made up of only one type of atom.", "Each element is made of a different type of atom.", "The symbols for each element (each type of atom) a substance contains, appear in its chemical formula.", "Numbers (subscripts) next to chemical symbols in a formula show the numbers of each type of atom in a compound.", "Each compound contains a different combination of elements.", "Some compounds contain the same elements as other compounds, but in a different ratio.", "Hazard symbols are used to decribe the dangers of substances.", "Each element has its own distinct properties.", "Metalloid elements have some properties of metals and some properties of non-metals.", "A compound is made of two or more different elements chemically bonded through a chemical reaction.", "A compound may have different properties to each of the elements that it is made from.", "Metals are good thermal and electrical conductors, they are strong, shiny, malleable and ductile.", "Non-metals are normally poor thermal and electrical conductors, they are not strong, and are dull and brittle.", "Graphite is a non-metal that is a good electrical and thermal conductor.", "Metals are found on the left side and in the middle of the periodic table, non-metals on the right side.", "Many non-metals are in the gas state at room temperature.", "Some non-metals form diatomic molecules that contain two atoms (e.g. O\u2082, N\u2082, H\u2082, Cl\u2082).", "Some non-metals are monatomic and do not form molecules.", "Noble gases are monatomic and are listed in the right-hand column of the periodic table.", "The name of a simple metal\u2013non-metal compound ends '-ide' to indicate bonding has occurred.", "Some common groups of compounds are metal carbonates, metal sulfates and metal nitrates.", "Compounds of metal atoms bonded to -CO\u2083 are called metal carbonates.", "Compounds of metal atoms bonded to -SO\u2084 are called metal sulfates.", "Compounds of metal atoms bonded to -NO\u2083 are called metal nitrates.", "Elements are chemically pure, but can react together.", "Each element has a fixed melting point and boiling point.", "Each element has particular physical properties.", "Each element has particular chemical properties.", "The properties of elements are different from those of a single atom."], "3BiodiversityBiology": ["Animals have adaptations that help them to survive in their environment.", "Some adaptations are physical, such as thick fur.", "Some adaptations are behavioural, such as being nocturnal.", "Changes in the environment can affect animal biodiversity.", "Biodiversity is important to maintain healthy habitats.", "A gene pool is the range of DNA in a species.", "Biodiversity can be maintained by conservation, protection and gene banks.", "Sampling is used to obtain estimates of populations within an area because it would be impossible to count them all.", "There are lots of different sampling methods that can be used to sample plants and animals.", "Sampling is essential for conservation to monitor populations and compare them.", "Quadrats are square frames which can be used to sample plants or slow-moving animals.", "There are different measurements that you can take using a quadrat depending on what you are investigating.", "Most sampling using quadrats is random to avoid bias in your results.", "Classification keys can be used to identify different species.", "The results of ecological sampling can be used to inform conservation and preservation efforts.", "Ecosystems are made up of a community of organisms that interact with each other and their non-living surroundings.", "Organisms in an ecosystem are interdependent because they depend upon each other for the things they need to survive.", "All organisms depend upon producers to make the food that moves through food chains.", "Dead organisms and remains of living organisms provide food for other organisms.", "All living organisms depend upon decomposers that break down dead organisms and recycle useful substances for reuse.", "Biodiversity is a measure of the range of living organisms.", "Living organisms, including plants, have adaptations that help them to survive in their environment.", "Examples of physical plant adaptations include shallow or deep roots, and the presence of spines to deter consumers.", "Plants can also have behavioural adaptations such as growing towards light.", "Changes to the environment can affect plant biodiversity.", "Food chains show feeding relationships between organisms and how food moves from one organism to another in a habitat.", "Biomass is the mass of living material in one or more organisms, and may be estimated.", "Pyramids of biomass show the biomass of organisms at each stage in a food chain.", "Pyramids of biomass use scaled bars to represent the total mass of organisms within a habitat.", "Pyramids of biomass have the producer at the bottom.", "Food chains show the feeding relationships between organisms and the flow of energy through a habitat.", "The number of organisms at each trophic level in a food chain can be used to create a pyramid of number.", "Pyramids of number use scaled bars to represent the number of organisms.", "Pyramids of number have the producer at the bottom."], "4Understanding chemical reactionsChemistry": ["Characteristics of chemical reactions include changes in colour, bubbling, or a change of temperature.", "Bubbles appear when a gas is produced in a chemical reaction.", "In a chemical reaction, atoms rearrange themselves to form new substances.", "Generally, chemical reactions are irreversible.", "Combustion requires fuel, oxygen, and an initial source of energy, usually heat, to start the reaction.", "The term 'burning' describes the reaction of substances with oxygen and is commonly used to refer to visible flames.", "Water is often formed in chemical reactions if oxygen and hydrogen atoms are present.", "Carbon dioxide is often formed in chemical reactions if oxygen and carbon atoms are present.", "Carbon dioxide and water both consist of small molecules that form easily with strong bonds.", "Decomposition reactions involve a single compound breaking down into two or more products.", "Decomposition reactions usually require heat, light, or electricity, to occur.", "When metal carbonates decompose upon heating, they typically form metal oxides and carbon dioxide gas.", "Combustion requires fuel, heat and oxygen, and will not happen without one of them.", "When a substance reacts to combine with oxygen, this is called oxidation.", "Examples of oxidation are combustion and rusting.", "One of the products of oxidation is always an oxide, but the other products vary.", "Precipitation reactions occur when two solutions combine to form an insoluble solid.", "The appearance of a precipitate is evidence that a chemical reaction has occurred.", "Precipitation reactions are important in water treatment, to remove unwanted substances from water.", "Precipitation reactions are used in qualitative analysis, to identify the presence of certain substances in a solution.", "The mass of the products in a chemical reaction is the same as the mass of the reactants.", "Word equations are a simple way of describing chemical reactions.", "Chemical formulae represent the numbers of each type of atoms in a reactant or product.", "Chemical equations represent how the atoms in the reactants rearrange to form the products.", "The arrow in a chemical equation represents the words \u2018changes into\u2019."], "5Moving by forcePhysics": ["The greater the speed of an object, the shorter the time it takes to cover a certain distance.", "The greater the speed of an object, the more distance it travels in a certain time.", "Speed = distance \u00f7 time.", "Speed is measured in m/s or km/h or miles/h.", "m/s is the number of metres travelled each second.", "A resultant force can change the speed of an object.", "The speed of an object changes throughout the time a resultant force is acting on it.", "The greater the gradient (steeper the line) on a distance-time graph, the faster the movement.", "The gravitational force on a falling object is constant.", "The drag force on a falling obejct depends on its speed and shape.", "Objects falling through the air will reach a terminal velocity when the drag and gravitational forces are equal.", "The terminal velocity can be changed by changing the drag force (e.g. with a parachute).", "The larger the surface of a parachute, the bigger its drag.", "Gravity pulls down with a steady force.", "At top speed the force of drag on a parachute is the same size as the force of gravity on the jumper.", "A level line on a distance-time graph shows a stationary object (no movement).", "Upward and downward sloping lines on a distance-time graph show movement in opposite directions.", "The average speed between two points is calculated using speed = change in distance \u00f7 time taken.", "The instantaneous speed of an object is the speed at a particular moment in time.", "For an accurate measurement a person needs to be in line with the observation.", "Manual timing can lead to a range of timing errors.", "Repeat readings can reduce the effect of random errors.", "Some readings are anomalous and these should not be used in caluations of averages.", "A ramp will produce a force that allows a dynamics trolley to roll down it.", "The average speed of the trolley can be found from distance and time measurements.", "Counting down \u20183, 2, 1, go\u2019 helps start a stopwatch at the right moment.", "Observing with eyes in line with the finish line helps stop a stopwatch at the right moment.", "Resultant forces make the movement of things change.", "Friction acts against the direction of movement of an object.", "An object will continue to move at a steady speed in a straight line unless a resultant force is acting.", "The labels on a graph describe what it shows.", "The numbers on the scale of a graph go up in equal amounts.", "The value of each small division is the value of a large division divided by the number of small divisions it contains.", "Each point on a distance-time graph describes where an object is at a point in time (not its speed).", "The speed of an object can be found from distance and time information read from a distance-time graph.", "Streamlining reduces drag.", "Streamlining reduces how much a fluid needs to be pushed out of the way for an object to move through it.", "The drag force on an object moving through a fluid (liquid or gas) increases with speed.", "Streamlining can increase the top speed of a vehicle."], "6Species and classification (differences between species)Biology": ["Similarities and differences in the features of organisms are used to classify them into groups within larger groups.", "Scientists classify every organism into groups from kingdom down to species.", "In larger groups such as kingdoms, there are more organisms with fewer similarities in their features.", "A species is a group of individuals with similar features and genes that can reproduce to make fertile offspring.", "Scientists give each species a binomial name to identify the genus and species.", "Organisms can be classified into groups based on their characteristics at the microscopic, cellular level.", "The common features of the cells of animals, plants, fungi and bacteria.", "Use of cell features to classify organisms into the kingdoms of animals, plants, fungi and bacteria.", "A classification key can be used to find out which groups organisms are classified into.", "A classification key is a series of questions about the features of organisms.", "Classification helps us organise and make sense of biodiversity.", "Make, record and interpret observations of organisms in the field.", "Use a classification key to identify and classify organisms in the field.", "How to work safely in a way that minimises harm to living organisms and disruption of ecosystems."], "7Variation (differences within species)Biology": ["Some features have discontinuous variation (limited variations falling into particular categories).", "Some features have continuous variation (can take any value within a range).", "Examples of features in humans, other animals and plants that show discontinuous and continuous variation.", "Collecting primary data on examples of discontinuous and continuous variation in features.", "Using a histogram or line graph to display continuous data.", "Plotting data for continuous variation on a histogram.", "Interpreting and describing a histogram displaying data for continuous variation.", "Continuous variation is usually influenced by many factors, including genetics, the environment and lifestyle.", "Using a bar chart to display discontinuous data.", "Plotting data for discontinuous variation on a bar chart.", "Interpreting and describing a bar chart displaying data for discontinuous variation.", "Discontinuous variation usually has only a genetic cause and is not affected by environment or lifestyle.", "When organisms reproduce they make offspring of the same kind (species resemblance)", "Offspring inherit features from both parents, so they look similar to their parents and one another (family resemblance)", "Some features are inherited when DNA is passed from parents to offspring during reproduction", "Some features are caused (or changed) by an organism\u2019s lifestyle and environment", "There is usually variation between offspring; they are not usually identical to their parents or one another", "Differences between species are greater than differences within species.", "There are differences in the features of individuals of the same species, and this is called variation.", "Some variation is caused only by the environment (e.g. injuries).", "Some variation is caused only by inherited genetic information in the genome (e.g. blood type).", "Some variation results from a combination of genetic and environmental/lifestyle factors (e.g. body mass)."], "8Earth's resourcesChemistry": ["The melting point of rock is very high.", "Melted rock is called either lava (on Earth's surface), or magma (underground).", "Extrusive igneous rock forms outside Earth's crust, while instrusive igneous rock forms inside the crust.", "Some substances form crystals when they freeze.", "Crystal size depends on the rate at which melted rock cools.", "Components of rocks, such as sand, fossils, shells, crystals, help to indicate how those rocks formed and their age.", "Rocks contain grains which can be round or interlocking.", "Some rocks contain crystals that point in many directions while others are aligned.", "Rock types and textures provide insights into geological processes and Earth's history.", "In a crystal, the atoms are all arranged in a very regular pattern.", "In some substances, very high pressure, at a high temperature, can push particles together to form crystals.", "Between tectonic plates, the pressure and temperature are high enough for large crystals to grow inside solid rock.", "Metamorphic rocks form under extreme pressure and temperature, altering original structures.", "Aligned crystals in metamorphic rocks give them useful properties (e.g. decoration or easily separated into sheets).", "Rocks consist of minerals and rock fragments.", "A mineral is a naturally occurring pure substance (an element or a compound) that has a crystal structure.", "Minerals are identified by their crystal structure, composition, and physical properties.", "Earth is a spherical, rocky planet with a thin crust, partially covered in water.", "Under Earth\u2019s crust is a dense rocky layer, called the mantle.", "In the centre of Earth is a solid metallic core surrounded by a liquid outer core.", "Temperature and pressure increases towards the centre of Earth, making the inner core extremely hot and solid.", "Scientists use models to better understand phenomena, including Earth's structure.", "Occurrences of earthquakes and volcanic eruptions suggest Earth\u2019s layers are not static but interact with each other.", "Evidence, such as rock formations and fossils, supports the idea that the continents were once all joined up.", "Earth\u2019s crust is broken into pieces known as tectonic plates, which move very, very slowly.", "Plate tectonics is a scientific theory that explains how tectonic plates move and interact with each other.", "Plate tectonics help scientists better understand and predict changes to Earth\u2019s surface.", "Sedimentary rocks contain distinct grains that are stuck together.", "Sedimentary rocks may contain fragments of shell or fossils, or larger pieces of grit or pebbles cemented together.", "Igneous rocks contain crystals that point in many directions; metamorphic rocks contain crystals that mostly line up.", "Rocks that contain interlocking grains or interlocking crystals are non-porous; rocks that don't are porous.", "The properties of rock influence their uses."], "9Series circuitsPhysics": ["The voltage of a battery measures the strength with which it can \u2018push\u2019 current around a circuit.", "The voltage of a component in an electric circuit measures the size of \u2018push\u2019 that is moving current through it.", "The voltage across each component in an electric circuit adds up to the voltage of the cell or battery.", "A battery can be made of several electrical cells added together.", "The voltage of a battery made of electrical cells added in series is equal to the voltages of the cells added together.", "One end of a battery has a positive charge and one end has a negative charge, because of chemical reactions inside it.", "A battery pushes electric charge (electrons) one way round a complete circuit.", "There are electric charges in all atoms of the wires and components in a circuit, even when it is not turned on.", "When a circuit is turned on, electrons everywhere in the circuit start moving at the same time.", "Individual electrons move round a circuit slowly, at a speed of just a few millimetres each second.", "The path current flows through a filament bulb can be traced, from one connection and through the filament to another.", "In a faulty filament bulb, the filament is broken and current cannot flow through it.", "A circuit is not complete if there are any gaps in the circuit, or hidden in faulty wires or components.", "A wire or component can be tested by putting it into a simple circuit with a battery and bulb.", "A circuit with one faulty component will work if a wire is used to bypass the faulty component.", "The names and symbols of the basic components of an electric circuit.", "A series circuit is an electric circuit with one complete loop from one end of a battery to the other end.", "A circuit is built systematically following a circuit diagram in one direction, starting from any point.", "A circuit diagram is drawn systematically, following the circuit in one direction, starting from any point.", "Wires in a circuit diagram are drawn using a ruler for clarity, with no gaps that would indicate a break in the circuit.", "An ammeter is used to measure the size of an electric current.", "An ammeter measures the current flowing through it without affecting the current in the circuit it is connected into.", "Electric current is measured in amps (A), which is short for amperes.", "The current in a series circuit is the same everywhere.", "Adding a component to a series circuit changes the current everywhere, on both sides of the component.", "Voltage is a commonly used term for potential difference.", "A voltmeter measures the voltage supplied by a cell or battery or across a component.", "A voltmeter is connected across the terminals of a cell, battery, or component.", "Voltage (or potential difference) is measured in volts (V).", "The voltage of a cell or battery indicates the force 'pushing' electric charges around a circuit.", "Some objects can be charged by rubbing with certain materials.", "Objects with a static electric charge can exert a force on other objects (that contain electric charge).", "The electrostatic force acts at a distance.", "Objects with opposite electric charges attract each other.", "Objects with the same electric charge as each other repel each other.", "Atoms contain positive and negative electric charges.", "The particles in atoms with a negative electric charge are called electrons.", "Electrons can sometimes be transferred from one object to another, depending on the materials the objects are made of.", "Metals are difficult to charge because electric charge flows through them, preventing charge from building up.", "When static electricity builds up, it can be useful but also problematic."], "10Reproduction in humansBiology": ["Sperm and egg cells are the sex cells of humans and are called gametes.", "Humans reproduce through sexual reproduction where half the genetic material of the offspring comes from each parent.", "Fertilisation occurs in the fallopian tubes when gametes join to form a zygote.", "Each gamete carries half the genetic material of the parent; a zygote has a full set of genetic material.", "The zygote divides to form a ball of cells called an embryo, which grows to form a foetus and then a baby.", "A zygote divides to become an embryo, which then develops into a foetus made of different cells and tissues.", "The human gestation period is about 40 weeks.", "The foetus grows in an amniotic sac which is filled with amniotic fluid for protection.", "The mother provides all the nutrients that the growing foetus needs and gets rid of waste products through the placenta.", "During birth, the cervix opens and the uterus wall contracts to push the baby out through the vagina.", "Some substances can pass through the placenta including some drugs, alcohol and chemicals in cigarette smoke.", "This can affect the growth of the foetus.", "Short term consequences can include miscarriage, premature birth and low birth weight.", "Long term consequences can include addiction, sudden infant death and foetal alcohol spectrum disorder.", "The function of the male reproductive system is to produce sperm cells.", "Sperm cells are made and stored in the testes.", "Females are born with all their eggs inside their ovaries, each month an egg is released.", "The testes and the ovaries make hormones.", "The male and female reproductive systems must work together to produce offspring.", "All living organisms have a life cycle.", "All life cycles include stages of growth and reproduction.", "In humans, the reproduction stage of the life cycle involves producing a baby that grows into a new human.", "In some plants, the reproduction stage of the life cycle involves producing a seed that grows into a new plant.", "During puberty in humans, the male and female bodies undergo changes.", "The reproductive systems mature to enable adult humans to reproduce.", "Other changes also prepare the body for reproduction.", "The changes happen because of sex hormones being produced.", "Females and males undergo some common changes but also changes that are specific to each sex.", "All living things develop from other living things; reproduction is the process of making new living things (offspring).", "When organisms reproduce they make offspring of the same kind (species resemblance).", "Offspring inherit features from both parents so they look similar to their parents and one another (family resemblance).", "Features are inherited when genetic material (DNA) is passed from parents to their offspring during reproduction.", "The genetic material (DNA) contains the instructions for building our body and its features.", "Adult human females have a menstrual cycle that prepares them for sexual reproduction", "On average the menstrual cycle is 28 days", "In each cycle, an egg cell is released from an ovary (ovulation)", "After ovulation, the uterus lining breaks down and leaves the body (menstruation)"], "11Fuels and energeticsChemistry": ["Burning a fuel transfers energy by heating its surroundings.", "Heating water in a boiling tube allows the amounts of energy transferred by different fuels to be compared.", "The mass of fuel used needs to be the same for each measurement.", "The temperature and volume of water being heated needs to be the same for each measurement.", "State changes are visible as plateaus on cooling curves.", "As it cools, a substance transfers energy into the surroundings by heating and it may condense or freeze.", "Energy is released to the surroundings as a substance cools and this is observed as a decrease in substance temperature.", "Graphs provide a visual representation of data for easier analysis and help identify trends/patterns.", "An exothermic chemical reaction causes an increase in temperature (of the surroundings).", "An endothermic chemical reaction causes a decrease in temperature (of the surroundings).", "An exothermic reaction transfers energy from the reactants to the surroundings.", "An endothermic reaction transfers energy from the surroundings to the products.", "Heating transfers energy into a substance and can cause it to melt, evaporate or boil.", "Melting, evaporation and boiling are endothermic.", "Condensing and freezing are exothermic.", "Over half of the electricity in the UK is generated from the Sun, wind and falling water.", "Many power stations in the UK burn natural gas and oil to heat water into steam.", "The moving steam in power stations pushes turbines, which drive electric generators that produce electricity.", "Natural gas and oil are fossil fuels used in power stations; coal is no longer used in UK power stations.", "Natural gas, oil, waste and wood are fuels that produce greenhouse gases and pollutants when burned.", "Renewable energy resources will not run out because they are replenished more quickly than we use them up", "Electricity can be generated by spinning coils of wire in an electric generator with a turbine", "Turbines can be spun using falling water or wind", "Turbines can be spun using moving steam made by burning biomass, oil or gas", "Solar panels produce electricity without electric generators"], "12Making imagesPhysics": ["A pinhole camera is an empty, closed box with a tiny hole on the front face and a screen on the back face.", "Light moves in straight lines from a light source, through the pinhole, to the screen at the back of a pinhole camera.", "Light from each different point on the object falls on a different single point on the screen, forming the image.", "The image produced by a pinhole camera is dim and inverted. Adding more holes produces multiple images.", "Making the hole larger makes the image brighter but blurred. More light passes through the hole in more directions.", "Some of the light from objects can pass through a lens and become focused to form an image on a screen.", "Some light from every point on an object passes through every part of a lens.", "A convex lens refracts light rays so they travel more towards each other. A point where rays meet is called a focus.", "All the rays from one point on the object are focused to the same point, forming the corresponding part of the image.", "The shape of a converging lens refracts (bends) light more at the edges than near to the centre.", "Reflections are the same size as the object, upright, and the same distance behind the mirror as the object is in front.", "In a plane mirror, reflections appear laterally inverted compared to the object when it is facing us.", "Mirrors reflect what is in front of them. Reflections are laterally inverted as objects are turned to face a mirror.", "Reflections are virtual images; they appear where light rays seem to have come from, not where they actually come from.", "Virtual rays show where light rays appear to have come from; they are drawn as dashed lines.", "Colour is detected in the eye by the R, G and B \u2018cone cells\u2019 that each detect a range of colours of light.", "The colour of an object in white or coloured light depends on the amounts of R, G and B light it is reflecting.", "White objects reflect all colours of light so look the same colour as the incident light (whether white or coloured).", "The colours of light that an object does not reflect are absorbed. Black objects absorb all colours of light.", "In red/green/blue light, an object will appear red/green/blue if it reflects that colour, and black if it does not.", "Light changes direction when it moves into a new medium (material) at an angle to the normal. This is called refraction.", "When light enters a transparent material from air, it turns towards the normal.", "When light leaves a transparent material and re\u2013enters air it turns away from the normal.", "A ray that enters and leaves glass through parallel sides ends up in its original direction, but displaced to the side.", "Refraction can cause virtual images of objects to appear where light seems to be coming from.", "All colours of light can be created by mixing the primary colours of light; red, green and blue.", "Mixing equal amounts of two primary colours creates a secondary colour. All three mixed in equal amounts makes white.", "The retina, on the back of the eye, detects light. When there is no light, we see black.", "On the retina, three types of cone cell detect either red, green or blue light, and rod cells detect brightness.", "Display screens are made of tiny red, green and blue lights (pixels) which vary in brightness to make different colours.", "White light from the Sun and light bulbs consists of light of all the colours in the visible light spectrum (a rainbow).", "A transparent triangular prism can split up sunlight into a visible light spectrum.", "The visible light spectrum shows the range of colours that light can have.", "Cone cells in the eye detect colour. There are 3 kinds (R, G and B); each is sensitive to a range of colours of light.", "The colour we see depends on which cone cells are triggered to send a signal to the brain."], "13Diet and exerciseBiology": ["Food groups include protein, carbohydrate, lipids/fats, water, minerals, vitamins and fibre.", "Each food group plays a role in maintaining a healthy body.", "A balanced diet is needed to maintain good health.", "People need different amounts of particular nutrients at different times in their lives, depending on their lifestyle.", "Different foods provide different amounts of energy.", "The amount of energy provided by different foods can be investigated and compared by burning them.", "Burning foods can heat water and the temperature change of the water measured.", "The mean temperature change can be calculated from repeat measurements.", "Energy provided by the food (J) = mass of water (g) \u00d7 rise in temperature (\u00b0C) \u00d7 4.2.", "Food is a source of building materials to make biomass for growth and repair.", "Food also provides the fuel for cellular respiration, to provide energy for life processes.", "Different individuals require different daily amounts of food and energy.", "Food labels contain information on the content of the food and daily recommended amounts of nutrients and energy.", "The amount of energy provided by food can be compared in kilojoules or calories.", "People have both physical health and mental health.", "Physical health and mental health range from good to ill.", "Changes in normal body appearance, function and behaviour can be symptoms of ill health.", "Not consuming a balanced diet can lead to ill health.", "Body mass index (BMI) is calculated from a person\u2019s height and body mass.", "Consuming too much food can cause BMI to become too high, and lead to obesity.", "Effects of obesity on the human body.", "Obesity can increase the risk of developing other health issues, including heart disease.", "Not consuming enough food can cause BMI to become too low, and eventually lead to starvation.", "Deficiency diseases are the result of not consuming enough of a particular nutrient.", "The recovery time is the time it takes for the heart rate to return to its resting rate after exercise.", "Heart rate in beats per minute (bpm) can be measured by taking a person's pulse.", "A line graph can be plotted showing pulse rate or heart rate over time after exercise.", "A person's recovery time can be determined from the line graph.", "People who are fitter have a shorter recovery time.", "Identifying independent variable (amount of exercise) and dependent variable (heart rate or breathing rate).", "Identifying control variables (the person and the length of time spent exercising).", "The independent variable (amount of exercise) is categoric data and goes on the x-axis of a bar chart.", "The dependent variable (heart rate or breathing rate) goes on the y-axis of a bar chart.", "Using knowledge of cellular respiration to explain the results.", "Exercise is activity requiring physical effort.", "Regular exercise is beneficial for good physical and mental health.", "Exercising causes increases in breathing rate and heart rate as cells need more oxygen for cellular respiration."], "14Climate change and greenhouse gasesChemistryPhysics": ["Global surface temperatures are calculated from tens of thousands of measurements worldwide", "Temperatures are compared with the long-term average for each region", "Since the industrial revolution, in the 1850s, overall global surface temperatures have been increasing", "Evidence from trees rings and ice cores provides data of longer-term changes in temperature", "Scientists can explain how increased levels of greenhouse gases contribute to global warming", "Increasing levels of greenhouse gases in the atmosphere is leading to global warming and climate change", "Carbon dioxide is a greenhouse gas, released by living organisms and produced when burning fuels", "Methane is a greenhouse gas, released by living organisms and from the ground", "Methane is a more potent greenhouse gas than carbon dioxide", "Reducing greenhouse gas emissions can reduce the rate of global warming and may even help to reverse it", "Greenhouse gases in the atmosphere keep it warmer than it would be without them.", "Heating from the Sun controls the average temperature of Earth.", "Increased temperatures melt ice sheets more quickly, moving more water into the sea, making sea levels rise.", "More sea ice melts in summer, but this does not add water to the sea or raise sea levels.", "Warmer oceans and seas expand, causing sea levels to rise.", "Burning fuels for transport produces greenhouse gases, other pollutant gases, and particulates.", "Petrol and diesel vehicles burn fuels, while electric vehicles do not, but fuels may be burned to generate electricity.", "The energy use of planes, trains, cars, ships, and buses can be compared.", "Vehicles use energy and resources during manufacturing.", "Parts of vehicles may become waste at the end of their useful lives.", "Carbon capture and storage separates CO\u2082 from other emissions and stores it in suitable deep underground locations", "Carbon capture and storage can reduce CO\u2082 emissions but is very expensive", "The energy sector uses fuel for heating, electricity generation and transport as well as manufacturing and construction", "The energy sector produces approximately 75% of global greenhouse gas emissions", "Greenhouse gas emissions can be reduced by using less energy and switching to renewable energy sources", "Cars use more energy to travel 100 km if they are heavier or travel at higher speeds.", "Cars use less energy if their tyres are inflated to the correct air pressure", "Walking and cycling regularly improve a person\u2019s physical health", "Well-planned infrastructure for cycling, walking and public transport make it easier and safer to travel without a car", "Renewable energy resources will not run out because they are replenished more quickly than we use them up", "Electricity can be generated by spinning coils of wire in an electric generator with a turbine", "Turbines can be spun using falling water or wind", "Turbines can be spun using moving steam made by burning biomass, oil or gas", "Solar panels produce electricity without electric generators"], "1Breathing and respirationBiology": ["The lungs are made up of tiny air sacs called alveoli.", "Gas exchange takes place between air in alveoli and blood in capillaries.", "There are millions of alveoli to increase the surface area of the lungs for gas exchange.", "The walls of the alveoli are one cell thick to create a short diffusion distance for gas exchange.", "The alveoli are surrounded by capillaries carrying blood, to maintain a concentration gradient for gas exchange.", "Aerobic cellular respiration requires oxygen.", "The reactants and products of aerobic cellular respiration can be summarised using a word equation.", "Aerobic cellular respiration takes place in the mitochondria and cytoplasm of animal, plant and fungi cells.", "Cells that require more energy, because they do a lot of work, have more mitochondria.", "In microorganisms, anaerobic cellular respiration produces carbon dioxide and a type of alcohol called ethanol.", "A word summary of the reactants and products of anaerobic cellular respiration in microorganisms.", "Anaerobic cellular respiration in microorganisms is also called fermentation.", "Humans use fermentation in microorganisms to make useful products such as bread, yogurt and alcoholic drinks.", "Anaerobic cellular respiration takes place without using oxygen.", "In humans, anaerobic cellular respiration produces lactic acid, which can cause muscle cramps.", "Word summaries of the reactants and products of aerobic and anaerobic cellular respiration in humans.", "Anaerobic cellular respiration takes place only in the cytoplasm of cells and does not involve the mitochondria.", "Anaerobic cellular respiration provides less energy than aerobic cellular respiration, but provides energy more quickly.", "Humans and other animals breathe to move air in and out of their lungs.", "Cells need oxygen from the air for cellular respiration, to provide energy for life processes.", "Cellular respiration produces carbon dioxide as a waste product.", "Oxygen needs to be absorbed into, and carbon dioxide needs to be removed from, the human body.", "In gas exchange, oxygen diffuses from the lungs into the blood; carbon dioxide diffuses from the blood into the lungs.", "Cellular respiration is a chemical process that uses glucose, from food, as a fuel to provide energy for life processes.", "Examples of life processes that require energy from cellular respiration.", "Cellular respiration happens in all living organisms all the time to provide the energy to keep them alive.", "Differences betw
