een breathing and respiration.", "The vital capacity of the lungs is the maximum volume of air that can be exhaled after inhaling fully.", "How to measure vital capacity using simple apparatus.", "The closer a measurement is to the true value, the more accurate it is said to be.", "An estimate is an approximate (rough) value of a quantity (without taking accurate measurements).", "An estimate of lung volume can be calculated from a measurement of vital capacity.", "The structures and functions of the gas exchange system in humans.", "The mechanism of breathing, including the role of muscles, to move air in and out of the lungs.", "A pressure model to explain the movement of gases during breathing."], "2Acids and basesChemistry": ["Edible acids have a sour taste.", "A base is any substance that reacts with acids to form a compound called a salt.", "Alkalis are soluble bases, and form alkaline solutions.", "Some acids and alkalis are corrosive and can cause chemical burns.", "An acid turns blue litmus paper red, an alkali turns red litmus paper blue.", "When a metal reacts with acid bubbles may form, it is exothermic and the metal reduces in size (disappears).", "Different metals have varying reactivity with acids.", "When a metal reacts with an acid, the products are a metal salt and hydrogen gas.", "The word equation for a metal and acid reaction is: metal + acid \u2192 metal salt + hydrogen.", "The test for hydrogen gas is to introduce a lit splint, which will make a squeaky pop in hydrogen.", "A group of one carbon atom and three oxygen atoms bonded together is called a carbonate group.", "Metal carbonate + acid \u2192 salt + water + carbon dioxide", "The test for carbon dioxide gas is to bubble it through limewater as it turns the solution cloudy (milky).", "Rain water is usually a little acidic and when it is more acidic than normal it is called acid rain.", "Acid rain reacts with marble to produce a salt, water and carbon dioxide, using up some of the marble.", "Neutralisation reaction general equation is: base + acid \u2192 metal salt + water.", "Sodium hydroxide has the formula NaOH(aq) and hydrochloric acid has the formula HCl(aq).", "In a neutralisation reaction, the metal salt formed is named after the metal (from the base) and acid used.", "Common bases include metal oxides and hydroxides.", "(s), (l), (g) and (aq) in chemical equations identify the state of each substance as solid, liquid, gas or in solution.", "A metal oxide consists of metal atoms bonded to oxygen atoms.", "Metal oxides are bases and can react with acids to neutralise them.", "Metal oxide + acid \u2b62 metal salt + water", "A non-metal oxide consists of non-metal atoms bonded to oxygen atoms.", "Non-metal oxides in water make acidic solutions.", "Most acids and alkalis are colourless solutions, so indicators can be used to identify them.", "pH stands for \u2018potential of hydrogen\u2019 and acids contain hydrogen.", "The higher the concentration of hydrogen, the lower the pH.", "The pH scale goes up and down in factors of ten, so an acid of pH 2 is ten times more acidic than pH 3.", "A low pH means acidic, a high pH means alkaline and solutions with a pH of 7 are neutral.", "Red cabbage solution is pink or red in an acid, purple in a neutral solution, and green in an alkali.", "Different chemical indicators have their advantages and disadvantages.", "Universal indicator will turn many different colours depending on pH."], "3Magnets and electromagnetsPhysics": ["The more turns of wire in the coil of an electromagnet, the stronger its magnetic field.", "The greater the current through the coil of an electromagnet, the stronger its magnetic field.", "The more closely spaced the coils of wire of an electromagnet, the stronger its magnetic field.", "An electromagnet made from bare wire will not work if adjacent turns are touching.", "A soft iron core increases the strength of an electromagnet because it becomes magnetised when it is turned on.", "When there is an electric current in a wire, there is a magnetic field around the wire.", "When there is an electric current in a coil of wire, the magnetic field around each loop adds to make a stronger field.", "An electromagnet is made by wrapping a coil of wire around a core.", "An electromagnet is a magnet that can be turned on with an electric current, and turned off.", "All magnets have a north\u2013seeking pole and a south\u2013seeking pole.", "Unlike magnetic poles attract each other, and similar magnetic poles repel each other.", "Magnetic materials are attracted to both north\u2013seeking and south\u2013seeking magnetic poles.", "Just three metal elements (iron, cobalt and nickel) are magnetic; other metal and non\u2013metal elements are not magnetic.", "A north\u2013seeking pole will point towards the North Pole because Earth has a magnetic field.", "The needle of a plotting compass lines up with the magnetic field of a magnet.", "A magnetic field line can be followed from the north\u2013seeking pole to the south\u2013seeking pole of a magnet.", "Arrows on magnetic field lines show the direction in which the north\u2013seeking pole of another magnet would be forced.", "The magnetic field of a bar magnet is symmetrical.", "Magnetic field lines do not cross over and are continuous.", "An electromagnetic door lock uses an electromagnet to pull a magnetic bolt to unlock a door.", "An electric bell often contains an electromagnet that attracts and moves the striker, making it hit the bell.", "As an electromagnet moves the striker in an electric bell, it breaks its own circuit to let the striker spring back.", "A motor contains a spinning coil of wire that is an electromagnet.", "When there is a current in the spinning coil of wire in a motor, other magnets around it will push it round."], "4Plant nutrition and photosynthesisBiology": ["Plant leaves are made up of cells that contain structures called chloroplasts.", "Photosynthesis takes place in chloroplasts.", "Chloroplasts contain chlorophyll, which absorbs light for photosynthesis.", "Plant leaves are thin to allow light to pass through to cells containing chloroplasts.", "Plant leaves have a large surface area to absorb light for photosynthesis.", "Plant leaves take in carbon dioxide gas from the air for photosynthesis", "The oxygen made by photosynthesis is released as a gas from leaves into the air", "This process is called gas exchange", "Leaves have small holes in their surface called stomata for gas exchange", "Molecules of gases move through open stomata by diffusion", "Producers make their own food using a process called photosynthesis.", "Photosynthesis can only happen when there is light.", "Photosynthesis is a series of chemical reactions that take place inside cells.", "The reactants of photosynthesis are water and carbon dioxide, and the products are oxygen and glucose (a carbohydrate).", "Photosynthesis involves many chemical reactions; a word summary of the reactants and products is a model of the process.", "Plants are living organisms that need light, air, water and minerals to stay alive and grow", "Plants take in light and gases from air through their leaves, and take in water and minerals through their roots", "Water and minerals are not food, but plants do need food to stay alive and grow", "Plants do not take in food from their surroundings, they are producers that make their own food", "The food that plants make is carbohydrate, which they use for growth and as a source of energy"], "5MaterialsChemistry": ["A catalyst speeds up a chemical reaction without being used up or chemically changed.", "Catalysts are specific to particular reactions; different reactions require different catalysts.", "Enzymes are biological catalysts that speed up reactions in living cells.", "A more reactive metal will displace another that is less reactive from its salt, in solution.", "In a displacement reaction magnesium displaces copper from copper sulfate(aq) to form magnesium sulfate (aq) and copper.", "Displacement reactions can be used to confirm the position of a metal in the reactivity series for metals.", "A metal ore is typically rock that contains a metal in a form that can be extracted.", "Carbon can be used to extract some metals from their ores when carbon is more reactive.", "Metals are good thermal and electrical conductors, they are strong, shiny, malleable and ductile.", "Ceramics are made from soft substances, becoming hard and brittle when heated.", "Plastics are made from polymers and there are many types of plastics with very different properties.", "An alloy is a mixture of elements including at least one metal.", "Composites combine materials to create a new material with improved properties.", "Polymers are made from small molecules called monomers that join together to form very long chains of atoms.", "Some polymers have high melting points because their molecules are hard to separate.", "Polymers can be made synthetically, but some also exist naturally.", "A plasticiser added to a polymer gets between polymer molecules and allows them to move over each other more easily.", "Cross-links between polymer molecules can make a polymer harder and less flexible.", "Some metals react with acid to produce a metal salt and hydrogen gas.", "Some metals react with water to produce a metal hydroxide and hydrogen gas.", "Some metals react with oxygen to form a metal oxide.", "The reactivity series for metals shows how vigorously metals react, compared to each other.", "The higher the position of a metal in the reactivity series, the more vigorously it is likely to react."], "6Hidden forcesPhysics": ["The whole of an object is floating on water if part of it is above the surface.", "How well an object floats in a liquid does not depend on the depth of the liquid.", "An object floats in water if its shape can push its own mass of water out of the way without going under.", "The mass of an object is measured in kilograms.", "A force of about 10 N is needed to lift 1 kg on Earth.", "On Earth, a 1 kg mass pushes down on a surface with a force of about 10 N.", "There are 1000 g in 1 kg.", "Gravitational force, W = m \u00d7 g", "A line of best fit can show the relationship between variables clearly.", "The extension of a spring increases the same amount for each equal sized increase in force.", "The extension of a spring is directly proportional to the force applied.", "A spring is elastic because it returns to its original length when a force is removed.", "Hooke's law describes the behaviour of springs.", "Levers can multiply a small force into a larger force.", "Levers can multiply a small movement into a larger movement.", "There are different types of lever, each with the pivot in a different position.", "Pressure is a measure of how concentrated a force is.", "Pressure = force \u00f7 area.", "Pressure is measured in newtons per square metre or per square centimetre.", "Another name for newtons per square metre is the pascal (Pa).", "The bigger the surface area of a boat\u2019s hull, the bigger the upthrust on it can be.", "Pressure in liquid increases with depth because there is more liquid pushing down.", "Pressure in the atmosphere reduces with height because there is less air pushing down.", "A rubber band is elastic because it returns to its original length when a force is removed.", "The extension of a rubber band increases different amounts for each equal sized increase in force.", "The extension of a spring is not directly proportional to the force applied.", "The extension pattern is explained by the behaviour of molecular chains in the rubber.", "Applying a force to a spring will make it extend (stretch).", "A range of masses suspended on a mass holder will produce constant and measurable forces on a spring.", "A set square ensures measuring scales are vertical.", "Diagrams show how equipment should be set up.", "More force is needed to hold up a bigger mass up in the air.", "The bigger the mass on a beam, the more the beam bends.", "The more a beam bends, the greater the force it pushes back with.", "The bigger the mass on a floor, the more particles in the floor are squashed together.", "The more particles in a floor are squashed together, the greater the force they push back with.", "A moment causes turning.", "Moment = force \u00d7 (perpendicular) distance from the pivot.", "Moments are measured in Newton-metres (Nm)."], "7Adaptations, competition, natural selection and evolutionBiology": ["A simple model can be used to demonstrate natural selection, e.g. picking up green and white cocktail sticks from grass.", "The model can be used to make predictions about how a population will change over time due to natural selection.", "The prediction may change if the environmental conditions change (e.g. if the grass becomes frosty/snowy).", "Species have features which make them well suited to survive in their environment.", "These features are called adaptations.", "Examples of adaptations of particular species of animals and plants.", "How particular adaptations provide an advantage in the environment in which the species lives.", "All living organisms need resources from their habitat to enable them to survive.", "Resources are limited, so individuals are in competition for them.", "Organisms compete for resources such as food, water, space, shelter, light, mates, pollinators and seed dispersers.", "Variation means some individuals are better adapted to compete more successfully than others.", "These individuals have the best \u2018fit\u2019 to their environment.", "Natural selection can cause the common characteristics of a species to change (evolve) over generations.", "Scientists explain evolution using the theory of evolution by natural selection.", "A scientific theory is a general explanation, developed from evidence, that explains many different examples.", "Evolution is not planned in advance; new advantageous features appear randomly and are maintained by natural selection.", "Changes in the features of an individual within its lifetime are not evolution.", "Fossils provide evidence about organisms from long ago and their habitats.", "All fossils are the mineralised remains of once-living organisms or of traces left behind by organisms.", "Fossils show that some species have gone extinct.", "Fossils show that the features of some species have changed over time.", "There are limitations to the conclusions and explanations that can be made from fossil evidence.", "There are differences in the features of individuals of the same species, and this is called variation.", "Some variation is caused by the environment (e.g. injuries) or lifestyle (e.g. exercising to grow big muscles).", "Environmental variation is not heritable, it cannot be passed on to offspring.", "Some variation is caused by genetic information (e.g. the instructions for making claws or camouflaged skin).", "Genetic variation is heritable, it can be passed on to offspring.", "Variation within a population of a species means some individuals are better adapted to compete and survive.", "The fittest (better adapted) individuals are more likely to survive to reproduce.", "These individuals are more likely to pass on heritable, advantageous features to their offspring.", "This is natural selection, and causes the advantageous features to become more common in each generation of offspring.", "Changes in environmental conditions, including changes caused by humans, can affect natural selection.", "Evidence suggests Earth was formed 4.5 billion years ago (one billion is one thousand million).", "Evidence suggests the first living organisms (microorganisms) appeared around 3.8 billion years ago.", "The oldest fossils are around 3.5 billion years old, and the newest fossils are around 10 thousand years old.", "Evidence suggests the first land plants appeared 500mya, the first mammals 200mya, and modern humans 350k years ago.", "Scientists divide Earth\u2019s history into eons, periods and epochs to make it easier to understand."], "8Carbon cycle and climate changeChemistry": ["When fuels containing carbon are burned, it is common for carbon dioxide to be made.", "Carbon dioxide is a compound with molecules that each contain one carbon atom and two oxygen atoms.", "About 0.04 % of Earth\u2019s atmosphere is carbon dioxide.", "Carbon dioxide is a greenhouse gas.", "Too many greenhouse gases in the atmosphere cause an increase in average global temperature, known as global warming.", "Coal is a sedimentary rock that burns because it is made mostly of carbon, with some impurities.", "Coal is formed from deep sediments of organic matter made of prehistoric plants.", "Oil and gas formed from dead plankton mixed in with sediments that formed millions of years ago.", "Oil and natural gas are found in pores of sedimentary rock.", "The organic matter that formed coal, oil and natural gas decomposed into hydrocarbons.", "Water in nature always contains minerals.", "Sediments are deposited when wind or waterways slow down or when glaciers melt.", "Layers of sediment form over many years, leading to compaction.", "Sedimentary rock forms when sediment is buried and compressed, and salts from fluids cement the grains together.", "Strata can be used to create a relative timeline and provide clues to the environment when the sediments were deposited.", "Fossils are found in sedimentary rock, but not in other types of rock.", "Fossils are often the remains of living plants or animals.", "Bones buried in sedimentary rock can be very, very slowly dissolved by water and replaced by minerals in the water.", "Geological activities can break or completely destroy fossils.", "Earth\u2019s atmosphere is mostly within 7 to 15 km of its surface.", "Earth's atmosphere is 78% N\u2082 and 21% O\u2082, with very small amounts of other gases and particles of liquids and solids.", "Greenhouse gases keep Earth\u2019s temperature warm enought for human life.", "The test for oxygen gas is that it relights a glowing splint.", "The test for carbon dioxide gas is that it forms a white precipitate that turns limewater milky.", "Weathering is the slow breakdown of rocks on Earth's surface. It happens while the rocks are \u2018in place\u2019.", "Erosion is the process that removes material from where bedrock has been broken down or weathered.", "Rock can be weathered biologically, chemically or physically.", "Rock can be eroded by the wind, rain, or by flowing streams and rivers, oceans, ice flows or gravity.", "Small changes caused by weathering and erosion can have large impacts over time.", "Combustion increases the amount of carbon dioxide in the atmosphere.", "Respiration of living things increases the amount of carbon dioxide in the atmosphere.", "Decomposition of dead plants and animals increases the amount of carbon dioxide in the atmosphere.", "Photosynthesis by plants, phytoplankton and some bacteria reduce the amount of carbon dioxide in the atmosphere.", "Carbon dioxide can dissolve in the oceans."], "9WavesPhysics": ["Sound waves cause our eardrums, tiny bones within our ears, and the cochlea to vibrate.", "Specialised cells in the cochlea sense vibrations and cause electrical signals to be sent to the brain along a nerve.", "The brain creates the sensation of hearing a sound when it receives signals from the ear through a nerve.", "Human ears can detect sound waves with frequencies between 20 Hz and 20 kHz, being most sensitive to 2\u20135 kHz waves.", "Sound waves below 20 Hz are called infrasound; above 20 kHz, ultrasound. They are not detected by human ears.", "Sound waves are caused when objects vibrate, causing nearby air particles to vibrate as well.", "As a sound wave travels, each bit of air is vibrating parallel to the direction of wave travel, not travelling forwards.", "Sound is a longitudinal wave: the direction of vibration is parallel to the direction of energy transfer.", "Sound waves are faster in solids/liquids than gases; the particles are very close so vibrations are easily passed on.", "Sound waves are faster in solids than liquids; the strong forces between particles mean vibrations travel even faster.", "The \u2018speed of sound\u2019 is the distance travelled by a sound wave pulse every second, measured in m/s.", "Sound wave speed depends on the medium: it is about 340 m/s in air, faster in liquids and faster still in solids.", "Sound waves can reflect from hard surfaces, travel back and be heard again (an echo).", "The speed of sound waves (or the distance they travel) can be calculated using the equation: speed = distance \u00f7 time.", "In an experiment, measuring longer distances and times means any errors are a smaller proportion of the measurements.", "Sound waves of frequency below 20 Hz usually cannot be heard by humans, so are called infrasound.", "Sound waves of frequency above 20 000 Hz usually cannot be heard by humans, so are called ultrasound.", "Ultrasound waves can cause objects to vibrate, so transfer energy. They do not cause harm to the human body.", "Ultrasound can be used to image structures inside the body as it reflects from boundaries between tissues.", "Ultrasound vibrations can clean delicate objects and can help to treat injuries and illnesses in physiotherapy.", "As a water wave moves forward, each bit of water is moving up and down (oscillating), not forward.", "Water waves are transverse waves: the direction of oscillation is 90\u00b0 to the direction of energy transfer.", "The amplitude of a water wave is the greatest distance water moves above and below the rest position.", "Waves that pass through each other can \u2018add up\u2019 or \u2018cancel out\u2019; this is called wave superposition.", "Water waves reflect from hard barriers, obeying the laws of reflection."], "10Disease and drugsBiology": ["Asthma is a common non-infectious disease that can cause breathing difficulties.", "During an asthma attack, the breathing (bronchial) tubes narrow.", "Symptoms include wheezing and shortness of breath.", "Symptoms of asthma can be treated using medication taken using an inhaler.", "Risk factors for asthma include air pollution, smoking, low birth weight, having an allergy, and family history.", "Infectious diseases can be passed from one organism to another.", "Infectious diseases are caused by pathogens including viruses and some bacteria.", "Some lifestyle factors are linked to non-infectious diseases.", "Non-infectious diseases cannot be passed from one organism to another.", "Some lifestyle factors affect the risk of developing non-infectious diseases of the gas exchange and circulatory system.", "Eating an unbalanced diet and not getting enough exercise can increase the risk of developing lifestyle diseases.", "Smoking, drinking alcohol and using drugs can increase the risk of developing lifestyle diseases.", "To prevent lifestyle diseases people can exercise, eat a balanced diet, not smoke and avoid drinking alcohol.", "Medicines are drugs that people take when they are ill.", "People consume other drugs for recreation, including caffeine, nicotine and alcohol.", "Recreational drugs can be classified as depressants or stimulants.", "Depressants slow down thinking and reaction times.", "Alcohol is a legal depressant, but long-term alcohol use can damage the brain and liver.", "Stimulants make you feel more alert and can give you quicker thinking and reaction times.", "Caffeine is a legal stimulant  present in some foods and drinks.", "Cocaine and ecstasy are examples of illegal stimulants used as recreational drugs.", "Substance abuse can cause physical and mental health issues.", "Smoking involves inhaling smoke from burning tobacco leaves.", "Tobacco leaves contain nicotine which is a very addictive substance and it affects the body.", "Smoking affects the gas exchange system.", "Smoking increases the risk of diseases such as asthma, COPD, lung cancer and heart disease.", "Inhaling chemicals to become intoxicated is called solvent abuse.", "Common solvents are paint thinner, glue, and nitrous oxide.", "Solvents have many physical effects on the body.", "Solvent abuse has risks of long-term health problems and can lead to death.", "Why oxygen needs to be absorbed into, and carbon dioxide needs to be removed from, the human body.", "The function and structures of the lungs in healthy humans.", "The mechanism of breathing, including the role of muscles, to move air in and out of the lungs.", "Adaptations of healthy lungs that increase the amount of gas exchange.", "Detailed structure of the alveoli in healthy human lungs.", "Vaping is an alternative to smoking.", "Like smoking, vaping involves consuming nicotine which is detrimental to health.", "The health effects of vaping are not yet fully known.", "Scientific ideas are updated as new evidence emerges."], "11Patterns in the periodic tableChemistry": ["Noble gases are in Group 0 of the periodic table and are unreactive.", "Noble gases are all gases at room temperature.", "They have complete outer electron shells, making them stable.", "Moving down Group 0 elements, atomic mass, density and boiling points increase.", "The properties of elements in each group of the periodic table change gradually down the group.", "Group 1 metals are soft, have lower densities than most other metals, and become more reactive down the group.", "Group 1 metals are called alkali metals because they react with water to form an alkaline solution and hydrogen gas.", "Group 2 metals react with dilute acids to form a salt and hydrogen gas.", "Group 2 metals become more reactive down the group, but they are less reactive than Group 1 metals in the same period.", "The elements in Group 7 are all non-metals that have coloured vapours, most of which are toxic.", "The state of the elements at room temperature changes from gas to solid, down Group 7.", "Reactivity decreases down Group 7.", "Halogens react with Group 1 and 2 metals to form metal halides.", "Metal halides are soluble in water.", "Each column of the periodic table is called a group, and each row is called a period.", "The periodic table was developed by a Russian scientist called Dimitri Mendeleev.", "The periodic table contains all the elements organised into groups and periods, according to their properties.", "The elements in the same group in the periodic table have similar properties.", "In addition to groups, elements can be divided into non-metals and metals, which include the transition metals."], "12Resistance and parallel circuitsPhysics": ["With the same battery, two bulbs in parallel are brighter than two in series.", "With the same battery, current through two bulbs in parallel is bigger than through two in series.", "With the same battery, voltage across one of two bulbs in parallel is bigger than across one of two bulbs in series.", "With the same battery, two bulbs in parallel are transferring energy from the battery more quickly than two in series.", "A battery lighting two bulbs in parallel will run out faster than the same battery lighting the two bulbs in series.", "An ammeter measures current in amps (A).", "Resistance is a measure of how difficult it is for a current to flow.", "Resistance is measured in ohms (\u03a9).", "In a fair test, only the independent variable is changed so that no other variables affect the results.", "The variables that are deliberately kept the same are called control variables.", "The longer a wire, the greater its resistance.", "Electric current in a wire is a flow of electrons moving through the spaces between \u2018atoms\u2019 (metal ions).", "Doubling the length of a wire doubles its resistance.", "Doubling the length of a wire doubles the number of \u2018atoms\u2019 (metal ions) in the way of the flow of electrons.", "The resistance of a (uniform) wire is proportional to its length.", "In a parallel circuit, each loop can be traced from one end of the cell or battery to the other end.", "Each loop in a parallel circuit is equivalent to a series circuit connected to the same cell or battery.", "A parallel circuit can be split into a number of series circuits each connected to the ends of the same cell or battery.", "Electrical appliances and devices use different amounts of energy each second, as indicated by their power rating.", "Power is a measure of the amount of energy used by or supplied to a device in one second.", "Power is measured in watts (W).", "Multiplying power of a device in kilowatts (kW) by time in hours (h) gives us the energy used in kilowatt\u2013hours (kWh).", "Electricity bills are based on the amount of energy units used; 1 unit of energy is equal to 1 kWh.", "A parallel circuit is a circuit with more than one complete loop, from one end of a battery to the other end.", "A circuit is built systematically following a circuit diagram, round in one direction, starting from any point.", "A parallel circuit is built systematically, completing each loop of the circuit in turn.", "A circuit diagram is drawn systematically, following each loop round and completing each one in turn.", "Wires in a circuit diagram are drawn with a ruler for clarity, with no tiny gaps that would break the circuit.", "Current through the battery in a parallel circuit is measured with an ammeter, connected next to one end of the battery.", "There are connections to the rest of the circuit at the ends of each branch in a parallel circuit.", "The current through a branch of a parallel circuit is measured between its connections to the rest of the circuit.", "The current through each branch of a parallel circuit adds up to the total current through the battery.", "The thicker a wire, the smaller its resistance.", "The greater the cross\u2013sectional area of a wire, the smaller its resistance.", "Electric current in a wire is a flow of electrons moving between \u2018atoms\u2019 (metal ions).", "Doubling the cross-sectional area of a wire halves its resistance.", "Doubling the cross-sectional area of a wire doubles the number of electrons that can flow through the wire.", "A voltmeter is connected to each side of a cell, battery or component.", "Voltage (or potential difference) is measured in volts (V).", "The voltage across a cell or battery measures the strength with which it can \u2018push\u2019 current around a circuit.", "The voltage across a component in an electric circuit measures the size of \u2018push\u2019 that is moving current through it.", "The voltage across each branch of a parallel circuit is the same as the voltage across the cell or battery."], "13Reproduction in plantsBiology": ["Displaying results in a table.", "Displaying categoric and numerical data.", "Interpreting and describing the results of an investigation into factors affecting seed germination.", "Identifying patterns or trends in the results.", "Writing a conclusion for an investigation into factors that affect seed germination.", "Some seeds (e.g. cress seeds) will germinate on cotton wool in the right conditions.", "Planning an investigation and writing a method for factors affecting the germination of seeds on cotton wool.", "Deciding which variable to change to become the independent variable and what values to investigate.", "Deciding which variable to measure to conclude on the effect (the dependent variable).", "Deciding which variables to keep the same to ensure a valid conclusion (control variables).", "Flowering plants reproduce sexually.", "Plant reproduction is important as plants are producers and provide food for all animals on Earth.", "Flowers contain male and female sex organs and gametes.", "Egg cells (ova) are female gametes.", "Pollen grains carry male gametes.", "Seeds contain an embryo, food store and a tough outer coat, and they are formed in the ovary.", "A fruit is the mature and ripened ovary of a seed-producing plant.", "Fruits often contain seeds which will grow into a new plant, given the right conditions.", "Seeds are adapted to be dispersed by animals, wind and water.", "Pollinators are animals which transfer pollen from one flower to another, which enables plants to reproduce sexually.", "Many food crops are pollinated by animal pollinators, including fruits, vegetables and nuts.", "The majority of pollinators are insects, with bees being the largest group.", "Food security means having enough affordable and nutritious food in an area or country.", "Pollinating insects need to be protected from pesticides, climate change and habitat loss to ensure food security.", "Pollination is the transfer of pollen from the male anther to the female stigma.", "There are two types of pollination; self-pollination and cross-pollination. The latter increases variation in a species.", "Pollen grains can be transferred by the wind, water or by insects.", "Fertilisation is the fusion of the nuclei from the male and the female gametes.", "A zygote grows into an embryo and then a new plant.", "Experimental data can be analysed by plotting data on a line graph or bar chart.", "Line graphs are used where the independent variable is continuous; bar charts are used where it is categoric.", "Drawing a bar chart and/or line graph follows a set format.", "A line of best fit on a line graph indicates the trend (relationship between in the independent and dependent variable).", "Seeds are dispersed by different mechanisms to increase the chance of survival.", "Seeds are adapted to match the mechanism for dispersal; e.g. wind dispersed are light with a large surface area.", "Variables are factors that affect the process being investigated, the dependant variable is distance the seed travels.", "Practical investigation of how far model seeds disperse with changes to their template.", "Repeat measurements for each value to identify anomalous results and calculate a mean."], "14Climate change and biodiversityBiologyChemistry": ["Many foods are s that enable them to live and thrive in the conditions of their habitat", "Human emissions of greenhouse gases are leading to global warming and climate change", "Climate change is changing the conditions in habitats, so species may be less well adapted to live there", "Some, but not all, species can survive changes in conditions by migrating to a new habitat", "Climate change, including more frequent extreme weather events, can lead to biodiversity loss"]};
const sel = document.getElementById('unit-select');
const copyBtn = document.getElementById('copy-btn');
const pointsDiv = document.getElementById('points');
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function prettifyLabel(s){ if(!s) return s; s = s.replace(/^(\\d+)([A-Za-z])/, '$1. $2'); s = s.replace(/([a-z0-9])([A-Z])/g, '$1 $2'); s = s.replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2'); s = s.replace(/[-_]/g,' '); return s; }
function populateUnits(){Object.keys(UNITS).forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=prettifyLabel(u);o.title=u;sel.appendChild(o)});}  
function showPoints(unit){pointsDiv.innerHTML=''; if(!unit) return; const items=UNITS[unit]||[]; if(items.length===0){pointsDiv.textContent='No key learning points found.'; return;} const frag=document.createDocumentFragment(); items.forEach(p=>{const div=document.createElement('div');div.textContent=p;frag.appendChild(div)}); pointsDiv.appendChild(frag); copyBtn.textContent='Copy all';} 
async function copyAll(){ const unit = sel.value; if(!unit){ alert('Please select a unit first'); return; } const items = UNITS[unit]||[]; const text = items.join('\u000a'); try{ await navigator.clipboard.writeText(text); copyBtn.textContent='Copied!'; setTimeout(()=>copyBtn.textContent='Copy all',2000); } catch(e){ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); copyBtn.textContent='Copied!'; setTimeout(()=>copyBtn.textContent='Copy all',2000); } catch(err){ alert('Copy failed'); } } }
copyBtn.addEventListener('click', copyAll);
sel.addEventListener('change', e=>showPoints(e.target.value));
populateUnits();
