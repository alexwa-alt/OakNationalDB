name: Generate all quiz caches

on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      overwrite:
        description: Regenerate existing valid quiz files
        required: false
        default: false
        type: boolean
      max_workers:
        description: Maximum concurrent Gemini requests
        required: false
        default: "25"
        type: string

permissions:
  actions: write
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and publish five-unit checkpoints
        env:
          OVERWRITE: ${{ inputs.overwrite }}
          MAX_WORKERS: ${{ inputs.max_workers || '25' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          push_main() {
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            return 1
          }

          for start in $(seq 0 5 40); do
            arguments=(--all --start "$start" --limit 5 --count 5 --workers "$MAX_WORKERS")
            if [ "$OVERWRITE" = "true" ]; then
              arguments+=(--overwrite)
            fi
            if ! python commands/generate_forces_quizzes.py "${arguments[@]}"; then
              git add site/quizzes
              if ! git diff --staged --quiet; then
                git commit -m "Save partial quiz cache [skip ci]"
                push_main
              fi
              exit 1
            fi

            git add site/quizzes
            if ! git diff --staged --quiet; then
              git commit -m "Generate quiz cache checkpoint [skip ci]"
              push_main
            fi
            gh workflow run deploy_quiz_cache.yml --ref main
            echo "Published checkpoint starting at unit $start"
          done
