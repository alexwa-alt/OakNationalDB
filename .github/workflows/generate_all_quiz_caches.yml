name: Generate all quiz caches

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Regenerate existing valid quiz files
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and publish five-unit checkpoints
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          push_main() {
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            return 1
          }

          for start in $(seq 0 5 40); do
            end=$((start + 4))
            if [ "$end" -gt 40 ]; then
              end=40
            fi

            for unit_start in $(seq "$start" 1 "$end"); do
              arguments=(--all --start "$unit_start" --limit 1 --count 5 --delay-seconds 60)
              if [ "$OVERWRITE" = "true" ]; then
                arguments+=(--overwrite)
              fi

              if ! python commands/generate_forces_quizzes.py "${arguments[@]}"; then
                git add site/quizzes
                if ! git diff --staged --quiet; then
                  git commit -m "Save partial quiz cache [skip ci]"
                  push_main
                fi
                exit 1
              fi

              git add site/quizzes
              if ! git diff --staged --quiet; then
                git commit -m "Generate unit quiz cache [skip ci]"
                push_main
              fi

              if [ "$unit_start" -lt 40 ]; then
                sleep 60
              fi
            done

            gh workflow run deploy_quiz_cache.yml --ref main
            echo "Published checkpoint starting at unit $start"
          done
