name: Inspect lesson summary

on:
  workflow_dispatch:
    inputs:
      lesson_slug:
        description: 'Lesson slug to inspect'
        required: false
        default: 'what-forces-do'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      OAK_API_KEY: ${{ secrets.OAK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --upgrade pip && python -m pip install requests

      - name: Run summary inspector
        run: |
          chmod +x scripts/print_lesson_summary.py
          LESSON_SLUG="${{ github.event.inputs.lesson_slug }}" OAK_API_KEY="${{ env.OAK_API_KEY }}" python scripts/print_lesson_summary.py
