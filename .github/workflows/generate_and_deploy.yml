name: Generate lesson URLs and deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      OAK_API_KEY: ${{ secrets.OAK_API_KEY }}
      OAK_TEACHER_SEQUENCE: science-secondary-aqa
      OAK_API_SEQUENCE: science-secondary-aqa
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run generator to build site/index.html
        run: |
          python commands/generate_static_lessons.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
