name: Scrape and deploy lesson links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      OAK_API_KEY: ${{ secrets.OAK_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run scraper and build site/index.html
        run: |
          python commands/generate_static_lessons.py

      - name: Inspect one lesson summary (for objectives)
        run: |
          # safe probe: uses secret in env on runner only
          LESSON_SLUG="what-forces-do" OAK_API_KEY="${{ secrets.OAK_API_KEY }}" python scripts/print_lesson_summary.py

      - name: Probe selected lessons
        run: |
          # probe a couple of known KS3 Science lessons and print the outputs
          for l in balanced-and-unbalanced-forces what-forces-do; do
            echo "=== PROBING $l ==="
            LESSON_SLUG="$l" OAK_API_KEY="${{ secrets.OAK_API_KEY }}" python scripts/print_lesson_summary.py || true
            echo "=== END $l ==="
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
