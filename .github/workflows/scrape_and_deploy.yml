name: Scrape and deploy lesson links

on:
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: 'Regenerate KS3 cache and commit it back to the branch (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      OAK_API_KEY: ${{ secrets.OAK_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REFRESH_KS3_CACHE: ${{ github.event.inputs.refresh_cache }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run scraper and build site/index.html
        if: ${{ github.event.inputs.refresh_cache == 'true' }}
        run: |
          python commands/generate_static_lessons.py

      - name: Commit KS3 cache back to branch
        if: ${{ github.event.inputs.refresh_cache == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ks3_units.json site/new-page.html site/index.html || true
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Regenerate KS3 units cache and site pages [ci skip]"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
