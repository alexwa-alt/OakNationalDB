nt': 'Atoms contain positive and negative electric charges.'}", "{'keyLearningPoint': 'The particles in atoms with a negative electric charge are called electrons.'}", "{'keyLearningPoint': 'Electrons can sometimes be transferred from one object to another, depending on the materials the objects are made of.'}", "{'keyLearningPoint': 'Metals are difficult to charge because electric charge flows through them, preventing charge from building up.'}", "{'keyLearningPoint': 'When static electricity builds up, it can be useful but also problematic.'}"], "10Reproduction in humansBiology": ["{'keyLearningPoint': 'All living things develop from other living things; reproduction is the process of making new living things (offspring).'}", "{'keyLearningPoint': 'When organisms reproduce they make offspring of the same kind (species resemblance).'}", "{'keyLearningPoint': 'Offspring inherit features from both parents so they look similar to their parents and one another (family resemblance).'}", "{'keyLearningPoint': 'Features are inherited when genetic material (DNA) is passed from parents to their offspring during reproduction.'}", "{'keyLearningPoint': 'The genetic material (DNA) contains the instructions for building our body and its features.'}", "{'keyLearningPoint': 'All living organisms have a life cycle.'}", "{'keyLearningPoint': 'All life cycles include stages of growth and reproduction.'}", "{'keyLearningPoint': 'In humans, the reproduction stage of the life cycle involves producing a baby that grows into a new human.'}", "{'keyLearningPoint': 'In some plants, the reproduction stage of the life cycle involves producing a seed that grows into a new plant.'}", "{'keyLearningPoint': 'During puberty in humans, the male and female bodies undergo changes.'}", "{'keyLearningPoint': 'The reproductive systems mature to enable adult humans to reproduce.'}", "{'keyLearningPoint': 'Other changes also prepare the body for reproduction.'}", "{'keyLearningPoint': 'The changes happen because of sex hormones being produced.'}", "{'keyLearningPoint': 'Females and males undergo some common changes but also changes that are specific to each sex.'}", "{'keyLearningPoint': 'Sperm and egg cells are the sex cells of humans and are called gametes.'}", "{'keyLearningPoint': 'Humans reproduce through sexual reproduction where half the genetic material of the offspring comes from each parent.'}", "{'keyLearningPoint': 'Fertilisation occurs in the fallopian tubes when gametes join to form a zygote.'}", "{'keyLearningPoint': 'Each gamete carries half the genetic material of the parent; a zygote has a full set of genetic material.'}", "{'keyLearningPoint': 'The zygote divides to form a ball of cells called an embryo, which grows to form a foetus and then a baby.'}", "{'keyLearningPoint': 'The function of the male reproductive system is to produce sperm cells.'}", "{'keyLearningPoint': 'Sperm cells are made and stored in the testes.'}", "{'keyLearningPoint': 'Females are born with all their eggs inside their ovaries, each month an egg is released.'}", "{'keyLearningPoint': 'The testes and the ovaries make hormones.'}", "{'keyLearningPoint': 'The male and female reproductive systems must work together to produce offspring.'}", "{'keyLearningPoint': 'Adult human females have a menstrual cycle that prepares them for sexual reproduction'}", "{'keyLearningPoint': 'On average the menstrual cycle is 28 days'}", "{'keyLearningPoint': 'In each cycle, an egg cell is released from an ovary (ovulation)'}", "{'keyLearningPoint': 'After ovulation, the uterus lining breaks down and leaves the body (menstruation)'}", "{'keyLearningPoint': 'A zygote divides to become an embryo, which then develops into a foetus made of different cells and tissues.'}", "{'keyLearningPoint': 'The human gestation period is about 40 weeks.'}", "{'keyLearningPoint': 'The foetus grows in an amniotic sac which is filled with amniotic fluid for protection.'}", "{'keyLearningPoint': 'The mother provides all the nutrients that the growing foetus needs and gets rid of waste products through the placenta.'}", "{'keyLearningPoint': 'During birth, the cervix opens and the uterus wall contracts to push the baby out through the vagina.'}", "{'keyLearningPoint': 'Some substances can pass through the placenta including some drugs, alcohol and chemicals in cigarette smoke.'}", "{'keyLearningPoint': 'This can affect the growth of the foetus.'}", "{'keyLearningPoint': 'Short term consequences can include miscarriage, premature birth and low birth weight.'}", "{'keyLearningPoint': 'Long term consequences can include addiction, sudden infant death and foetal alcohol spectrum disorder.'}"], "11Fuels and energeticsChemistry": ["{'keyLearningPoint': 'Heating transfers energy into a substance and can cause it to melt, evaporate or boil.'}", "{'keyLearningPoint': 'Melting, evaporation and boiling are endothermic.'}", "{'keyLearningPoint': 'As it cools, a substance transfers energy into the surroundings by heating and it may condense or freeze.'}", "{'keyLearningPoint': 'Condensing and freezing are exothermic.'}", "{'keyLearningPoint': 'State changes are visible as plateaus on cooling curves.'}", "{'keyLearningPoint': 'Energy is released to the surroundings as a substance cools and this is observed as a decrease in substance temperature.'}", "{'keyLearningPoint': 'Graphs provide a visual representation of data for easier analysis and help identify trends/patterns.'}", "{'keyLearningPoint': 'An exothermic chemical reaction causes an increase in temperature (of the surroundings).'}", "{'keyLearningPoint': 'An endothermic chemical reaction causes a decrease in temperature (of the surroundings).'}", "{'keyLearningPoint': 'An exothermic reaction transfers energy from the reactants to the surroundings.'}", "{'keyLearningPoint': 'An endothermic reaction transfers energy from the surroundings to the products.'}", "{'keyLearningPoint': 'Burning a fuel transfers energy by heating its surroundings.'}", "{'keyLearningPoint': 'Heating water in a boiling tube allows the amounts of energy transferred by different fuels to be compared.'}", "{'keyLearningPoint': 'The mass of fuel used needs to be the same for each measurement.'}", "{'keyLearningPoint': 'The temperature and volume of water being heated needs to be the same for each measurement.'}", "{'keyLearningPoint': 'Over half of the electricity in the UK is generated from the Sun, wind and falling water.'}", "{'keyLearningPoint': 'Many power stations in the UK burn natural gas and oil to heat water into steam.'}", "{'keyLearningPoint': 'The moving steam in power stations pushes turbines, which drive electric generators that produce electricity.'}", "{'keyLearningPoint': 'Natural gas and oil are fossil fuels used in power stations; coal is no longer used in UK power stations.'}", "{'keyLearningPoint': 'Natural gas, oil, waste and wood are fuels that produce greenhouse gases and pollutants when burned.'}", "{'keyLearningPoint': 'Renewable energy resources will not run out because they are replenished more quickly than we use them up'}", "{'keyLearningPoint': 'Electricity can be generated by spinning coils of wire in an electric generator with a turbine'}", "{'keyLearningPoint': 'Turbines can be spun using falling water or wind'}", "{'keyLearningPoint': 'Turbines can be spun using moving steam made by burning biomass, oil or gas'}", "{'keyLearningPoint': 'Solar panels produce electricity without electric generators'}"], "12Making imagesPhysics": ["{'keyLearningPoint': 'All colours of light can be created by mixing the primary colours of light; red, green and blue.'}", "{'keyLearningPoint': 'Mixing equal amounts of two primary colours creates a secondary colour. All three mixed in equal amounts makes white.'}", "{'keyLearningPoint': 'The retina, on the back of the eye, detects light. When there is no light, we see black.'}", "{'keyLearningPoint': 'On the retina, three types of cone cell detect either red, green or blue light, and rod cells detect brightness.'}", "{'keyLearningPoint': 'Display screens are made of tiny red, green and blue lights (pixels) which vary in brightness to make different colours.'}", "{'keyLearningPoint': 'White light from the Sun and light bulbs consists of light of all the colours in the visible light spectrum (a rainbow).'}", "{'keyLearningPoint': 'A transparent triangular prism can split up sunlight into a visible light spectrum.'}", "{'keyLearningPoint': 'The visible light spectrum shows the range of colours that light can have.'}", "{'keyLearningPoint': 'Cone cells in the eye detect colour. There are 3 kinds (R, G and B); each is sensitive to a range of colours of light.'}", "{'keyLearningPoint': 'The colour we see depends on which cone cells are triggered to send a signal to the brain.'}", "{'keyLearningPoint': 'Colour is detected in the eye by the R, G and B \u2018cone cells\u2019 that each detect a range of colours of light.'}", "{'keyLearningPoint': 'The colour of an object in white or coloured light depends on the amounts of R, G and B light it is reflecting.'}", "{'keyLearningPoint': 'White objects reflect all colours of light so look the same colour as the incident light (whether white or coloured).'}", "{'keyLearningPoint': 'The colours of light that an object does not reflect are absorbed. Black objects absorb all colours of light.'}", "{'keyLearningPoint': 'In red/green/blue light, an object will appear red/green/blue if it reflects that colour, and black if it does not.'}", "{'keyLearningPoint': 'A pinhole camera is an empty, closed box with a tiny hole on the front face and a screen on the back face.'}", "{'keyLearningPoint': 'Light moves in straight lines from a light source, through the pinhole, to the screen at the back of a pinhole camera.'}", "{'keyLearningPoint': 'Light from each different point on the object falls on a different single point on the screen, forming the image.'}", "{'keyLearningPoint': 'The image produced by a pinhole camera is dim and inverted. Adding more holes produces multiple images.'}", "{'keyLearningPoint': 'Making the hole larger makes the image brighter but blurred. More light passes through the hole in more directions.'}", "{'keyLearningPoint': 'Reflections are the same size as the object, upright, and the same distance behind the mirror as the object is in front.'}", "{'keyLearningPoint': 'In a plane mirror, reflections appear laterally inverted compared to the object when it is facing us.'}", "{'keyLearningPoint': 'Mirrors reflect what is in front of them. Reflections are laterally inverted as objects are turned to face a mirror.'}", "{'keyLearningPoint': 'Reflections are virtual images; they appear where light rays seem to have come from, not where they actually come from.'}", "{'keyLearningPoint': 'Virtual rays show where light rays appear to have come from; they are drawn as dashed lines.'}", "{'keyLearningPoint': 'Light changes direction when it moves into a new medium (material) at an angle to the normal. This is called refraction.'}", "{'keyLearningPoint': 'When light enters a transparent material from air, it turns towards the normal.'}", "{'keyLearningPoint': 'When light leaves a transparent material and re\u2013enters air it turns away from the normal.'}", "{'keyLearningPoint': 'A ray that enters and leaves glass through parallel sides ends up in its original direction, but displaced to the side.'}", "{'keyLearningPoint': 'Refraction can cause virtual images of objects to appear where light seems to be coming from.'}", "{'keyLearningPoint': 'Some of the light from objects can pass through a lens and become focused to form an image on a screen.'}", "{'keyLearningPoint': 'Some light from every point on an object passes through every part of a lens.'}", "{'keyLearningPoint': 'A convex lens refracts light rays so they travel more towards each other. A point where rays meet is called a focus.'}", "{'keyLearningPoint': 'All the rays from one point on the object are focused to the same point, forming the corresponding part of the image.'}", "{'keyLearningPoint': 'The shape of a converging lens refracts (bends) light more at the edges than near to the centre.'}"], "13Diet and exerciseBiology": ["{'keyLearningPoint': 'People have both physical health and mental health.'}", "{'keyLearningPoint': 'Physical health and mental health range from good to ill.'}", "{'keyLearningPoint': 'Changes in normal body appearance, function and behaviour can be symptoms of ill health.'}", "{'keyLearningPoint': 'Food groups include protein, carbohydrate, lipids/fats, water, minerals, vitamins and fibre.'}", "{'keyLearningPoint': 'Each food group plays a role in maintaining a healthy body.'}", "{'keyLearningPoint': 'A balanced diet is needed to maintain good health.'}", "{'keyLearningPoint': 'People need different amounts of particular nutrients at different times in their lives, depending on their lifestyle.'}", "{'keyLearningPoint': 'Food is a source of building materials to make biomass for growth and repair.'}", "{'keyLearningPoint': 'Food also provides the fuel for cellular respiration, to provide energy for life processes.'}", "{'keyLearningPoint': 'Different individuals require different daily amounts of food and energy.'}", "{'keyLearningPoint': 'Food labels contain information on the content of the food and daily recommended amounts of nutrients and energy.'}", "{'keyLearningPoint': 'The amount of energy provided by food can be compared in kilojoules or calories.'}", "{'keyLearningPoint': 'Different foods provide different amounts of energy.'}", "{'keyLearningPoint': 'The amount of energy provided by different foods can be investigated and compared by burning them.'}", "{'keyLearningPoint': 'Burning foods can heat water and the temperature change of the water measured.'}", "{'keyLearningPoint': 'The mean temperature change can be calculated from repeat measurements.'}", "{'keyLearningPoint': 'Energy provided by the food (J) = mass of water (g) \u00d7 rise in temperature (\u00b0C) \u00d7 4.2.'}", "{'keyLearningPoint': 'Not consuming a balanced diet can lead to ill health.'}", "{'keyLearningPoint': 'Body mass index (BMI) is calculated from a person\u2019s height and body mass.'}", "{'keyLearningPoint': 'Not consuming enough food can cause BMI to become too low, and eventually lead to starvation.'}", "{'keyLearningPoint': 'Deficiency diseases are the result of not consuming enough of a particular nutrient.'}", "{'keyLearningPoint': 'Consuming too much food can cause BMI to become too high, and lead to obesity.'}", "{'keyLearningPoint': 'Effects of obesity on the human body.'}", "{'keyLearningPoint': 'Obesity can increase the risk of developing other health issues, including heart disease.'}", "{'keyLearningPoint': 'Exercise is activity requiring physical effort.'}", "{'keyLearningPoint': 'Regular exercise is beneficial for good physical and mental health.'}", "{'keyLearningPoint': 'Exercising causes increases in breathing rate and heart rate as cells need more oxygen for cellular respiration.'}", "{'keyLearningPoint': 'Identifying independent variable (amount of exercise) and dependent variable (heart rate or breathing rate).'}", "{'keyLearningPoint': 'Identifying control variables (the person and the length of time spent exercising).'}", "{'keyLearningPoint': 'The independent variable (amount of exercise) is categoric data and goes on the x-axis of a bar chart.'}", "{'keyLearningPoint': 'The dependent variable (heart rate or breathing rate) goes on the y-axis of a bar chart.'}", "{'keyLearningPoint': 'Using knowledge of cellular respiration to explain the results.'}", "{'keyLearningPoint': 'The recovery time is the time it takes for the heart rate to return to its resting rate after exercise.'}", "{'keyLearningPoint': \"Heart rate in beats per minute (bpm) can be measured by taking a person's pulse.\"}", "{'keyLearningPoint': 'A line graph can be plotted showing pulse rate or heart rate over time after exercise.'}", "{'keyLearningPoint': \"A person's recovery time can be determined from the line graph.\"}", "{'keyLearningPoint': 'People who are fitter have a shorter recovery time.'}"], "14Climate change and greenhouse gasesChemistryPhysics": ["{'keyLearningPoint': 'Increasing levels of greenhouse gases in the atmosphere is leading to global warming and climate change'}", "{'keyLearningPoint': 'Carbon dioxide is a greenhouse gas, released by living organisms and produced when burning fuels'}", "{'keyLearningPoint': 'Methane is a greenhouse gas, released by living organisms and from the ground'}", "{'keyLearningPoint': 'Methane is a more potent greenhouse gas than carbon dioxide'}", "{'keyLearningPoint': 'Reducing greenhouse gas emissions can reduce the rate of global warming and may even help to reverse it'}", "{'keyLearningPoint': 'Global surface temperatures are calculated from tens of thousands of measurements worldwide'}", "{'keyLearningPoint': 'Temperatures are compared with the long-term average for each region'}", "{'keyLearningPoint': 'Since the industrial revolution, in the 1850s, overall global surface temperatures have been increasing'}", "{'keyLearningPoint': 'Evidence from trees rings and ice cores provides data of longer-term changes in temperature'}", "{'keyLearningPoint': 'Scientists can explain how increased levels of greenhouse gases contribute to global warming'}", "{'keyLearningPoint': 'Greenhouse gases in the atmosphere keep it warmer than it would be without them.'}", "{'keyLearningPoint': 'Heating from the Sun controls the average temperature of Earth.'}", "{'keyLearningPoint': 'Increased temperatures melt ice sheets more quickly, moving more water into the sea, making sea levels rise.'}", "{'keyLearningPoint': 'More sea ice melts in summer, but this does not add water to the sea or raise sea levels.'}", "{'keyLearningPoint': 'Warmer oceans and seas expand, causing sea levels to rise.'}", "{'keyLearningPoint': 'Burning fuels for transport produces greenhouse gases, other pollutant gases, and particulates.'}", "{'keyLearningPoint': 'Petrol and diesel vehicles burn fuels, while electric vehicles do not, but fuels may be burned to generate electricity.'}", "{'keyLearningPoint': 'The energy use of planes, trains, cars, ships, and buses can be compared.'}", "{'keyLearningPoint': 'Vehicles use energy and resources during manufacturing.'}", "{'keyLearningPoint': 'Parts of vehicles may become waste at the end of their useful lives.'}", "{'keyLearningPoint': 'Cars use more energy to travel 100 km if they are heavier or travel at higher speeds.'}", "{'keyLearningPoint': 'Cars use less energy if their tyres are inflated to the correct air pressure'}", "{'keyLearningPoint': 'Walking and cycling regularly improve a person\u2019s physical health'}", "{'keyLearningPoint': 'Well-planned infrastructure for cycling, walking and public transport make it easier and safer to travel without a car'}", "{'keyLearningPoint': 'Carbon capture and storage separates CO\u2082 from other emissions and stores it in suitable deep underground locations'}", "{'keyLearningPoint': 'Carbon capture and storage can reduce CO\u2082 emissions but is very expensive'}", "{'keyLearningPoint': 'The energy sector uses fuel for heating, electricity generation and transport as well as manufacturing and construction'}", "{'keyLearningPoint': 'The energy sector produces approximately 75% of global greenhouse gas emissions'}", "{'keyLearningPoint': 'Greenhouse gas emissions can be reduced by using less energy and switching to renewable energy sources'}", "{'keyLearningPoint': 'Renewable energy resources will not run out because they are replenished more quickly than we use them up'}", "{'keyLearningPoint': 'Electricity can be generated by spinning coils of wire in an electric generator with a turbine'}", "{'keyLearningPoint': 'Turbines can be spun using falling water or wind'}", "{'keyLearningPoint': 'Turbines can be spun using moving steam made by burning biomass, oil or gas'}", "{'keyLearningPoint': 'Solar panels produce electricity without electric generators'}"], "1Breathing and respirationBiology": ["{'keyLearningPoint': 'Humans and other animals breathe to move air in and out of their lungs.'}", "{'keyLearningPoint': 'Cells need oxygen from the air for cellular respiration, to provide energy for life processes.'}", "{'keyLearningPoint': 'Cellular respiration produces carbon dioxide as a waste product.'}", "{'keyLearningPoint': 'Oxygen needs to be absorbed into, and carbon dioxide needs to be removed from, the human body.'}", "{'keyLearningPoint': 'In gas exchange, oxygen diffuses from the lungs into the blood; carbon dioxide diffuses from the blood into the lungs.'}", "{'keyLearningPoint': 'The structures and functions of the gas exchange system in humans.'}", "{'keyLearningPoint': 'The mechanism of breathing, including the role of muscles, to move air in and out of the lungs.'}", "{'keyLearningPoint': 'A pressure model to explain the movement of gases during breathing.'}", "{'keyLearningPoint': 'The vital capacity of the lungs is the maximum volume of air that can be exhaled after inhaling fully.'}", "{'keyLearningPoint': 'How to measure vital capacity using simple apparatus.'}", "{'keyLearningPoint': 'The closer a measurement is to the true value, the more accurate it is said to be.'}", "{'keyLearningPoint': 'An estimate is an approximate (rough) value of a quantity (without taking accurate measurements).'}", "{'keyLearningPoint': 'An estimate of lung volume can be calculated from a measurement of vital capacity.'}", "{'keyLearningPoint': 'The lungs are made up of tiny air sacs called alveoli.'}", "{'keyLearningPoint': 'Gas exchange takes place between air in alveoli and blood in capillaries.'}", "{'keyLearningPoint': 'There are millions of alveoli to increase the surface area of the lungs for gas exchange.'}", "{'keyLearningPoint': 'The walls of the alveoli are one cell thick to create a short diffusion distance for gas exchange.'}", "{'keyLearningPoint': 'The alveoli are surrounded by capillaries carrying blood, to maintain a concentration gradient for gas exchange.'}", "{'keyLearningPoint': 'Cellular respiration is a chemical process that uses glucose, from food, as a fuel to provide energy for life processes.'}", "{'keyLearningPoint': 'Examples of life processes that require energy from cellular respiration.'}", "{'keyLearningPoint': 'Cellular respiration happens in all living organisms all the time to provide the energy to keep them alive.'}", "{'keyLearningPoint': 'Differences between breathing and respiration.'}", "{'keyLearningPoint': 'Aerobic cellular respiration requires oxygen.'}", "{'keyLearningPoint': 'The reactants and products of aerobic cellular respiration can be summarised using a word equation.'}", "{'keyLearningPoint': 'Aerobic cellular respiration takes place in the mitochondria and cytoplasm of animal, plant and fungi cells.'}", "{'keyLearningPoint': 'Cells that require more energy, because they do a lot of work, have more mitochondria.'}", "{'keyLearningPoint': 'Anaerobic cellular respiration takes place without using oxygen.'}", "{'keyLearningPoint': 'In humans, anaerobic cellular respiration produces lactic acid, which can cause muscle cramps.'}", "{'keyLearningPoint': 'Word summaries of the reactants and products of aerobic and anaerobic cellular respiration in humans.'}", "{'keyLearningPoint': 'Anaerobic cellular respiration takes place only in the cytoplasm of cells and does not involve the mitochondria.'}", "{'keyLearningPoint': 'Anaerobic cellular respiration provides less energy than aerobic cellular respiration, but provides energy more quickly.'}", "{'keyLearningPoint': 'In microorganisms, anaerobic cellular respiration produces carbon dioxide and a type of alcohol called ethanol.'}", "{'keyLearningPoint': 'A word summary of the reactants and products of anaerobic cellular respiration in microorganisms.'}", "{'keyLearningPoint': 'Anaerobic cellular respiration in microorganisms is also called fermentation.'}", "{'keyLearningPoint': 'Humans use fermentation in microorganisms to make useful products such as bread, yogurt and alcoholic drinks.'}"], "2Acids and basesChemistry": ["{'keyLearningPoint': 'Edible acids have a sour taste.'}", "{'keyLearningPoint': 'A base is any substance that reacts with acids to form a compound called a salt.'}", "{'keyLearningPoint': 'Alkalis are soluble bases, and form alkaline solutions.'}", "{'keyLearningPoint': 'Some acids and alkalis are corrosive and can cause chemical burns.'}", "{'keyLearningPoint': 'An acid turns blue litmus paper red, an alkali turns red litmus paper blue.'}", "{'keyLearningPoint': 'Most acids and alkalis are colourless solutions, so indicators can be used to identify them.'}", "{'keyLearningPoint': 'pH stands for \u2018potential of hydrogen\u2019 and acids contain hydrogen.'}", "{'keyLearningPoint': 'The higher the concentration of hydrogen, the lower the pH.'}", "{'keyLearningPoint': 'The pH scale goes up and down in factors of ten, so an acid of pH 2 is ten times more acidic than pH 3.'}", "{'keyLearningPoint': 'A low pH means acidic, a high pH means alkaline and solutions with a pH of 7 are neutral.'}", "{'keyLearningPoint': 'Red cabbage solution is pink or red in an acid, purple in a neutral solution, and green in an alkali.'}", "{'keyLearningPoint': 'Different chemical indicators have their advantages and disadvantages.'}", "{'keyLearningPoint': 'Universal indicator will turn many different colours depending on pH.'}", "{'keyLearningPoint': 'When a metal reacts with acid bubbles may form, it is exothermic and the metal reduces in size (disappears).'}", "{'keyLearningPoint': 'Different metals have varying reactivity with acids.'}", "{'keyLearningPoint': 'When a metal reacts with an acid, the products are a metal salt and hydrogen gas.'}", "{'keyLearningPoint': 'The word equation for a metal and acid reaction is: metal + acid \u2192 metal salt + hydrogen.'}", "{'keyLearningPoint': 'The test for hydrogen gas is to introduce a lit splint, which will make a squeaky pop in hydrogen.'}", "{'keyLearningPoint': 'A metal oxide consists of metal atoms bonded to oxygen atoms.'}", "{'keyLearningPoint': 'Metal oxides are bases and can react with acids to neutralise them.'}", "{'keyLearningPoint': 'Metal oxide + acid \u2b62 metal salt + water'}", "{'keyLearningPoint': 'A non-metal oxide consists of non-metal atoms bonded to oxygen atoms.'}", "{'keyLearningPoint': 'Non-metal oxides in water make acidic solutions.'}", "{'keyLearningPoint': 'Neutralisation reaction general equation is: base + acid \u2192 metal salt + water.'}", "{'keyLearningPoint': 'Sodium hydroxide has the formula NaOH(aq) and hydrochloric acid has the formula HCl(aq).'}", "{'keyLearningPoint': 'In a neutralisation reaction, the metal salt formed is named after the metal (from the base) and acid used.'}", "{'keyLearningPoint': 'Common bases include metal oxides and hydroxides.'}", "{'keyLearningPoint': '(s), (l), (g) and (aq) in chemical equations identify the state of each substance as solid, liquid, gas or in solution.'}", "{'keyLearningPoint': 'A group of one carbon atom and three oxygen atoms bonded together is called a carbonate group.'}", "{'keyLearningPoint': 'Metal carbonate + acid \u2192 salt + water + carbon dioxide'}", "{'keyLearningPoint': 'The test for carbon dioxide gas is to bubble it through limewater as it turns the solution cloudy (milky).'}", "{'keyLearningPoint': 'Rain water is usually a little acidic and when it is more acidic than normal it is called acid rain.'}", "{'keyLearningPoint': 'Acid rain reacts with marble to produce a salt, water and carbon dioxide, using up some of the marble.'}"], "3Magnets and electromagnetsPhysics": ["{'keyLearningPoint': 'All magnets have a north\u2013seeking pole and a south\u2013seeking pole.'}", "{'keyLearningPoint': 'Unlike magnetic poles attract each other, and similar magnetic poles repel each other.'}", "{'keyLearningPoint': 'Magnetic materials are attracted to both north\u2013seeking and south\u2013seeking magnetic poles.'}", "{'keyLearningPoint': 'Just three metal elements (iron, cobalt and nickel) are magnetic; other metal and non\u2013metal elements are not magnetic.'}", "{'keyLearningPoint': 'A north\u2013seeking pole will point towards the North Pole because Earth has a magnetic field.'}", "{'keyLearningPoint': 'The needle of a plotting compass lines up with the magnetic field of a magnet.'}", "{'keyLearningPoint': 'A magnetic field line can be followed from the north\u2013seeking pole to the south\u2013seeking pole of a magnet.'}", "{'keyLearningPoint': 'Arrows on magnetic field lines show the direction in which the north\u2013seeking pole of another magnet would be forced.'}", "{'keyLearningPoint': 'The magnetic field of a bar magnet is symmetrical.'}", "{'keyLearningPoint': 'Magnetic field lines do not cross over and are continuous.'}", "{'keyLearningPoint': 'When there is an electric current in a wire, there is a magnetic field around the wire.'}", "{'keyLearningPoint': 'When there is an electric current in a coil of wire, the magnetic field around each loop adds to make a stronger field.'}", "{'keyLearningPoint': 'An electromagnet is made by wrapping a coil of wire around a core.'}", "{'keyLearningPoint': 'An electromagnet is a magnet that can be turned on with an electric current, and turned off.'}", "{'keyLearningPoint': 'The more turns of wire in the coil of an electromagnet, the stronger its magnetic field.'}", "{'keyLearningPoint': 'The greater the current through the coil of an electromagnet, the stronger its magnetic field.'}", "{'keyLearningPoint': 'The more closely spaced the coils of wire of an electromagnet, the stronger its magnetic field.'}", "{'keyLearningPoint': 'An electromagnet made from bare wire will not work if adjacent turns are touching.'}", "{'keyLearningPoint': 'A soft iron core increases the strength of an electromagnet because it becomes magnetised when it is turned on.'}", "{'keyLearningPoint': 'An electromagnetic door lock uses an electromagnet to pull a magnetic bolt to unlock a door.'}", "{'keyLearningPoint': 'An electric bell often contains an electromagnet that attracts and moves the striker, making it hit the bell.'}", "{'keyLearningPoint': 'As an electromagnet moves the striker in an electric bell, it breaks its own circuit to let the striker spring back.'}", "{'keyLearningPoint': 'A motor contains a spinning coil of wire that is an electromagnet.'}", "{'keyLearningPoint': 'When there is a current in the spinning coil of wire in a motor, other magnets around it will push it round.'}"], "4Plant nutrition and photosynthesisBiology": ["{'keyLearningPoint': 'Plants are living organisms that need light, air, water and minerals to stay alive and grow'}", "{'keyLearningPoint': 'Plants take in light and gases from air through their leaves, and take in water and minerals through their roots'}", "{'keyLearningPoint': 'Water and minerals are not food, but plants do need food to stay alive and grow'}", "{'keyLearningPoint': 'Plants do not take in food from their surroundings, they are producers that make their own food'}", "{'keyLearningPoint': 'The food that plants make is carbohydrate, which they use for growth and as a source of energy'}", "{'keyLearningPoint': 'Producers make their own food using a process called photosynthesis.'}", "{'keyLearningPoint': 'Photosynthesis can only happen when there is light.'}", "{'keyLearningPoint': 'Photosynthesis is a series of chemical reactions that take place inside cells.'}", "{'keyLearningPoint': 'The reactants of photosynthesis are water and carbon dioxide, and the products are oxygen and glucose (a carbohydrate).'}", "{'keyLearningPoint': 'Photosynthesis involves many chemical reactions; a word summary of the reactants and products is a model of the process.'}", "{'keyLearningPoint': 'Plant leaves are made up of cells that contain structures called chloroplasts.'}", "{'keyLearningPoint': 'Photosynthesis takes place in chloroplasts.'}", "{'keyLearningPoint': 'Chloroplasts contain chlorophyll, which absorbs light for photosynthesis.'}", "{'keyLearningPoint': 'Plant leaves are thin to allow light to pass through to cells containing chloroplasts.'}", "{'keyLearningPoint': 'Plant leaves have a large surface area to absorb light for photosynthesis.'}", "{'keyLearningPoint': 'Plant leaves take in carbon dioxide gas from the air for photosynthesis'}", "{'keyLearningPoint': 'The oxygen made by photosynthesis is released as a gas from leaves into the air'}", "{'keyLearningPoint': 'This process is called gas exchange'}", "{'keyLearningPoint': 'Leaves have small holes in their surface called stomata for gas exchange'}", "{'keyLearningPoint': 'Molecules of gases move through open stomata by diffusion'}"], "5MaterialsChemistry": ["{'keyLearningPoint': 'Metals are good thermal and electrical conductors, they are strong, shiny, malleable and ductile.'}", "{'keyLearningPoint': 'Ceramics are made from soft substances, becoming hard and brittle when heated.'}", "{'keyLearningPoint': 'Plastics are made from polymers and there are many types of plastics with very different properties.'}", "{'keyLearningPoint': 'An alloy is a mixture of elements including at least one metal.'}", "{'keyLearningPoint': 'Composites combine materials to create a new material with improved properties.'}", "{'keyLearningPoint': 'Polymers are made from small molecules called monomers that join together to form very long chains of atoms.'}", "{'keyLearningPoint': 'Some polymers have high melting points because their molecules are hard to separate.'}", "{'keyLearningPoint': 'Polymers can be made synthetically, but some also exist naturally.'}", "{'keyLearningPoint': 'A plasticiser added to a polymer gets between polymer molecules and allows them to move over each other more easily.'}", "{'keyLearningPoint': 'Cross-links between polymer molecules can make a polymer harder and less flexible.'}", "{'keyLearningPoint': 'Some metals react with acid to produce a metal salt and hydrogen gas.'}", "{'keyLearningPoint': 'Some metals react with water to produce a metal hydroxide and hydrogen gas.'}", "{'keyLearningPoint': 'Some metals react with oxygen to form a metal oxide.'}", "{'keyLearningPoint': 'The reactivity series for metals shows how vigorously metals react, compared to each other.'}", "{'keyLearningPoint': 'The higher the position of a metal in the reactivity series, the more vigorously it is likely to react.'}", "{'keyLearningPoint': 'A more reactive metal will displace another that is less reactive from its salt, in solution.'}", "{'keyLearningPoint': 'In a displacement reaction magnesium displaces copper from copper sulfate(aq) to form magnesium sulfate (aq) and copper.'}", "{'keyLearningPoint': 'Displacement reactions can be used to confirm the position of a metal in the reactivity series for metals.'}", "{'keyLearningPoint': 'A metal ore is typically rock that contains a metal in a form that can be extracted.'}", "{'keyLearningPoint': 'Carbon can be used to extract some metals from their ores when carbon is more reactive.'}", "{'keyLearningPoint': 'A catalyst speeds up a chemical reaction without being used up or chemically changed.'}", "{'keyLearningPoint': 'Catalysts are specific to particular reactions; different reactions require different catalysts.'}", "{'keyLearningPoint': 'Enzymes are biological catalysts that speed up reactions in living cells.'}"], "6Hidden forcesPhysics": ["{'keyLearningPoint': 'The mass of an object is measured in kilograms.'}", "{'keyLearningPoint': 'A force of about 10 N is needed to lift 1 kg on Earth.'}", "{'keyLearningPoint': 'On Earth, a 1 kg mass pushes down on a surface with a force of about 10 N.'}", "{'keyLearningPoint': 'There are 1000 g in 1 kg.'}", "{'keyLearningPoint': 'Gravitational force, W = m \u00d7 g'}", "{'keyLearningPoint': 'The whole of an object is floating on water if part of it is above the surface.'}", "{'keyLearningPoint': 'How well an object floats in a liquid does not depend on the depth of the liquid.'}", "{'keyLearningPoint': 'An object floats in water if its shape can push its own mass of water out of the way without going under.'}", "{'keyLearningPoint': 'A line of best fit can show the relationship between variables clearly.'}", "{'keyLearningPoint': 'The extension of a spring increases the same amount for each equal sized increase in force.'}", "{'keyLearningPoint': 'The extension of a spring is directly proportional to the force applied.'}", "{'keyLearningPoint': 'A spring is elastic because it returns to its original length when a force is removed.'}", "{'keyLearningPoint': \"Hooke's law describes the behaviour of springs.\"}", "{'keyLearningPoint': 'Levers can multiply a small force into a larger force.'}", "{'keyLearningPoint': 'Levers can multiply a small movement into a larger movement.'}", "{'keyLearningPoint': 'There are different types of lever, each with the pivot in a different position.'}", "{'keyLearningPoint': 'Pressure is a measure of how concentrated a force is.'}", "{'keyLearningPoint': 'Pressure = force \u00f7 area.'}", "{'keyLearningPoint': 'Pressure is measured in newtons per square metre or per square centimetre.'}", "{'keyLearningPoint': 'Another name for newtons per square metre is the pascal (Pa).'}", "{'keyLearningPoint': 'The bigger the surface area of a boat\u2019s hull, the bigger the upthrust on it can be.'}", "{'keyLearningPoint': 'Pressure in liquid increases with depth because there is more liquid pushing down.'}", "{'keyLearningPoint': 'Pressure in the atmosphere reduces with height because there is less air pushing down.'}", "{'keyLearningPoint': 'A rubber band is elastic because it returns to its original length when a force is removed.'}", "{'keyLearningPoint': 'The extension of a rubber band increases different amounts for each equal sized increase in force.'}", "{'keyLearningPoint': 'The extension of a spring is not directly proportional to the force applied.'}", "{'keyLearningPoint': 'The extension pattern is explained by the behaviour of molecular chains in the rubber.'}", "{'keyLearningPoint': 'Applying a force to a spring will make it extend (stretch).'}", "{'keyLearningPoint': 'A range of masses suspended on a mass holder will produce constant and measurable forces on a spring.'}", "{'keyLearningPoint': 'A set square ensures measuring scales are vertical.'}", "{'keyLearningPoint': 'Diagrams show how equipment should be set up.'}", "{'keyLearningPoint': 'More force is needed to hold up a bigger mass up in the air.'}", "{'keyLearningPoint': 'The bigger the mass on a beam, the more the beam bends.'}", "{'keyLearningPoint': 'The more a beam bends, the greater the force it pushes back with.'}", "{'keyLearningPoint': 'The bigger the mass on a floor, the more particles in the floor are squashed together.'}", "{'keyLearningPoint': 'The more particles in a floor are squashed together, the greater the force they push back with.'}", "{'keyLearningPoint': 'A moment causes turning.'}", "{'keyLearningPoint': 'Moment = force \u00d7 (perpendicular) distance from the pivot.'}", "{'keyLearningPoint': 'Moments are measured in Newton-metres (Nm).'}"], "7Adaptations, competition, natural selection and evolutionBiology": ["{'keyLearningPoint': 'A simple model can be used to demonstrate natural selection, e.g. picking up green and white cocktail sticks from grass.'}", "{'keyLearningPoint': 'The model can be used to make predictions about how a population will change over time due to natural selection.'}", "{'keyLearningPoint': 'The prediction may change if the environmental conditions change (e.g. if the grass becomes frosty/snowy).'}", "{'keyLearningPoint': 'Species have features which make them well suited to survive in their environment.'}", "{'keyLearningPoint': 'These features are called adaptations.'}", "{'keyLearningPoint': 'Examples of adaptations of particular species of animals and plants.'}", "{'keyLearningPoint': 'How particular adaptations provide an advantage in the environment in which the species lives.'}", "{'keyLearningPoint': 'All living organisms need resources from their habitat to enable them to survive.'}", "{'keyLearningPoint': 'Resources are limited, so individuals are in competition for them.'}", "{'keyLearningPoint': 'Organisms compete for resources such as food, water, space, shelter, light, mates, pollinators and seed dispersers.'}", "{'keyLearningPoint': 'Variation means some individuals are better adapted to compete more successfully than others.'}", "{'keyLearningPoint': 'These individuals have the best \u2018fit\u2019 to their environment.'}", "{'keyLearningPoint': 'Natural selection can cause the common characteristics of a species to change (evolve) over generations.'}", "{'keyLearningPoint': 'Scientists explain evolution using the theory of evolution by natural selection.'}", "{'keyLearningPoint': 'A scientific theory is a general explanation, developed from evidence, that explains many different examples.'}", "{'keyLearningPoint': 'Evolution is not planned in advance; new advantageous features appear randomly and are maintained by natural selection.'}", "{'keyLearningPoint': 'Changes in the features of an individual within its lifetime are not evolution.'}", "{'keyLearningPoint': 'Fossils provide evidence about organisms from long ago and their habitats.'}", "{'keyLearningPoint': 'All fossils are the mineralised remains of once-living organisms or of traces left behind by organisms.'}", "{'keyLearningPoint': 'Fossils show that some species have gone extinct.'}", "{'keyLearningPoint': 'Fossils show that the features of some species have changed over time.'}", "{'keyLearningPoint': 'There are limitations to the conclusions and explanations that can be made from fossil evidence.'}", "{'keyLearningPoint': 'There are differences in the features of individuals of the same species, and this is called variation.'}", "{'keyLearningPoint': 'Some variation is caused by the environment (e.g. injuries) or lifestyle (e.g. exercising to grow big muscles).'}", "{'keyLearningPoint': 'Environmental variation is not heritable, it cannot be passed on to offspring.'}", "{'keyLearningPoint': 'Some variation is caused by genetic information (e.g. the instructions for making claws or camouflaged skin).'}", "{'keyLearningPoint': 'Genetic variation is heritable, it can be passed on to offspring.'}", "{'keyLearningPoint': 'Variation within a population of a species means some individuals are better adapted to compete and survive.'}", "{'keyLearningPoint': 'The fittest (better adapted) individuals are more likely to survive to reproduce.'}", "{'keyLearningPoint': 'These individuals are more likely to pass on heritable, advantageous features to their offspring.'}", "{'keyLearningPoint': 'This is natural selection, and causes the advantageous features to become more common in each generation of offspring.'}", "{'keyLearningPoint': 'Changes in environmental conditions, including changes caused by humans, can affect natural selection.'}", "{'keyLearningPoint': 'Evidence suggests Earth was formed 4.5 billion years ago (one billion is one thousand million).'}", "{'keyLearningPoint': 'Evidence suggests the first living organisms (microorganisms) appeared around 3.8 billion years ago.'}", "{'keyLearningPoint': 'The oldest fossils are around 3.5 billion years old, and the newest fossils are around 10 thousand years old.'}", "{'keyLearningPoint': 'Evidence suggests the first land plants appeared 500mya, the first mammals 200mya, and modern humans 350k years ago.'}", "{'keyLearningPoint': 'Scientists divide Earth\u2019s history into eons, periods and epochs to make it easier to understand.'}"], "8Carbon cycle and climate changeChemistry": ["{'keyLearningPoint': 'When fuels containing carbon are burned, it is common for carbon dioxide to be made.'}", "{'keyLearningPoint': 'Carbon dioxide is a compound with molecules that each contain one carbon atom and two oxygen atoms.'}", "{'keyLearningPoint': 'About 0.04 % of Earth\u2019s atmosphere is carbon dioxide.'}", "{'keyLearningPoint': 'Carbon dioxide is a greenhouse gas.'}", "{'keyLearningPoint': 'Too many greenhouse gases in the atmosphere cause an increase in average global temperature, known as global warming.'}", "{'keyLearningPoint': 'Coal is a sedimentary rock that burns because it is made mostly of carbon, with some impurities.'}", "{'keyLearningPoint': 'Coal is formed from deep sediments of organic matter made of prehistoric plants.'}", "{'keyLearningPoint': 'Oil and gas formed from dead plankton mixed in with sediments that formed millions of years ago.'}", "{'keyLearningPoint': 'Oil and natural gas are found in pores of sedimentary rock.'}", "{'keyLearningPoint': 'The organic matter that formed coal, oil and natural gas decomposed into hydrocarbons.'}", "{'keyLearningPoint': 'Water in nature always contains minerals.'}", "{'keyLearningPoint': 'Sediments are deposited when wind or waterways slow down or when glaciers melt.'}", "{'keyLearningPoint': 'Layers of sediment form over many years, leading to compaction.'}", "{'keyLearningPoint': 'Sedimentary rock forms when sediment is buried and compressed, and salts from fluids cement the grains together.'}", "{'keyLearningPoint': 'Strata can be used to create a relative timeline and provide clues to the environment when the sediments were deposited.'}", "{'keyLearningPoint': 'Fossils are found in sedimentary rock, but not in other types of rock.'}", "{'keyLearningPoint': 'Fossils are often the remains of living plants or animals.'}", "{'keyLearningPoint': 'Bones buried in sedimentary rock can be very, very slowly dissolved by water and replaced by minerals in the water.'}", "{'keyLearningPoint': 'Geological activities can break or completely destroy fossils.'}", "{'keyLearningPoint': 'Earth\u2019s atmosphere is mostly within 7 to 15 km of its surface.'}", "{'keyLearningPoint': \"Earth's atmosphere is 78% N\u2082 and 21% O\u2082, with very small amounts of other gases and particles of liquids and solids.\"}", "{'keyLearningPoint': 'Greenhouse gases keep Earth\u2019s temperature warm enought for human life.'}", "{'keyLearningPoint': 'The test for oxygen gas is that it relights a glowing splint.'}", "{'keyLearningPoint': 'The test for carbon dioxide gas is that it forms a white precipitate that turns limewater milky.'}", "{'keyLearningPoint': \"Weathering is the slow breakdown of rocks on Earth's surface. It happens while the rocks are \u2018in place\u2019.\"}", "{'keyLearningPoint': 'Erosion is the process that removes material from where bedrock has been broken down or weathered.'}", "{'keyLearningPoint': 'Rock can be weathered biologically, chemically or physically.'}", "{'keyLearningPoint': 'Rock can be eroded by the wind, rain, or by flowing streams and rivers, oceans, ice flows or gravity.'}", "{'keyLearningPoint': 'Small changes caused by weathering and erosion can have large impacts over time.'}", "{'keyLearningPoint': 'Combustion increases the amount of carbon dioxide in the atmosphere.'}", "{'keyLearningPoint': 'Respiration of living things increases the amount of carbon dioxide in the atmosphere.'}", "{'keyLearningPoint': 'Decomposition of dead plants and animals increases the amount of carbon dioxide in the atmosphere.'}", "{'keyLearningPoint': 'Photosynthesis by plants, phytoplankton and some bacteria reduce the amount of carbon dioxide in the atmosphere.'}", "{'keyLearningPoint': 'Carbon dioxide can dissolve in the oceans.'}"], "9WavesPhysics": ["{'keyLearningPoint': 'Sound waves cause our eardrums, tiny bones within our ears, and the cochlea to vibrate.'}", "{'keyLearningPoint': 'Specialised cells in the cochlea sense vibrations and cause electrical signals to be sent to the brain along a nerve.'}", "{'keyLearningPoint': 'The brain creates the sensation of hearing a sound when it receives signals from the ear through a nerve.'}", "{'keyLearningPoint': 'Human ears can detect sound waves with frequencies between 20 Hz and 20 kHz, being most sensitive to 2\u20135 kHz waves.'}", "{'keyLearningPoint': 'Sound waves below 20 Hz are called infrasound; above 20 kHz, ultrasound. They are not detected by human ears.'}", "{'keyLearningPoint': 'Sound waves are caused when objects vibrate, causing nearby air particles to vibrate as well.'}", "{'keyLearningPoint': 'As a sound wave travels, each bit of air is vibrating parallel to the direction of wave travel, not travelling forwards.'}", "{'keyLearningPoint': 'Sound is a longitudinal wave: the direction of vibration is parallel to the direction of energy transfer.'}", "{'keyLearningPoint': 'Sound waves are faster in solids/liquids than gases; the particles are very close so vibrations are easily passed on.'}", "{'keyLearningPoint': 'Sound waves are faster in solids than liquids; the strong forces between particles mean vibrations travel even faster.'}", "{'keyLearningPoint': 'The \u2018speed of sound\u2019 is the distance travelled by a sound wave pulse every second, measured in m/s.'}", "{'keyLearningPoint': 'Sound wave speed depends on the medium: it is about 340 m/s in air, faster in liquids and faster still in solids.'}", "{'keyLearningPoint': 'Sound waves can reflect from hard surfaces, travel back and be heard again (an echo).'}", "{'keyLearningPoint': 'The speed of sound waves (or the distance they travel) can be calculated using the equation: speed = distance \u00f7 time.'}", "{'keyLearningPoint': 'In an experiment, measuring longer distances and times means any errors are a smaller proportion of the measurements.'}", "{'keyLearningPoint': 'Sound waves of frequency below 20 Hz usually cannot be heard by humans, so are called infrasound.'}", "{'keyLearningPoint': 'Sound waves of frequency above 20 000 Hz usually cannot be heard by humans, so are called ultrasound.'}", "{'keyLearningPoint': 'Ultrasound waves can cause objects to vibrate, so transfer energy. They do not cause harm to the human body.'}", "{'keyLearningPoint': 'Ultrasound can be used to image structures inside the body as it reflects from boundaries between tissues.'}", "{'keyLearningPoint': 'Ultrasound vibrations can clean delicate objects and can help to treat injuries and illnesses in physiotherapy.'}", "{'keyLearningPoint': 'As a water wave moves forward, each bit of water is moving up and down (oscillating), not forward.'}", "{'keyLearningPoint': 'Water waves are transverse waves: the direction of oscillation is 90\u00b0 to the direction of energy transfer.'}", "{'keyLearningPoint': 'The amplitude of a water wave is the greatest distance water moves above and below the rest position.'}", "{'keyLearningPoint': 'Waves that pass through each other can \u2018add up\u2019 or \u2018cancel out\u2019; this is called wave superposition.'}", "{'keyLearningPoint': 'Water waves reflect from hard barriers, obeying the laws of reflection.'}"], "10Disease and drugsBiology": ["{'keyLearningPoint': 'Asthma is a common non-infectious disease that can cause breathing difficulties.'}", "{'keyLearningPoint': 'During an asthma attack, the breathing (bronchial) tubes narrow.'}", "{'keyLearningPoint': 'Symptoms include wheezing and shortness of breath.'}", "{'keyLearningPoint': 'Symptoms of asthma can be treated using medication taken using an inhaler.'}", "{'keyLearningPoint': 'Risk factors for asthma include air pollution, smoking, low birth weight, having an allergy, and family history.'}", "{'keyLearningPoint': 'Infectious diseases can be passed from one organism to another.'}", "{'keyLearningPoint': 'Infectious diseases are caused by pathogens including viruses and some bacteria.'}", "{'keyLearningPoint': 'Some lifestyle factors are linked to non-infectious diseases.'}", "{'keyLearningPoint': 'Non-infectious diseases cannot be passed from one organism to another.'}", "{'keyLearningPoint': 'Some lifestyle factors affect the risk of developing non-infectious diseases of the gas exchange and circulatory system.'}", "{'keyLearningPoint': 'Eating an unbalanced diet and not getting enough exercise can increase the risk of developing lifestyle diseases.'}", "{'keyLearningPoint': 'Smoking, drinking alcohol and using drugs can increase the risk of developing lifestyle diseases.'}", "{'keyLearningPoint': 'To prevent lifestyle diseases people can exercise, eat a balanced diet, not smoke and avoid drinking alcohol.'}", "{'keyLearningPoint': 'Medicines are drugs that people take when they are ill.'}", "{'keyLearningPoint': 'People consume other drugs for recreation, including caffeine, nicotine and alcohol.'}", "{'keyLearningPoint': 'Recreational drugs can be classified as depressants or stimulants.'}", "{'keyLearningPoint': 'Depressants slow down thinking and reaction times.'}", "{'keyLearningPoint': 'Alcohol is a legal depressant, but long-term alcohol use can damage the brain and liver.'}", "{'keyLearningPoint': 'Stimulants make you feel more alert and can give you quicker thinking and reaction times.'}", "{'keyLearningPoint': 'Caffeine is a legal stimulant  present in some foods and drinks.'}", "{'keyLearningPoint': 'Cocaine and ecstasy are examples of illegal stimulants used as recreational drugs.'}", "{'keyLearningPoint': 'Substance abuse can cause physical and mental health issues.'}", "{'keyLearningPoint': 'Smoking involves inhaling smoke from burning tobacco leaves.'}", "{'keyLearningPoint': 'Tobacco leaves contain nicotine which is a very addictive substance and it affects the body.'}", "{'keyLearningPoint': 'Smoking affects the gas exchange system.'}", "{'keyLearningPoint': 'Smoking increases the risk of diseases such as asthma, COPD, lung cancer and heart disease.'}", "{'keyLearningPoint': 'Inhaling chemicals to become intoxicated is called solvent abuse.'}", "{'keyLearningPoint': 'Common solvents are paint thinner, glue, and nitrous oxide.'}", "{'keyLearningPoint': 'Solvents have many physical effects on the body.'}", "{'keyLearningPoint': 'Solvent abuse has risks of long-term health problems and can lead to death.'}", "{'keyLearningPoint': 'Why oxygen needs to be absorbed into, and carbon dioxide needs to be removed from, the human body.'}", "{'keyLearningPoint': 'The function and structures of the lungs in healthy humans.'}", "{'keyLearningPoint': 'The mechanism of breathing, including the role of muscles, to move air in and out of the lungs.'}", "{'keyLearningPoint': 'Adaptations of healthy lungs that increase the amount of gas exchange.'}", "{'keyLearningPoint': 'Detailed structure of the alveoli in healthy human lungs.'}", "{'keyLearningPoint': 'Vaping is an alternative to smoking.'}", "{'keyLearningPoint': 'Like smoking, vaping involves consuming nicotine which is detrimental to health.'}", "{'keyLearningPoint': 'The health effects of vaping are not yet fully known.'}", "{'keyLearningPoint': 'Scientific ideas are updated as new evidence emerges.'}"], "11Patterns in the periodic tableChemistry": ["{'keyLearningPoint': 'Noble gases are in Group 0 of the periodic table and are unreactive.'}", "{'keyLearningPoint': 'Noble gases are all gases at room temperature.'}", "{'keyLearningPoint': 'They have complete outer electron shells, making them stable.'}", "{'keyLearningPoint': 'Moving down Group 0 elements, atomic mass, density and boiling points increase.'}", "{'keyLearningPoint': 'The properties of elements in each group of the periodic table change gradually down the group.'}", "{'keyLearningPoint': 'Group 1 metals are soft, have lower densities than most other metals, and become more reactive down the group.'}", "{'keyLearningPoint': 'Group 1 metals are called alkali metals because they react with water to form an alkaline solution and hydrogen gas.'}", "{'keyLearningPoint': 'Group 2 metals react with dilute acids to form a salt and hydrogen gas.'}", "{'keyLearningPoint': 'Group 2 metals become more reactive down the group, but they are less reactive than Group 1 metals in the same period.'}", "{'keyLearningPoint': 'The elements in Group 7 are all non-metals that have coloured vapours, most of which are toxic.'}", "{'keyLearningPoint': 'The state of the elements at room temperature changes from gas to solid, down Group 7.'}", "{'keyLearningPoint': 'Reactivity decreases down Group 7.'}", "{'keyLearningPoint': 'Halogens react with Group 1 and 2 metals to form metal halides.'}", "{'keyLearningPoint': 'Metal halides are soluble in water.'}", "{'keyLearningPoint': 'Each column of the periodic table is called a group, and each row is called a period.'}", "{'keyLearningPoint': 'The periodic table was developed by a Russian scientist called Dimitri Mendeleev.'}", "{'keyLearningPoint': 'The periodic table contains all the elements organised into groups and periods, according to their properties.'}", "{'keyLearningPoint': 'The elements in the same group in the periodic table have similar properties.'}", "{'keyLearningPoint': 'In addition to groups, elements can be divided into non-metals and metals, which include the transition metals.'}"], "12Resistance and parallel circuitsPhysics": ["{'keyLearningPoint': 'With the same battery, two bulbs in parallel are brighter than two in series.'}", "{'keyLearningPoint': 'With the same battery, current through two bulbs in parallel is bigger than through two in series.'}", "{'keyLearningPoint': 'With the same battery, voltage across one of two bulbs in parallel is bigger than across one of two bulbs in series.'}", "{'keyLearningPoint': 'With the same battery, two bulbs in parallel are transferring energy from the battery more quickly than two in series.'}", "{'keyLearningPoint': 'A battery lighting two bulbs in parallel will run out faster than the same battery lighting the two bulbs in series.'}", "{'keyLearningPoint': 'An ammeter measures current in amps (A).'}", "{'keyLearningPoint': 'Resistance is a measure of how difficult it is for a current to flow.'}", "{'keyLearningPoint': 'Resistance is measured in ohms (\u03a9).'}", "{'keyLearningPoint': 'In a fair test, only the independent variable is changed so that no other variables affect the results.'}", "{'keyLearningPoint': 'The variables that are deliberately kept the same are called control variables.'}", "{'keyLearningPoint': 'The longer a wire, the greater its resistance.'}", "{'keyLearningPoint': 'Electric current in a wire is a flow of electrons moving through the spaces between \u2018atoms\u2019 (metal ions).'}", "{'keyLearningPoint': 'Doubling the length of a wire doubles its resistance.'}", "{'keyLearningPoint': 'Doubling the length of a wire doubles the number of \u2018atoms\u2019 (metal ions) in the way of the flow of electrons.'}", "{'keyLearningPoint': 'The resistance of a (uniform) wire is proportional to its length.'}", "{'keyLearningPoint': 'In a parallel circuit, each loop can be traced from one end of the cell or battery to the other end.'}", "{'keyLearningPoint': 'Each loop in a parallel circuit is equivalent to a series circuit connected to the same cell or battery.'}", "{'keyLearningPoint': 'A parallel circuit can be split into a number of series circuits each connected to the ends of the same cell or battery.'}", "{'keyLearningPoint': 'Electrical appliances and devices use different amounts of energy each second, as indicated by their power rating.'}", "{'keyLearningPoint': 'Power is a measure of the amount of energy used by or supplied to a device in one second.'}", "{'keyLearningPoint': 'Power is measured in watts (W).'}", "{'keyLearningPoint': 'Multiplying power of a device in kilowatts (kW) by time in hours (h) gives us the energy used in kilowatt\u2013hours (kWh).'}", "{'keyLearningPoint': 'Electricity bills are based on the amount of energy units used; 1 unit of energy is equal to 1 kWh.'}", "{'keyLearningPoint': 'A parallel circuit is a circuit with more than one complete loop, from one end of a battery to the other end.'}", "{'keyLearningPoint': 'A circuit is built systematically following a circuit diagram, round in one direction, starting from any point.'}", "{'keyLearningPoint': 'A parallel circuit is built systematically, completing each loop of the circuit in turn.'}", "{'keyLearningPoint': 'A circuit diagram is drawn systematically, following each loop round and completing each one in turn.'}", "{'keyLearningPoint': 'Wires in a circuit diagram are drawn with a ruler for clarity, with no tiny gaps that would break the circuit.'}", "{'keyLearningPoint': 'Current through the battery in a parallel circuit is measured with an ammeter, connected next to one end of the battery.'}", "{'keyLearningPoint': 'There are connections to the rest of the circuit at the ends of each branch in a parallel circuit.'}", "{'keyLearningPoint': 'The current through a branch of a parallel circuit is measured between its connections to the rest of the circuit.'}", "{'keyLearningPoint': 'The current through each branch of a parallel circuit adds up to the total current through the battery.'}", "{'keyLearningPoint': 'The thicker a wire, the smaller its resistance.'}", "{'keyLearningPoint': 'The greater the cross\u2013sectional area of a wire, the smaller its resistance.'}", "{'keyLearningPoint': 'Electric current in a wire is a flow of electrons moving between \u2018atoms\u2019 (metal ions).'}", "{'keyLearningPoint': 'Doubling the cross-sectional area of a wire halves its resistance.'}", "{'keyLearningPoint': 'Doubling the cross-sectional area of a wire doubles the number of electrons that can flow through the wire.'}", "{'keyLearningPoint': 'A voltmeter is connected to each side of a cell, battery or component.'}", "{'keyLearningPoint': 'Voltage (or potential difference) is measured in volts (V).'}", "{'keyLearningPoint': 'The voltage across a cell or battery measures the strength with which it can \u2018push\u2019 current around a circuit.'}", "{'keyLearningPoint': 'The voltage across a component in an electric circuit measures the size of \u2018push\u2019 that is moving current through it.'}", "{'keyLearningPoint': 'The voltage across each branch of a parallel circuit is the same as the voltage across the cell or battery.'}"], "13Reproduction in plantsBiology": ["{'keyLearningPoint': 'Displaying results in a table.'}", "{'keyLearningPoint': 'Displaying categoric and numerical data.'}", "{'keyLearningPoint': 'Interpreting and describing the results of an investigation into factors affecting seed germination.'}", "{'keyLearningPoint': 'Identifying patterns or trends in the results.'}", "{'keyLearningPoint': 'Writing a conclusion for an investigation into factors that affect seed germination.'}", "{'keyLearningPoint': 'Some seeds (e.g. cress seeds) will germinate on cotton wool in the right conditions.'}", "{'keyLearningPoint': 'Planning an investigation and writing a method for factors affecting the germination of seeds on cotton wool.'}", "{'keyLearningPoint': 'Deciding which variable to change to become the independent variable and what values to investigate.'}", "{'keyLearningPoint': 'Deciding which variable to measure to conclude on the effect (the dependent variable).'}", "{'keyLearningPoint': 'Deciding which variables to keep the same to ensure a valid conclusion (control variables).'}", "{'keyLearningPoint': 'Flowering plants reproduce sexually.'}", "{'keyLearningPoint': 'Plant reproduction is important as plants are producers and provide food for all animals on Earth.'}", "{'keyLearningPoint': 'Flowers contain male and female sex organs and gametes.'}", "{'keyLearningPoint': 'Egg cells (ova) are female gametes.'}", "{'keyLearningPoint': 'Pollen grains carry male gametes.'}", "{'keyLearningPoint': 'Seeds contain an embryo, food store and a tough outer coat, and they are formed in the ovary.'}", "{'keyLearningPoint': 'A fruit is the mature and ripened ovary of a seed-producing plant.'}", "{'keyLearningPoint': 'Fruits often contain seeds which will grow into a new plant, given the right conditions.'}", "{'keyLearningPoint': 'Seeds are adapted to be dispersed by animals, wind and water.'}", "{'keyLearningPoint': 'Pollinators are animals which transfer pollen from one flower to another, which enables plants to reproduce sexually.'}", "{'keyLearningPoint': 'Many food crops are pollinated by animal pollinators, including fruits, vegetables and nuts.'}", "{'keyLearningPoint': 'The majority of pollinators are insects, with bees being the largest group.'}", "{'keyLearningPoint': 'Food security means having enough affordable and nutritious food in an area or country.'}", "{'keyLearningPoint': 'Pollinating insects need to be protected from pesticides, climate change and habitat loss to ensure food security.'}", "{'keyLearningPoint': 'Pollination is the transfer of pollen from the male anther to the female stigma.'}", "{'keyLearningPoint': 'There are two types of pollination; self-pollination and cross-pollination. The latter increases variation in a species.'}", "{'keyLearningPoint': 'Pollen grains can be transferred by the wind, water or by insects.'}", "{'keyLearningPoint': 'Fertilisation is the fusion of the nuclei from the male and the female gametes.'}", "{'keyLearningPoint': 'A zygote grows into an embryo and then a new plant.'}", "{'keyLearningPoint': 'Experimental data can be analysed by plotting data on a line graph or bar chart.'}", "{'keyLearningPoint': 'Line graphs are used where the independent variable is continuous; bar charts are used where it is categoric.'}", "{'keyLearningPoint': 'Drawing a bar chart and/or line graph follows a set format.'}", "{'keyLearningPoint': 'A line of best fit on a line graph indicates the trend (relationship between in the independent and dependent variable).'}", "{'keyLearningPoint': 'Seeds are dispersed by different mechanisms to increase the chance of survival.'}", "{'keyLearningPoint': 'Seeds are adapted to match the mechanism for dispersal; e.g. wind dispersed are light with a large surface area.'}", "{'keyLearningPoint': 'Variables are factors that affect the process being investigated, the dependant variable is distance the seed travels.'}", "{'keyLearningPoint': 'Practical investigation of how far model seeds disperse with changes to their template.'}", "{'keyLearningPoint': 'Repeat measurements for each value to identify anomalous results and calculate a mean.'}"], "14Climate change and biodiversityBiologyChemistry": ["{'keyLearningPoint': 'Many foods are sold packaged in plastic, which is usually made from non-renewable resources such as fossil fuels'}", "{'keyLearningPoint': 'Plastic waste in landfills and oceans is a pollutant that takes a long time to degrade and can harm organisms'}", "{'keyLearningPoint': 'Biodegradable bioplastics made from renewable resources are a sustainable alternative to traditional plastic packaging'}", "{'keyLearningPoint': 'Plastic packaging helps prevents food spoilage and reduces food waste'}", "{'keyLearningPoint': 'We must weigh up the benefits of using plastic packaging against emissions from production and damage to biodiversity'}", "{'keyLearningPoint': 'Growing crops to feed animals and humans requires significant land use'}", "{'keyLearningPoint': 'Converting land for agricultural use is one of the major causes of deforestation'}", "{'keyLearningPoint': 'Deforestation results in habitat loss for many species'}", "{'keyLearningPoint': 'Conversion of land for agriculture is a major cause of habitat loss and biodiversity loss'}", "{'keyLearningPoint': 'Mitigation strategies include changing diets and positive land use change (e.g. reforestation and rewilding)'}", "{'keyLearningPoint': 'Food production is at risk due to global warming and climate change'}", "{'keyLearningPoint': 'Climate change makes extreme weather events more common, and this makes it more challenging to produce food'}", "{'keyLearningPoint': 'Emissions of greenhouse gases from various stages of food production add to the carbon footprint of foods'}", "{'keyLearningPoint': 'Changes in our diet can help us reduce emissions from food production and limit climate change'}", "{'keyLearningPoint': 'Comparing emissions data for different diets helps us understand the impact of food choices'}", "{'keyLearningPoint': 'Deforestation disrupts the carbon cycle because less CO\u2082 is absorbed from the atmosphere for photosynthesis'}", "{'keyLearningPoint': 'CO\u2082 is a greenhouse gas in the atmosphere that enhances the greenhouse effect and contributes to climate change'}", "{'keyLearningPoint': 'Deforestation disrupts the water cycle because less water is absorbed and transpired'}", "{'keyLearningPoint': 'Deforestation leads to more surface runoff of water, increasing flooding and putting our food security at risk'}", "{'keyLearningPoint': 'Mitigation strategies include reforestation and legal protection of forests to prevent deforestation'}", "{'keyLearningPoint': 'Species have adaptations that enable them to live and thrive in the conditions of their habitat'}", "{'keyLearningPoint': 'Human emissions of greenhouse gases are leading to global warming and climate change'}", "{'keyLearningPoint': 'Climate change is changing the conditions in habitats, so species may be less well adapted to live there'}", "{'keyLearningPoint': 'Some, but not all, species can survive changes in conditions by migrating to a new habitat'}", "{'keyLearningPoint': 'Climate change, including more frequent extreme weather events, can lead to biodiversity loss'}"]};
const sel = document.getElementById('unit-select');
const pointsDiv = document.getElementById('points');
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function populateUnits(){Object.keys(UNITS).forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;sel.appendChild(o)});}  
function showPoints(unit){pointsDiv.innerHTML=''; if(!unit) return; const items=UNITS[unit]||[]; if(items.length===0){pointsDiv.textContent='No key learning points found.'; return;} const frag=document.createDocumentFragment(); items.forEach(p=>{const div=document.createElement('div');div.textContent=p;frag.appendChild(div)}); pointsDiv.appendChild(frag);} 
sel.addEventListener('change', e=>showPoints(e.target.value));
populateUnits();
