<script>
const UNITS = {"1ForcesPhysics": ["{'keyLearningPoint': 'Two forces of equal size, acting in opposite directions on an object, are balanced.'}", "{'keyLearningPoint': 'The resultant force is the sum of the forces acting on the object, taking into account their direction.'}", "{'keyLearningPoint': 'When forces are balanced there is no resultant force and no change in speed.'}", "{'keyLearningPoint': 'When there are two forces acting in opposite directions, the resultant force acts in the direction of the bigger force.'}", "{'keyLearningPoint': 'The greater the resultant force on a given object, the greater or faster the change in speed.'}", "{'keyLearningPoint': 'Objects can have energy because they are: moving, raised, hot, stretched/squashed, or contain chemicals that can react.'}", "{'keyLearningPoint': 'When an object is said to have energy, this is really just saying the object has certain properties.'}", "{'keyLearningPoint': 'Objects can have gravitational, thermal, elastic, chemical and kinetic stores of energy.'}", "{'keyLearningPoint': 'Having energy means having properties that allow objects to interact, cause changes and make things happen.'}", "{'keyLearningPoint': 'Friction is the force of one surface gripping or rubbing on another.'}", "{'keyLearningPoint': 'Friction prevents or slows down movement between surfaces.'}", "{'keyLearningPoint': 'Friction is caused by the roughness of surfaces.'}", "{'keyLearningPoint': 'Lubricants are substances added between two surfaces to reduce friction.'}", "{'keyLearningPoint': 'Forces are measured with a newton meter.'}", "{'keyLearningPoint': 'Forces are measure in newtons (N).'}", "{'keyLearningPoint': 'With no force, newton meters need to be adjusted to zero.'}", "{'keyLearningPoint': 'Newton meters should be selected by considering the scale.'}", "{'keyLearningPoint': 'Repeat readings help check for mistakes.'}", "{'keyLearningPoint': 'Categoric variables come in distinct types. Continous variables can take any value on a numerical scale.'}", "{'keyLearningPoint': 'Bar charts are used when the variable you changed in an experiment is categoric.'}", "{'keyLearningPoint': 'An effective lubricant reduces the friction force.'}", "{'keyLearningPoint': 'A conclusion states what you found out in an experiment and also explains how you know.'}", "{'keyLearningPoint': 'Lubricants are substances added between two surfaces to reduce the friction between them.'}", "{'keyLearningPoint': 'In a fair test, only the variable we are testing is changed.'}", "{'keyLearningPoint': 'In a fair test, everything we are not testing is kept the same for every measurement.'}", "{'keyLearningPoint': 'Repeat measurements help check for anomalous results.'}", "{'keyLearningPoint': 'A mean combines repeat measurements  into a single result.'}", "{'keyLearningPoint': 'Contact forces only act when objects are touching.'}", "{'keyLearningPoint': 'Non-contact forces can act with or without the objects touching.'}", "{'keyLearningPoint': 'Friction is a contact force that slows or prevents movement.'}", "{'keyLearningPoint': 'Drag is a contact force that pushes against objects moving through liquids or gases.'}", "{'keyLearningPoint': 'Energy cannot be created or destroyed.'}", "{'keyLearningPoint': 'Energy can be transferred by forces that change the properties of an object (or system).'}", "{'keyLearningPoint': 'Force arrows show the direction of a force.'}", "{'keyLearningPoint': 'The length of a force arrow shows the size of a force.'}", "{'keyLearningPoint': 'A force arrow is drawn starting from a point that shows where the force acts.'}", "{'keyLearningPoint': 'Force arrows are best labelled as the force acting on (object A) by (object B).'}", "{'keyLearningPoint': 'The motion of faster objects is harder to stop.'}", "{'keyLearningPoint': 'The motion of heavier objects is harder to stop.'}", "{'keyLearningPoint': 'Objects with a greater mass need a greater force to start or stop it moving, and to change the direction of motion.'}", "{'keyLearningPoint': 'A force is a push or a pull.'}", "{'keyLearningPoint': 'A force is needed to change the motion or shape of an object.'}"], "2Solid, liquid, gas states and changes of stateChemistry": ["{'keyLearningPoint': 'The condensing point and boiling point are the same temperature for a substance, for water this is 100\u00b0C.'}", "{'keyLearningPoint': 'Steam is water in the gas state.'}", "{'keyLearningPoint': 'A substance increases in volume in the gas state when boiled.'}", "{'keyLearningPoint': 'A substance decreases in volume in the liquid state when condensed.'}", "{'keyLearningPoint': 'Particles move further apart when boiled and move closer together when condensed.'}", "{'keyLearningPoint': 'The heavy base of a Bunsen burner does not get hot'}", "{'keyLearningPoint': 'Opening the air hole on a Bunsen burner changes the flame from orange and sooty to a hotter, cleaner, blue flame.'}", "{'keyLearningPoint': 'Adjusting the gas tap controls the size of the Bunsen burner flame.'}", "{'keyLearningPoint': 'A splint used to light a Bunsen burner should be lit from the nearest Bunsen burner that is already lit.'}", "{'keyLearningPoint': 'A lit splint should be carried with the flame angled slightly downwards and shielded by the other hand.'}", "{'keyLearningPoint': 'States of matter can have differing amounts of energy.'}", "{'keyLearningPoint': 'Solid states have the least energy, gas states have the most energy.'}", "{'keyLearningPoint': 'A substance in its liquid state can evaporate at temperatures below its boiling point.'}", "{'keyLearningPoint': 'The hotter the water, the more quickly it evaporates.'}", "{'keyLearningPoint': 'Water evaporates at temperatures that are lower than 100\u2103.'}", "{'keyLearningPoint': 'When it melts, a substance changes from the solid state to the liquid state.'}", "{'keyLearningPoint': 'When it freezes, a substance changes from the liquid state to the solid state.'}", "{'keyLearningPoint': 'At temperatures below its melting point, a substance is in its solid state.'}", "{'keyLearningPoint': 'At temperatures above its freezing point, a substance is in its liquid state.'}", "{'keyLearningPoint': 'The melting point and freezing point of a pure substance are the same temperature.'}", "{'keyLearningPoint': 'In the solid state, forces of attraction between particles hold them in fixed positions.'}", "{'keyLearningPoint': 'In the liquid state, particles are held together but have enough energy to break free to move around.'}", "{'keyLearningPoint': 'The stronger the force of attraction between particles in a substance, the higher its melting point.'}", "{'keyLearningPoint': 'Water freezes at 0\u00baC, room temperature is about 20\u00baC and body temperature is about 37\u00baC.'}", "{'keyLearningPoint': 'The bulb of a thermometer is made of very thin glass and is delicate.'}", "{'keyLearningPoint': 'In the gas state a substance can flow, it fills the whole of a container and can be compressed.'}", "{'keyLearningPoint': 'In the gas state, particles of a substance are moving very quickly in random directions with gaps between them.'}", "{'keyLearningPoint': 'In the gas state, particles have enough energy to be free of the attractive forces between them.'}", "{'keyLearningPoint': 'There is nothing at all between the particles in a gas.'}", "{'keyLearningPoint': 'A substance may have a solid, liquid and gas state'}", "{'keyLearningPoint': 'In the solid state a substance has a fixed shape, it does not flow and cannot be compressed'}", "{'keyLearningPoint': 'In the liquid state a substance can flow, it fills the shape of its container and cannot be compressed'}", "{'keyLearningPoint': 'All substances are made of particles that are too small to see'}"], "3CellsBiology": ["{'keyLearningPoint': 'Cells have a 3D shape (not 2D as they often appear in textbooks).'}", "{'keyLearningPoint': 'Common structures of animal cells can be shown in diagrams.'}", "{'keyLearningPoint': 'These structures include the cytoplasm, cell membrane, nucleus and mitochondria.'}", "{'keyLearningPoint': 'Each structure in an animal cell has a specific function.'}", "{'keyLearningPoint': 'Cells can be represented using 2D and 3D scientific models.'}", "{'keyLearningPoint': 'Unicellular organisms are made of a single living cell.'}", "{'keyLearningPoint': 'Multicellular organisms are made of more than one cell (sometimes millions), and different cells take on different jobs.'}", "{'keyLearningPoint': 'In multicellular organisms, cells join together to form tissues with specific jobs.'}", "{'keyLearningPoint': 'An organ is a group of tissues working together to do a specific job, and organs work together in an organ system.'}", "{'keyLearningPoint': 'Unicellular organisms have different structures that have adaptations to help them function and stay alive.'}", "{'keyLearningPoint': 'All organisms are made up of living building blocks called cells.'}", "{'keyLearningPoint': 'Cells are usually too small to see with the unaided eye.'}", "{'keyLearningPoint': 'The cells that make up tissue on a slide can be observed using a light microscope.'}", "{'keyLearningPoint': 'Changing the magnification and focus of a light microscope enables cell structures to be observed.'}", "{'keyLearningPoint': 'Plant cells have some common structures.'}", "{'keyLearningPoint': 'Some of these structures are common with animal cells, such as the cytoplasm, cell membrane, nucleus and mitochondria.'}", "{'keyLearningPoint': 'Plant cells have additional structures including the cell wall and vacuole, and some have chloroplasts.'}", "{'keyLearningPoint': 'Each structure in a plant cell has a specific function.'}", "{'keyLearningPoint': 'Plant cells can be adapted with different shapes and structures.'}", "{'keyLearningPoint': 'The cells that make up tissue can be viewed using a light microscope.'}", "{'keyLearningPoint': 'A sample of tissue can be prepared on a slide to view using a microscope.'}", "{'keyLearningPoint': 'Adding a stain can make it easier to see some parts of cells.'}", "{'keyLearningPoint': 'Changing the magnification and focus of a light microscope enables stained cell structures to be observed.'}", "{'keyLearningPoint': 'Observations from a light microscope can be recorded in a scientific line drawing.'}", "{'keyLearningPoint': 'The animal and plant cell models describe common features of cells.'}", "{'keyLearningPoint': 'Not all cells have all these features, and some cells have additional ones.'}", "{'keyLearningPoint': 'Specialised cells in animals and plants have shapes, sizes, and structures, that are adapted for the jobs the cells do.'}", "{'keyLearningPoint': 'Examples of specialised cells include red blood cells in animals and root hair cells in plants.'}", "{'keyLearningPoint': 'The same life processes happen in all living organisms.'}", "{'keyLearningPoint': 'These life processes include movement, reproduction, sensitivity, growth, respiration, excretion and nutrition.'}", "{'keyLearningPoint': 'All living organisms are made from other living organisms when they reproduce.'}", "{'keyLearningPoint': 'Movement is a sign of life when the organism moves itself to achieve something.'}", "{'keyLearningPoint': 'All these processes happen at some stage in the life cycle of every living organism.'}"], "4Our solar system and beyondPhysics": ["{'keyLearningPoint': 'Earth was once thought to be flat, with all the stars and the Sun moving around it.'}", "{'keyLearningPoint': 'Until the 16th century most people thought Earth was at the centre of the universe.'}", "{'keyLearningPoint': 'Observations with telescopes provide evidence that helps us to understand the universe.'}", "{'keyLearningPoint': 'In summer there are more daylight hours, compared to winter, the Sun appears higher in the sky and it is warmer.'}", "{'keyLearningPoint': 'When it is summer in northern hemisphere countries it is winter in southern hemisphere countries.'}", "{'keyLearningPoint': 'Earth spins on an axis that is tilted at an angle of 23.5 degrees.'}", "{'keyLearningPoint': 'In June, the northern hemisphere is tilted towards the Sun, so has summer.'}", "{'keyLearningPoint': 'In June, the southern hemisphere is tilted away from the Sun, so has winter.'}", "{'keyLearningPoint': 'Gravitational forces pull (attract) objects towards the centre of large objects like planets, moons and stars.'}", "{'keyLearningPoint': 'The greater the mass of an object, the stronger its gravity.'}", "{'keyLearningPoint': 'The gravity of a planet, moon or star extends far into space, but gets weaker with distance.'}", "{'keyLearningPoint': \"Earth\u2019s gravity pulls the Moon towards the centre of Earth, changing the Moon's direction, making it orbit around Earth.\"}", "{'keyLearningPoint': \"The Sun's gravity pulls Earth towards the centre of the Sun, changing Earth's direction, making it orbit around the Sun.\"}", "{'keyLearningPoint': 'Heating a surface from directly overhead is more effective than heating a surface at a different angle.'}", "{'keyLearningPoint': 'When rays of light hit a surface face-on, they are less spread out than if they hit at an angle.'}", "{'keyLearningPoint': 'At a place on Earth, the heating effect of the Sun is greatest at midday and lowest at sunrise and sunset.'}", "{'keyLearningPoint': \"Over a day, Earth's spin changes the Sun's height in the sky and the angle at which the Sun's rays arrive at a place.\"}", "{'keyLearningPoint': 'A star is an extremely large sphere of hot gas that gives out light.'}", "{'keyLearningPoint': 'A planet is a very large sphere of rock or gas that orbits a star.'}", "{'keyLearningPoint': 'Our solar system includes the Sun (a star) and all the objects that orbit the Sun.'}", "{'keyLearningPoint': 'Orbiting the Sun are: 8 planets (many of which have moons), dwarf planets and smaller objects such as asteroids.'}", "{'keyLearningPoint': 'Distances between objects in our solar system are very, very large compared to the sizes of the objects.'}", "{'keyLearningPoint': 'The seasons change because of Earth\u2019s tilted axis, which does not change direction as Earth orbits the Sun.'}", "{'keyLearningPoint': 'In June, the northern hemisphere is tilted towards the Sun so has summer, and the southern hemisphere has winter.'}", "{'keyLearningPoint': 'In December, the northern hemisphere is tilted away from the Sun so has winter, and the southern hemisphere has summer.'}", "{'keyLearningPoint': \"The seasons that occur at a place on Earth can be explained by the different angles made to the sun's rays over a year.\"}", "{'keyLearningPoint': 'Countries near the Equator do not experience summers and winters as they stay close to \u2018face-on\u2019 to the Sun all year.'}", "{'keyLearningPoint': 'The Sun is a star, an extremely hot sphere of gas that emits light.'}", "{'keyLearningPoint': 'The stars in the night sky are much smaller and dimmer than the Sun because they are much further away.'}", "{'keyLearningPoint': 'A light-year is the distance light travels in one year. This is large enough to be suitable for distances in space.'}", "{'keyLearningPoint': 'In the universe, stars are found in groups called galaxies, with billions of stars in each one.'}", "{'keyLearningPoint': 'There are billions of galaxies in the universe.'}", "{'keyLearningPoint': 'Earth is a planet. It is a sphere that spins once every 24 hours.'}", "{'keyLearningPoint': \"Earth's spin explains day and night.\"}", "{'keyLearningPoint': 'Earth orbits the Sun, with each orbit taking 365.25 days (1 year).'}", "{'keyLearningPoint': 'Earth orbits the Sun in an almost perfect circle.'}", "{'keyLearningPoint': 'The Moon orbits the Earth about once per month (27.3 days), this explains why the Moon appears to change shape.'}"], "5SolutionsChemistry": ["{'keyLearningPoint': 'Brownian motion is the random motion of particles suspended in a medium.'}", "{'keyLearningPoint': 'Particles of a substance released into a fluid (a gas or liquid) move around and are pushed by other particles.'}", "{'keyLearningPoint': 'Substances that have particles that are free to move will eventually reach a random distribution throughout.'}", "{'keyLearningPoint': 'At higher temperatures, particles in a gas or solution move more quickly.'}", "{'keyLearningPoint': 'Suspensions are not solutions, as solid particles can be seen, and eventually will settle over time.'}", "{'keyLearningPoint': 'Forces of attraction between solute particles have to be overcome for something to dissolve.'}", "{'keyLearningPoint': 'In a mixture, one particle may fit into spaces between another type, making the total volume less than expected.'}", "{'keyLearningPoint': 'Not every substance can be dissolved (is soluble) in a solvent.'}", "{'keyLearningPoint': 'Dissolving is not the same as melting, but both are physical processes.'}", "{'keyLearningPoint': 'A method provides step-by-step instructions for how to carry out an investigation.'}", "{'keyLearningPoint': 'Methods should include how equipment is used and specific amounts of substances used.'}", "{'keyLearningPoint': 'Methods should be written so that they are both repeatable and reproducible.'}", "{'keyLearningPoint': 'Methods are written concisely, using clear language and command words.'}", "{'keyLearningPoint': 'A solution is formed when a soluble solid dissolves in an appropriate solvent'}", "{'keyLearningPoint': 'In chemistry, mass is measured in grams (g)'}", "{'keyLearningPoint': 'The mass of substances that are mixed adds together to give the total mass of the mixture (mass is conserved)'}", "{'keyLearningPoint': 'Laboratory equipment are designed for specific uses and choice of equipment impacts the quality of results'}", "{'keyLearningPoint': 'Mass can be measured on a balance, in grams'}", "{'keyLearningPoint': 'Volume can be measured in a measuring cylinder, in cm\u00b3'}", "{'keyLearningPoint': 'Laboratory apparatus are designed for specific uses and choice of apparatus impacts the quality of results'}", "{'keyLearningPoint': 'Equipment can be communicated using 2D drawings/images'}", "{'keyLearningPoint': 'Scientific diagrams illustrate how equipment is used together for practical investigations'}", "{'keyLearningPoint': 'A pure material is made of only one type of substance'}", "{'keyLearningPoint': 'A pure material has a fixed melting point and boiling point'}", "{'keyLearningPoint': 'Impurities change the melting and boiling point of a material'}", "{'keyLearningPoint': 'A mixture contains two or more types of substances which can be easily separated'}", "{'keyLearningPoint': 'Mixtures melt or boil over a range of temperatures'}", "{'keyLearningPoint': 'At a given temperature, there is a limit to how much solute can dissolve in a solvent.'}", "{'keyLearningPoint': 'Solutes may become insoluble as a solution cools.'}", "{'keyLearningPoint': 'Lines of best fit can be used to predict unknowns values if one variable is known.'}", "{'keyLearningPoint': 'Data from multiple investigations can be plotted on the same graph for ease of comparison.'}", "{'keyLearningPoint': 'Scientists transfer data to graphs in order to find any trends in the collected data.'}", "{'keyLearningPoint': 'The type of data collected affects the type of graph used to present it.'}", "{'keyLearningPoint': 'A line of best fit can help to identify and describe relationships between variables.'}", "{'keyLearningPoint': 'Conclusions refer to both the independent and dependent variables when describing the data collected.'}", "{'keyLearningPoint': 'The solubility of a substance could depend upon the size of the solute pieces, the choice or temperature of the solvent.'}", "{'keyLearningPoint': 'The independent and dependent variables, and any measurements taken during an investigation, are recorded in a table.'}", "{'keyLearningPoint': 'Aspects of an investigation that can be changed and measured are known as variables'}", "{'keyLearningPoint': 'The independent variable is what is changed in an investigation'}", "{'keyLearningPoint': 'The dependent variable is what is observed / measured in an investigation'}", "{'keyLearningPoint': 'Variables that are kept the same each time are called control variables'}", "{'keyLearningPoint': 'In a fair test, only the variable being tested is changed so that it is clear that it made a difference to the results'}"], "6EcosystemsBiology": ["{'keyLearningPoint': 'Prey have adaptations to help them avoid being hunted, and predators are adapted to help them capture prey.'}", "{'keyLearningPoint': 'Some common adaptations of prey animals are that they have good camouflage or that they are nocturnal.'}", "{'keyLearningPoint': 'Some common adaptations of predators are big teeth, good eyesight and the ability to run fast.'}", "{'keyLearningPoint': 'Some toxic substances are persistent (they stay in the environment and do not break down).'}", "{'keyLearningPoint': 'If consumed, persistent toxic substances can be passed up the food chain.'}", "{'keyLearningPoint': 'The bioaccumulation of toxic substances can cause damage to organisms, particularly top predators.'}", "{'keyLearningPoint': 'The use of pesticides in farming can cause bioaccumulation.'}", "{'keyLearningPoint': 'Ecosystems are made up of living organisms, which interact and depend on each other, and their physical environment.'}", "{'keyLearningPoint': 'Habitats are where plants and animals live, and they contain living (biotic) and non-living (abiotic) parts.'}", "{'keyLearningPoint': 'Organisms interact with the environment in which they live.'}", "{'keyLearningPoint': 'All species have adaptations which make them suited to their environment.'}", "{'keyLearningPoint': 'Changes to the environment may make it harder for organisms to survive in a particular habitat.'}", "{'keyLearningPoint': 'Producers are organisms that can make their own food, including plants and some microorganisms.'}", "{'keyLearningPoint': 'Consumers (e.g. humans and other animals) cannot make their own food; they get their food by eating other organisms.'}", "{'keyLearningPoint': 'A food chain diagram shows the feeding relationships between populations of organisms.'}", "{'keyLearningPoint': 'The arrows in a food chain diagram represent transfers of biomass.'}", "{'keyLearningPoint': 'A change in the size of a population will affect other populations in the food chain.'}", "{'keyLearningPoint': 'A community of organisms is made up of interacting populations of species.'}", "{'keyLearningPoint': 'A food web diagram represents several interconnected food chains within a community of organisms.'}", "{'keyLearningPoint': 'A change in the size of a population will affect other populations in the food web.'}", "{'keyLearningPoint': 'All consumers, including humans, depend on producers because they make all of the food for the rest of the food chain.'}", "{'keyLearningPoint': 'Plants produce edible seeds and fruits after pollination (transfer pollen from the anthers of flowers to the stigma).'}", "{'keyLearningPoint': 'Many plants depend on animals such as insects to pollinate them, and on animals such as birds to disperse their seeds.'}", "{'keyLearningPoint': 'Because of food chains and pollination, producers and consumers are interdependent.'}", "{'keyLearningPoint': 'Pollinators are important, ensuring there is food security for humans (having enough food to feed the human population).'}", "{'keyLearningPoint': 'Predators are hunters and prey are hunted.'}", "{'keyLearningPoint': 'Different factors can affect the population sizes of predators and prey (e.g. disease).'}", "{'keyLearningPoint': 'There is a relationship between the predator and prey population sizes, each is impacted by changes in the other.'}", "{'keyLearningPoint': 'Biodiversity is the number of different species that live in a place.'}", "{'keyLearningPoint': 'Biodiversity is important as it keeps habitats healthy, and provides humans with food, medicines and other resources.'}", "{'keyLearningPoint': 'Humans have a negative impact on biodiversity through habitat destruction and pollution of the environment.'}", "{'keyLearningPoint': 'Humans can take action to help maintain biodiversity, such as through conservation activities.'}", "{'keyLearningPoint': 'Genetic diversity can be conserved through seed banks and other forms of gene banks.'}", "{'keyLearningPoint': 'Farmers use chemicals called  fertilisers to produce more crops.'}", "{'keyLearningPoint': 'Farmers use chemicals called pesticides to produce more crops.'}", "{'keyLearningPoint': 'Some pesticides kill insects and this helps crops to grow because they are not being eaten.'}", "{'keyLearningPoint': 'Some pesticides kill other plants (weeds) that compete with the crops to grow.'}", "{'keyLearningPoint': 'Fertilisers and pesticides can be harmful to the environment and wildlife.'}"], "7Sound, light and visionPhysics": ["{'keyLearningPoint': 'Transparent objects transmit light (let light travel through them). Opaque objects do not transmit light through them.'}", "{'keyLearningPoint': 'Light travels in straight lines at an extremely high speed, spreading out as it travels.'}", "{'keyLearningPoint': 'Light rays are straight arrows added to diagrams to show the direction that some light is travelling.'}", "{'keyLearningPoint': 'A shadow is an unlit area in the shape of an object that is blocking light.'}", "{'keyLearningPoint': 'Light travelling in one direction (along a ray) that hits a mirror reflects (bounces off the mirror) in one direction.'}", "{'keyLearningPoint': 'The \u2018normal\u2019 is an imaginary line drawn at 90\u00b0 to the point of reflection.'}", "{'keyLearningPoint': 'The angles of incidence and reflection are measured to the normal.'}", "{'keyLearningPoint': 'The angle of reflection is always equal to the angle of incidence, the other side of the normal.'}", "{'keyLearningPoint': 'On a graph, a line of best fit highlights the main pattern of the data, ignoring small errors.'}", "{'keyLearningPoint': 'Luminous objects give out light, non\u2013luminous objects do not.'}", "{'keyLearningPoint': 'All surfaces reflect light. Mirror\u2013like surfaces reflect light in a regular way, other surfaces scatter light.'}", "{'keyLearningPoint': 'For anything to be seen, light from it (either emitted or reflected) must enter the eye.'}", "{'keyLearningPoint': 'Light enters the eye through a hole (the pupil) and is detected by the light\u2013sensitive back surface (the retina).'}", "{'keyLearningPoint': 'Beams of light can only be seen if the light hits something and reflects (or scatters) towards an eye.'}", "{'keyLearningPoint': 'Light reflects from mirrors obeying the laws of reflection. Some reflects into our eyes causing an image to be  seen.'}", "{'keyLearningPoint': 'The image in a mirror is located where the light rays seem to have come from.'}", "{'keyLearningPoint': 'A reflection appears to be directly opposite the object, the same distance behind the mirror as the object is in front.'}", "{'keyLearningPoint': 'The image in a mirror is the right way up but is laterally inverted.'}", "{'keyLearningPoint': 'Sound reflects from hard surfaces. An echo is when a sound is heard again after reflecting and travelling back.'}", "{'keyLearningPoint': 'Smooth, flat surfaces help to produce echoes. Irregular surfaces reflect sound in many directions, spreading it out.'}", "{'keyLearningPoint': 'The particles of harder materials are held together by stronger forces so sound waves can\u2019t make them vibrate much.'}", "{'keyLearningPoint': 'Soft surfaces absorb a lot of sound because sound waves transfer energy by making the particles in them vibrate.'}", "{'keyLearningPoint': 'Noise (unwanted sound) can be reduced by using soft materials to absorb it or hard materials to reflect it.'}", "{'keyLearningPoint': 'All sounds are caused by vibrations. Some vibrations are too small or too fast to see.'}", "{'keyLearningPoint': 'The volume of a sound means how loud or quiet it is. The pitch of a sound means how high or low it is.'}", "{'keyLearningPoint': 'Amplitude is a measure of the distance or size of a vibration. The greater the amplitude, the louder a sound.'}", "{'keyLearningPoint': 'Frequency is a measure of how often the vibrations occur. The greater the frequency, the higher the pitch.'}", "{'keyLearningPoint': 'Sounds of different volume and pitch can be produced by controlling the amplitude and frequency of vibrations.'}", "{'keyLearningPoint': 'Sound spreads out and becomes quieter (lower amplitude vibrations) as it travels.'}", "{'keyLearningPoint': 'Sound travels through a medium by vibrations being passed on between the particles of the medium.'}", "{'keyLearningPoint': 'Sound travels faster through liquids than gases as the particles are closer so vibrations can be passed on more easily.'}", "{'keyLearningPoint': 'Sound travels fastest through solids due to strong attractive forces between particles so many vibrate when one does.'}", "{'keyLearningPoint': \"Sound waves are caused by vibrations of particles so sound can't travel through a vacuum (where there are no particles).\"}", "{'keyLearningPoint': 'A vibrating object causes nearby air particles to vibrate too.'}", "{'keyLearningPoint': 'Air particles are knocked forwards but then spread backwards when the object moves back.'}", "{'keyLearningPoint': 'Vibrating air particles knock into their neighbours and set them vibrating too, in the same way.'}", "{'keyLearningPoint': 'The pattern of vibrating particles creates a sound wave. Sound does not involve air particles travelling.'}", "{'keyLearningPoint': 'Scientific models often only accurately reflect some aspects of what they represent.'}"], "8Heredity and DNABiology": ["{'keyLearningPoint': 'Reproduction (having offspring) is part of the life cycle of all organisms.'}", "{'keyLearningPoint': 'When organisms reproduce they make offspring of the same kind (species resemblance).'}", "{'keyLearningPoint': 'Heredity is the process of organisms passing on features to their offspring.'}", "{'keyLearningPoint': 'Offspring inherit features from both parents, so they look similar to them and one another (family resemblance).'}", "{'keyLearningPoint': 'Usually offspring vary and are not identical to their parents or one another (except for identical twins).'}", "{'keyLearningPoint': 'Biological features are inherited when genetic material is passed from parents to their offspring during reproduction.'}", "{'keyLearningPoint': 'Genetic material provides instructions for growth and other life processes.'}", "{'keyLearningPoint': 'Only features caused by instructions in the genetic material can be inherited.'}", "{'keyLearningPoint': 'Features caused by lifestyle and the environment cannot be inherited.'}", "{'keyLearningPoint': 'Examples of features caused by genetic information (e.g. eye colour) and by the environment (e.g. scars).'}", "{'keyLearningPoint': 'Plant and animal cells are made of parts including a cell membrane, cytoplasm and a nucleus.'}", "{'keyLearningPoint': 'In plant, animal and fungi cells, the genetic material is stored in the nucleus.'}", "{'keyLearningPoint': 'Bacteria are microorganisms and do not have a nucleus; their genetic material is stored in the cytoplasm.'}", "{'keyLearningPoint': 'The genetic material of all organisms is made of a chemical substance called DNA.'}", "{'keyLearningPoint': 'DNA is built from molecules that form a code used as instructions to build inherited features and control life processes'}", "{'keyLearningPoint': 'Genetic material is made of DNA.'}", "{'keyLearningPoint': 'DNA is a long chemical molecule, made of two chains of smaller chemical units joined together.'}", "{'keyLearningPoint': 'All of the DNA in a cell is called the genome.'}", "{'keyLearningPoint': 'The chains are spiralled around one another in a double helix, with links across the middle.'}", "{'keyLearningPoint': 'Scientific models of DNA can be evaluated for their strengths and weaknesses.'}", "{'keyLearningPoint': 'DNA is a chemical substance that can be extracted from the cells of organisms such as fruit.'}", "{'keyLearningPoint': 'DNA molecules cannot usually be seen with the unaided eye, but clumps of it can be seen when a lot of it is extracted.'}", "{'keyLearningPoint': 'Observing or following an appropriate method to extract DNA from fruit (e.g. kiwi fruit).'}", "{'keyLearningPoint': 'Discussion of apparatus and techniques used to filter the tissue and extract the DNA.'}", "{'keyLearningPoint': 'Observing and describing the appearance of the DNA after extraction.'}", "{'keyLearningPoint': 'DNA was discovered in 1869, but scientists did not work out its structure until 1953.'}", "{'keyLearningPoint': 'Scientists collected evidence and shared findings to develop a model to describe the structure of DNA.'}", "{'keyLearningPoint': 'Rosalind Franklin\u2019s team in London used X-rays to produce an image of a DNA molecule in1952.'}", "{'keyLearningPoint': 'Maurice Wilkins from Franklin\u2019s group showed the picture to James Watson from Cambridge.'}", "{'keyLearningPoint': 'Watson and Francis Crick used the picture evidence to complete a model to describe the double helix structure of DNA.'}", "{'keyLearningPoint': 'All organisms have a genome, and there are similarities and differences between the genomes of different organisms.'}", "{'keyLearningPoint': 'The genome is made of DNA, wound up into tightly-packed structures called chromosomes.'}", "{'keyLearningPoint': 'Human body cells have 23 pairs of chromosomes, stored in the nucleus; bacteria have one that is stored in the cytoplasm.'}", "{'keyLearningPoint': 'Sections of the DNA in chromosomes are called genes, which store instructions for inherited features and life processes.'}", "{'keyLearningPoint': 'Other sections are non-coding DNA, which contains instructions that controls when the information in genes is used.'}"], "9Separation techniquesChemistry": ["{'keyLearningPoint': 'Magnets attract iron and steel'}", "{'keyLearningPoint': 'Insoluble solids can be separated from a liquid using a filter by a process known as filtration.'}", "{'keyLearningPoint': 'Filter paper is folded to make a pocket that fits in a filter funnel for filtering fine particles'}", "{'keyLearningPoint': 'A drop of water on a filter funnel helps keep the filter paper cone open for easy filtering'}", "{'keyLearningPoint': 'Evaporation can remove solvent from a solution, leading to the production of a saturated solution.'}", "{'keyLearningPoint': 'Crystallisation reforms a solute as crystals from a saturated solution following a change in conditions.'}", "{'keyLearningPoint': 'Solvents evaporate into the air around you during the process of crystallisation.'}", "{'keyLearningPoint': 'Larger crystals form when the solvent evaporates more slowly.'}", "{'keyLearningPoint': 'Heating a solution makes the solvent evaporate more quickly.'}", "{'keyLearningPoint': 'The properties of the substances in a mixture help to determine the technique best suited to separate them.'}", "{'keyLearningPoint': 'When mixtures contain more than two components, multiple techniques may be needed to separate them.'}", "{'keyLearningPoint': 'Creating a solution of an existing mixture can allow a specific technique to be used for separation.'}", "{'keyLearningPoint': 'Separating salt from rock salt requires: making a solution, filtration, and crystallisation.'}", "{'keyLearningPoint': 'Immiscible liquids do not mix and if allowed to settle, one will float above the other.'}", "{'keyLearningPoint': 'Immiscible liquids can be separated by decanting or using a separating funnel.'}", "{'keyLearningPoint': 'If left, miscible liquids do not separate into layers.'}", "{'keyLearningPoint': 'The boiling points of liquids can be used to separate miscible liquids by changing states.'}", "{'keyLearningPoint': 'A liquid can be separated from a solution by vaporising it and then quickly condensing it.'}", "{'keyLearningPoint': 'Distillation works due to one part of a solution having a different boiling point than the other part.'}", "{'keyLearningPoint': 'A condenser should be kept cold to speed up condensation.'}", "{'keyLearningPoint': 'The liquid collected (distillate) is pure.'}", "{'keyLearningPoint': 'Simple distillation is used to separate a mixture containing only two substances.'}", "{'keyLearningPoint': 'Fractional distillation separates mixtures with 3+ substances, or substances with similar boiling points.'}", "{'keyLearningPoint': 'Slower heating during distillation allows for more controlled boiling of individual components.'}", "{'keyLearningPoint': 'If the condenser warms up it becomes less effective and more gas will escape.'}", "{'keyLearningPoint': 'Chromatography can be used for both separation of minute samples and analysis.'}", "{'keyLearningPoint': 'A pure substance will only produce one spot on a chromatogram.'}", "{'keyLearningPoint': 'A mixture will produce many spots on a chromatogram.'}", "{'keyLearningPoint': 'Comparing chromatograms can help to identify an unknown component in a sample.'}", "{'keyLearningPoint': 'Pencil is insoluble in water.'}"], "10Human skeleton and musclesBiology": ["{'keyLearningPoint': 'The human body contains a skeleton made up of bones.'}", "{'keyLearningPoint': 'A joint is where two or more bones meet.'}", "{'keyLearningPoint': 'The skeleton supports the body and provides protection for organs and tissues.'}", "{'keyLearningPoint': 'Bones are made of living tissue made up of cells.'}", "{'keyLearningPoint': 'Red and white blood cells are made in the bone marrow.'}", "{'keyLearningPoint': 'The human body contains muscles.'}", "{'keyLearningPoint': 'Muscles are a type of tissue made up of specialised cells.'}", "{'keyLearningPoint': 'Muscles can contract and relax.'}", "{'keyLearningPoint': 'Muscles need sugar and oxygen to contract.'}", "{'keyLearningPoint': 'Different types of muscle have roles in organ systems, including cardiac muscle, smooth muscle and skeletal muscle.'}", "{'keyLearningPoint': 'Bones meet at joints.'}", "{'keyLearningPoint': 'Muscles can move bones.'}", "{'keyLearningPoint': 'Muscles can only pull, by contracting, and cannot push.'}", "{'keyLearningPoint': 'Some muscles work together in antagonistic pairs to move bones at a joint.'}", "{'keyLearningPoint': 'A muscle attached to a bone exerts a force on the bone when the muscle contracts, which makes the bone move.'}", "{'keyLearningPoint': 'Biomechanics is the study of this movement.'}", "{'keyLearningPoint': 'A moment is the turning effect of the force when a bone pivots at a joint.'}", "{'keyLearningPoint': 'The size of the moment when a bone pivots at a joint can be calculated.'}"], "11Heating and coolingPhysics": ["{'keyLearningPoint': 'Thermometers measure temperature in degrees Celsius (\u00baC).'}", "{'keyLearningPoint': 'Glass thermometers are fragile and need to be handled with care.'}", "{'keyLearningPoint': 'To accurately read the scale on a glass thermometer, your eye needs to be level with the top of the coloured liquid.'}", "{'keyLearningPoint': 'Pure ice melts at 0\u00baC and pure water boils at 100\u00baC.'}", "{'keyLearningPoint': 'If left for long enough, all objects in a room will reach the same temperature.'}", "{'keyLearningPoint': 'If left for long enough, all objects in a room will reach the same temperature as the room.'}", "{'keyLearningPoint': 'Heating a solid makes its particles vibrate more quickly.'}", "{'keyLearningPoint': 'Heating a liquid makes its particles move around more quickly.'}", "{'keyLearningPoint': 'Heating a solid or liquid causes the separation of its particles to increase.'}", "{'keyLearningPoint': 'Heating a solid or liquid causes it to expand.'}", "{'keyLearningPoint': 'Mixing hot water with cold water results in water cooler than the hot water and warmer than the cold.'}", "{'keyLearningPoint': 'When hot and cold water are mixed, the temperature is closer to that of the water there was more of.'}", "{'keyLearningPoint': 'A cold object placed in hot water makes the water particles move more slowly and those in the object move more quickly.'}", "{'keyLearningPoint': 'A hot object placed in cold water makes the water particles move more quickly and those in the object move more slowly.'}", "{'keyLearningPoint': 'The higher the temperature of a hot drink, the faster its particles are moving.'}", "{'keyLearningPoint': 'A hot drink makes the particles in the air around it move more quickly.'}", "{'keyLearningPoint': 'The particles of a hot drink begin to move less quickly as they transfer energy to the air particles.'}", "{'keyLearningPoint': 'The greater the temperature difference between a hot drink and the air, the faster it cools down.'}", "{'keyLearningPoint': 'The temperature along a thermal conductor increases quickly when it is heated.'}", "{'keyLearningPoint': 'The temperature along a thermal insulator increases very slowly when it is heated.'}", "{'keyLearningPoint': 'In thermal conductors, vibrating particles quickly cause the particles near to them to vibrate as well.'}", "{'keyLearningPoint': 'In thermal insulators, it is hard for vibrating particles to cause the particles near to them to vibrate as well.'}", "{'keyLearningPoint': 'Particle vibrations are passed on more quickly between a hot object and conductor than a hot object and an insulator.'}", "{'keyLearningPoint': 'Materials that contain trapped air provide good insulation because gases are very poor thermal conductors.'}", "{'keyLearningPoint': 'Wrapping an object in an insulator keeps a hot object warm and a cold object cool.'}", "{'keyLearningPoint': 'The directions in which particles in a substance move are random. This is true of solids, liquids and gases.'}", "{'keyLearningPoint': 'The higher the temperature, the faster the particles vibrate in a solid or move past each other in a liquid or gas.'}", "{'keyLearningPoint': 'Energy needs to be transferred to an object to raise its temperature.'}", "{'keyLearningPoint': 'For two identical objects, the one at a higher temperature has more energy.'}", "{'keyLearningPoint': 'For two objects made of the same substance at the same temperature, the one with more particles has more energy.'}", "{'keyLearningPoint': 'It is easier to increase the temperature of some materials than others.'}", "{'keyLearningPoint': 'The mass of particles and the attractive forces between particles are different in different substances.'}", "{'keyLearningPoint': 'Different substances need different amounts of heating to reach the same temperature.'}", "{'keyLearningPoint': 'The same amount of different materials at the same temperature can cause different amounts of heating.'}", "{'keyLearningPoint': 'The higher the specific heat capacity, the more energy 1 kg of a substance has, at a temperature, in the thermal store.'}"], "12DiffusionBiology": ["{'keyLearningPoint': 'All substances, including the cell cytoplasm and substances within it, are made up of particles.'}", "{'keyLearningPoint': 'These particles move in random directions and collide all the time.'}", "{'keyLearningPoint': 'Concentration is the number of particles in a volume of liquid or gas.'}", "{'keyLearningPoint': 'The net movement of particles is down a concentration gradient.'}", "{'keyLearningPoint': 'Diffusion is the passive movement of particles of a substance from an area of higher to lower concentration.'}", "{'keyLearningPoint': 'Particles of a liquid can move through a material by diffusion if the material is permeable.'}", "{'keyLearningPoint': 'Observe a liquid diffusing into a jelly cube.'}", "{'keyLearningPoint': 'Predict and observe effect of temperature on the diffusion of a liquid into a jelly cube.'}", "{'keyLearningPoint': 'Predict and observe effect of cube size on the diffusion of a liquid into a jelly cube.'}", "{'keyLearningPoint': 'Use ideas about particles and diffusion to explain these observations.'}", "{'keyLearningPoint': 'Particles of some substances diffuse into and out of a cell by moving through small holes in the cell membrane.'}", "{'keyLearningPoint': 'The particles that make up some substances are too big to diffuse through the holes in the cell membrane.'}", "{'keyLearningPoint': 'The cell membrane is selectively-permeable because only some substances can diffuse through it.'}", "{'keyLearningPoint': 'The net movement of particles through a cell membrane is down a concentration gradient.'}", "{'keyLearningPoint': 'Particles of some substances are small enough to diffuse through holes in a selectively-permeable membrane.'}", "{'keyLearningPoint': 'Particles of these substances move through the selectively-permeable membrane in both directions.'}", "{'keyLearningPoint': 'Predict the direction of net movement of particles through a selectively-permeable membrane.'}", "{'keyLearningPoint': 'Observe the direction of net movement of a substance through a selectively-permeable membrane (e.g. Visking tubing).'}", "{'keyLearningPoint': 'Explain observations of the diffusion of a substance through a selectively-permeable membrane.'}"], "13Climate change and living sustainablyBiologyChemistryPhysics": ["{'keyLearningPoint': 'A gardener can use a greenhouse to keep plants warm.'}", "{'keyLearningPoint': 'A greenhouse maintains the optimal temperature range for the growth and survival of the plants.'}", "{'keyLearningPoint': 'A natural greenhouse effect maintains optimal temperature range for life on Earth.'}", "{'keyLearningPoint': 'Greenhouse gases in Earth\u2019s atmosphere cause the natural greenhouse effect.'}", "{'keyLearningPoint': 'Human activities are increasing the amount of greenhouse gases in the atmosphere, increasing the greenhouse effect.'}", "{'keyLearningPoint': \"Temperature data show an unusual, rapid increase in the Earth's average surface temperature over the last century or so.\"}", "{'keyLearningPoint': 'This recent increase in average surface temperature is called global warming.'}", "{'keyLearningPoint': 'There is a correlation between data showing increasing temperature and data showing increasing greenhouse gas emissions.'}", "{'keyLearningPoint': 'Most scientists agree that emissions from human activities are increasing the greenhouse effect, causing global warming.'}", "{'keyLearningPoint': 'The climate is the average weather conditions for a particular location over a long period of time.'}", "{'keyLearningPoint': 'Emissions of greenhouse gases from human activities are causing global warming and climate change.'}", "{'keyLearningPoint': 'Climate change includes an increase in the frequency of extreme weather events such as droughts, storms and floods.'}", "{'keyLearningPoint': 'Data predict an increased frequency of extreme weather events with increasing global temperature.'}", "{'keyLearningPoint': 'We all need to work together to reduce emissions of greenhouse gases to limit climate change.'}", "{'keyLearningPoint': 'Renewable resources do not run out because they are replenished faster than they are used up.'}", "{'keyLearningPoint': 'A resource is sustrainable it is maintained a certain level for as long as it is needed.'}", "{'keyLearningPoint': 'Some resources, such as wood, are only renewable if they are used sustainably.'}", "{'keyLearningPoint': 'We cannot have sustainable transport that uses petrol or diesel fuel.'}", "{'keyLearningPoint': 'Altering the design of a building can make it more sustainable.'}", "{'keyLearningPoint': 'Producing food for humans and other animals uses resources and releases greenhouse gases that lead to climate change.'}", "{'keyLearningPoint': 'Land-use change, farming, processing, transport, retail and packaging all add to the carbon footprint of food.'}", "{'keyLearningPoint': 'Meat and plant-based products have different carbon footprints.'}", "{'keyLearningPoint': 'Food production is more sustainable when it has a smaller, negative impact on the environment.'}", "{'keyLearningPoint': 'Changes in diet and a reduction in food waste can help us eat more sustainably by lowering greenhouse gas emissions.'}", "{'keyLearningPoint': 'Thermal insulators can reduce the energy needed to heat a building.'}", "{'keyLearningPoint': \"Improving a building's insulation makes it easier to heat it using only renewable resources.\"}", "{'keyLearningPoint': 'Thermostats can control temperature automatically in different rooms and help reduce unnecessary heating.'}", "{'keyLearningPoint': 'The greater the temperature difference between the inside and outside of a house, the faster it warms up or cools down'}", "{'keyLearningPoint': 'Planting near a house increases the outside temperature on cold days and decreases it on hot days'}", "{'keyLearningPoint': 'Waste is often sent to incinerators or landfill sites, which are sources of greenhouse gases.'}", "{'keyLearningPoint': 'Reuse, reduce, recycle is what we can do to minimise waste.'}", "{'keyLearningPoint': 'Sustainable use of resources helps ensure that they are available for future generations.'}"], "1Human digestive systemBiology": ["{'keyLearningPoint': 'Major organs of the human digestive system and the order in which food moves through them.'}", "{'keyLearningPoint': 'The functions of the organs, tissues and glands of the digestive system and how they are adapted to break down food.'}", "{'keyLearningPoint': 'Food that cannot be digested is passed out of the body as faeces.'}", "{'keyLearningPoint': 'The differences between mechanical and chemical digestion and where they take place.'}", "{'keyLearningPoint': 'Food is made up of carbohydrates, proteins and fats.'}", "{'keyLearningPoint': 'Carbohydrates, proteins and fats in food are broken down by digestion into smaller molecules that can be absorbed.'}", "{'keyLearningPoint': 'Enzymes are biological molecules that act as catalysts to speed up chemical digestion of carbohydrate, protein and fat.'}", "{'keyLearningPoint': 'Enzymes digest carbohydrates into starch and sugars, proteins into amino acids, and fats into fatty acids and glycerol.'}", "{'keyLearningPoint': 'Chemical reagents can be used to test for large food molecules including protein, fat, and carbohydrates such as starch.'}", "{'keyLearningPoint': 'Chemical reagents can be used to test for smaller food molecules, such as sugars from the breakdown of starch.'}", "{'keyLearningPoint': 'Interpretation of qualitative food test results.'}", "{'keyLearningPoint': 'Bacteria are living organisms; each bacterium is a microorganism made of a single living cell.'}", "{'keyLearningPoint': 'Some bacteria are pathogens that cause diseases, but many bacteria are harmless and some are helpful.'}", "{'keyLearningPoint': 'Helpful bacteria live inside the human digestive system.'}", "{'keyLearningPoint': 'They release enzymes that digest food we cannot digest ourselves.'}", "{'keyLearningPoint': 'They also help to protect us against pathogens that enter the digestive system by competing against them.'}", "{'keyLearningPoint': 'Nutrients are absorbed into the blood, which transports them around the body to where they are needed by cells.'}", "{'keyLearningPoint': 'The molecules of some nutrients are small enough to be absorbed into the blood by diffusion.'}", "{'keyLearningPoint': 'Adaptations of the small intestine lining that increase the amount of absorption.'}"], "2Atoms, elements and compoundsChemistry": ["{'keyLearningPoint': 'All matter is made up of atoms.'}", "{'keyLearningPoint': 'Dalton\u2019s model of an atom is of a sphere that cannot be broken up.'}", "{'keyLearningPoint': 'An element is made up of only one type of atom.'}", "{'keyLearningPoint': 'Each element is made of a different type of atom.'}", "{'keyLearningPoint': 'Elements are chemically pure, but can react together.'}", "{'keyLearningPoint': 'Each element has a fixed melting point and boiling point.'}", "{'keyLearningPoint': 'Each element has particular physical properties.'}", "{'keyLearningPoint': 'Each element has particular chemical properties.'}", "{'keyLearningPoint': 'The properties of elements are different from those of a single atom.'}", "{'keyLearningPoint': 'Metals are good thermal and electrical conductors, they are strong, shiny, malleable and ductile.'}", "{'keyLearningPoint': 'Non-metals are normally poor thermal and electrical conductors, they are not strong, and are dull and brittle.'}", "{'keyLearningPoint': 'Graphite is a non-metal that is a good electrical and thermal conductor.'}", "{'keyLearningPoint': 'Metals are found on the left side and in the middle of the periodic table, non-metals on the right side.'}", "{'keyLearningPoint': 'Many non-metals are in the gas state at room temperature.'}", "{'keyLearningPoint': 'Some non-metals form diatomic molecules that contain two atoms (e.g. O\u2082, N\u2082, H\u2082, Cl\u2082).'}", "{'keyLearningPoint': 'Some non-metals are monatomic and do not form molecules.'}", "{'keyLearningPoint': 'Noble gases are monatomic and are listed in the right-hand column of the periodic table.'}", "{'keyLearningPoint': 'Hazard symbols are used to decribe the dangers of substances.'}", "{'keyLearningPoint': 'Each element has its own distinct properties.'}", "{'keyLearningPoint': 'Metalloid elements have some properties of metals and some properties of non-metals.'}", "{'keyLearningPoint': 'A compound is made of two or more different elements chemically bonded through a chemical reaction.'}", "{'keyLearningPoint': 'A compound may have different properties to each of the elements that it is made from.'}", "{'keyLearningPoint': 'The symbols for each element (each type of atom) a substance contains, appear in its chemical formula.'}", "{'keyLearningPoint': 'Numbers (subscripts) next to chemical symbols in a formula show the numbers of each type of atom in a compound.'}", "{'keyLearningPoint': 'Each compound contains a different combination of elements.'}", "{'keyLearningPoint': 'Some compounds contain the same elements as other compounds, but in a different ratio.'}", "{'keyLearningPoint': \"The name of a simple metal\u2013non-metal compound ends '-ide' to indicate bonding has occurred.\"}", "{'keyLearningPoint': 'Some common groups of compounds are metal carbonates, metal sulfates and metal nitrates.'}", "{'keyLearningPoint': 'Compounds of metal atoms bonded to -CO\u2083 are called metal carbonates.'}", "{'keyLearningPoint': 'Compounds of metal atoms bonded to -SO\u2084 are called metal sulfates.'}", "{'keyLearningPoint': 'Compounds of metal atoms bonded to -NO\u2083 are called metal nitrates.'}", "{'keyLearningPoint': 'Reactants are the chemicals that react in a chemical reaction.'}", "{'keyLearningPoint': 'Products are the chemicals that are formed in a chemical reaction.'}", "{'keyLearningPoint': 'The products and reactants in a chemical reaction contain exactly the same atoms.'}", "{'keyLearningPoint': 'The atoms in the products of a chemical reaction are bonded differently to the same atoms in the reactants.'}"], "3BiodiversityBiology": ["{'keyLearningPoint': 'Ecosystems are made up of a community of organisms that interact with each other and their non-living surroundings.'}", "{'keyLearningPoint': 'Organisms in an ecosystem are interdependent because they depend upon each other for the things they need to survive.'}", "{'keyLearningPoint': 'All organisms depend upon producers to make the food that moves through food chains.'}", "{'keyLearningPoint': 'Dead organisms and remains of living organisms provide food for other organisms.'}", "{'keyLearningPoint': 'All living organisms depend upon decomposers that break down dead organisms and recycle useful substances for reuse.'}", "{'keyLearningPoint': 'Food chains show the feeding relationships between organisms and the flow of energy through a habitat.'}", "{'keyLearningPoint': 'The number of organisms at each trophic level in a food chain can be used to create a pyramid of number.'}", "{'keyLearningPoint': 'Pyramids of number use scaled bars to represent the number of organisms.'}", "{'keyLearningPoint': 'Pyramids of number have the producer at the bottom.'}", "{'keyLearningPoint': 'Food chains show feeding relationships between organisms and how food moves from one organism to another in a habitat.'}", "{'keyLearningPoint': 'Biomass is the mass of living material in one or more organisms, and may be estimated.'}", "{'keyLearningPoint': 'Pyramids of biomass show the biomass of organisms at each stage in a food chain.'}", "{'keyLearningPoint': 'Pyramids of biomass use scaled bars to represent the total mass of organisms within a habitat.'}", "{'keyLearningPoint': 'Pyramids of biomass have the producer at the bottom.'}", "{'keyLearningPoint': 'Biodiversity is a measure of the range of living organisms.'}", "{'keyLearningPoint': 'Living organisms, including plants, have adaptations that help them to survive in their environment.'}", "{'keyLearningPoint': 'Examples of physical plant adaptations include shallow or deep roots, and the presence of spines to deter consumers.'}", "{'keyLearningPoint': 'Plants can also have behavioural adaptations such as growing towards light.'}", "{'keyLearningPoint': 'Changes to the environment can affect plant biodiversity.'}", "{'keyLearningPoint': 'Animals have adaptations that help them to survive in their environment.'}", "{'keyLearningPoint': 'Some adaptations are physical, such as thick fur.'}", "{'keyLearningPoint': 'Some adaptations are behavioural, such as being nocturnal.'}", "{'keyLearningPoint': 'Changes in the environment can affect animal biodiversity.'}", "{'keyLearningPoint': 'Sampling is used to obtain estimates of populations within an area because it would be impossible to count them all.'}", "{'keyLearningPoint': 'There are lots of different sampling methods that can be used to sample plants and animals.'}", "{'keyLearningPoint': 'Sampling is essential for conservation to monitor populations and compare them.'}", "{'keyLearningPoint': 'Quadrats are square frames which can be used to sample plants or slow-moving animals.'}", "{'keyLearningPoint': 'There are different measurements that you can take using a quadrat depending on what you are investigating.'}", "{'keyLearningPoint': 'Most sampling using quadrats is random to avoid bias in your results.'}", "{'keyLearningPoint': 'Classification keys can be used to identify different species.'}", "{'keyLearningPoint': 'The results of ecological sampling can be used to inform conservation and preservation efforts.'}", "{'keyLearningPoint': 'Biodiversity is important to maintain healthy habitats.'}", "{'keyLearningPoint': 'A gene pool is the range of DNA in a species.'}", "{'keyLearningPoint': 'Biodiversity can be maintained by conservation, protection and gene banks.'}"], "4Understanding chemical reactionsChemistry": ["{'keyLearningPoint': 'Characteristics of chemical reactions include changes in colour, bubbling, or a change of temperature.'}", "{'keyLearningPoint': 'Bubbles appear when a gas is produced in a chemical reaction.'}", "{'keyLearningPoint': 'In a chemical reaction, atoms rearrange themselves to form new substances.'}", "{'keyLearningPoint': 'Generally, chemical reactions are irreversible.'}", "{'keyLearningPoint': 'The mass of the products in a chemical reaction is the same as the mass of the reactants.'}", "{'keyLearningPoint': 'Word equations are a simple way of describing chemical reactions.'}", "{'keyLearningPoint': 'Chemical formulae represent the numbers of each type of atoms in a reactant or product.'}", "{'keyLearningPoint': 'Chemical equations represent how the atoms in the reactants rearrange to form the products.'}", "{'keyLearningPoint': 'The arrow in a chemical equation represents the words \u2018changes into\u2019.'}", "{'keyLearningPoint': 'Combustion requires fuel, heat and oxygen, and will not happen without one of them.'}", "{'keyLearningPoint': 'When a substance reacts to combine with oxygen, this is called oxidation.'}", "{'keyLearningPoint': 'Examples of oxidation are combustion and rusting.'}", "{'keyLearningPoint': 'One of the products of oxidation is always an oxide, but the other products vary.'}", "{'keyLearningPoint': 'Combustion requires fuel, oxygen, and an initial source of energy, usually heat, to start the reaction.'}", "{'keyLearningPoint': \"The term 'burning' describes the reaction of substances with oxygen and is commonly used to refer to visible flames.\"}", "{'keyLearningPoint': 'Water is often formed in chemical reactions if oxygen and hydrogen atoms are present.'}", "{'keyLearningPoint': 'Carbon dioxide is often formed in chemical reactions if oxygen and carbon atoms are present.'}", "{'keyLearningPoint': 'Carbon dioxide and water both consist of small molecules that form easily with strong bonds.'}", "{'keyLearningPoint': 'Decomposition reactions involve a single compound breaking down into two or more products.'}", "{'keyLearningPoint': 'Decomposition reactions usually require heat, light, or electricity, to occur.'}", "{'keyLearningPoint': 'When metal carbonates decompose upon heating, they typically form metal oxides and carbon dioxide gas.'}", "{'keyLearningPoint': 'Precipitation reactions occur when two solutions combine to form an insoluble solid.'}", "{'keyLearningPoint': 'The appearance of a precipitate is evidence that a chemical reaction has occurred.'}", "{'keyLearningPoint': 'Precipitation reactions are important in water treatment, to remove unwanted substances from water.'}", "{'keyLearningPoint': 'Precipitation reactions are used in qualitative analysis, to identify the presence of certain substances in a solution.'}"], "5Moving by forcePhysics": ["{'keyLearningPoint': 'The greater the speed of an object, the shorter the time it takes to cover a certain distance.'}", "{'keyLearningPoint': 'The greater the speed of an object, the more distance it travels in a certain time.'}", "{'keyLearningPoint': 'Speed = distance \u00f7 time.'}", "{'keyLearningPoint': 'Speed is measured in m/s or km/h or miles/h.'}", "{'keyLearningPoint': 'm/s is the number of metres travelled each second.'}", "{'keyLearningPoint': 'A ramp will produce a force that allows a dynamics trolley to roll down it.'}", "{'keyLearningPoint': 'The average speed of the trolley can be found from distance and time measurements.'}", "{'keyLearningPoint': 'Counting down \u20183, 2, 1, go\u2019 helps start a stopwatch at the right moment.'}", "{'keyLearningPoint': 'Observing with eyes in line with the finish line helps stop a stopwatch at the right moment.'}", "{'keyLearningPoint': 'The instantaneous speed of an object is the speed at a particular moment in time.'}", "{'keyLearningPoint': 'For an accurate measurement a person needs to be in line with the observation.'}", "{'keyLearningPoint': 'Manual timing can lead to a range of timing errors.'}", "{'keyLearningPoint': 'Repeat readings can reduce the effect of random errors.'}", "{'keyLearningPoint': 'Some readings are anomalous and these should not be used in caluations of averages.'}", "{'keyLearningPoint': 'The labels on a graph describe what it shows.'}", "{'keyLearningPoint': 'The numbers on the scale of a graph go up in equal amounts.'}", "{'keyLearningPoint': 'The value of each small division is the value of a large division divided by the number of small divisions it contains.'}", "{'keyLearningPoint': 'Each point on a distance-time graph describes where an object is at a point in time (not its speed).'}", "{'keyLearningPoint': 'The speed of an object can be found from distance and time information read from a distance-time graph.'}", "{'keyLearningPoint': 'A level line on a distance-time graph shows a stationary object (no movement).'}", "{'keyLearningPoint': 'The greater the gradient (steeper the line) on a distance-time graph, the faster the movement.'}", "{'keyLearningPoint': 'Upward and downward sloping lines on a distance-time graph show movement in opposite directions.'}", "{'keyLearningPoint': 'The average speed between two points is calculated using speed = change in distance \u00f7 time taken.'}", "{'keyLearningPoint': 'A resultant force can change the speed of an object.'}", "{'keyLearningPoint': 'The speed of an object changes throughout the time a resultant force is acting on it.'}", "{'keyLearningPoint': 'Resultant forces make the movement of things change.'}", "{'keyLearningPoint': 'Friction acts against the direction of movement of an object.'}", "{'keyLearningPoint': 'An object will continue to move at a steady speed in a straight line unless a resultant force is acting.'}", "{'keyLearningPoint': 'Streamlining reduces drag.'}", "{'keyLearningPoint': 'Streamlining reduces how much a fluid needs to be pushed out of the way for an object to move through it.'}", "{'keyLearningPoint': 'The drag force on an object moving through a fluid (liquid or gas) increases with speed.'}", "{'keyLearningPoint': 'Streamlining can increase the top speed of a vehicle.'}", "{'keyLearningPoint': 'The larger the surface of a parachute, the bigger its drag.'}", "{'keyLearningPoint': 'Gravity pulls down with a steady force.'}", "{'keyLearningPoint': 'At top speed the force of drag on a parachute is the same size as the force of gravity on the jumper.'}", "{'keyLearningPoint': 'The gravitational force on a falling object is constant.'}", "{'keyLearningPoint': 'The drag force on a falling obejct depends on its speed and shape.'}", "{'keyLearningPoint': 'Objects falling through the air will reach a terminal velocity when the drag and gravitational forces are equal.'}", "{'keyLearningPoint': 'The terminal velocity can be changed by changing the drag force (e.g. with a parachute).'}"], "6Species and classification (differences between species)Biology": ["{'keyLearningPoint': 'Similarities and differences in the features of organisms are used to classify them into groups within larger groups.'}", "{'keyLearningPoint': 'Scientists classify every organism into groups from kingdom down to species.'}", "{'keyLearningPoint': 'In larger groups such as kingdoms, there are more organisms with fewer similarities in their features.'}", "{'keyLearningPoint': 'A species is a group of individuals with similar features and genes that can reproduce to make fertile offspring.'}", "{'keyLearningPoint': 'Scientists give each species a binomial name to identify the genus and species.'}", "{'keyLearningPoint': 'A classification key can be used to find out which groups organisms are classified into.'}", "{'keyLearningPoint': 'A classification key is a series of questions about the features of organisms.'}", "{'keyLearningPoint': 'Classification helps us organise and make sense of biodiversity.'}", "{'keyLearningPoint': 'Make, record and interpret observations of organisms in the field.'}", "{'keyLearningPoint': 'Use a classification key to identify and classify organisms in the field.'}", "{'keyLearningPoint': 'How to work safely in a way that minimises harm to living organisms and disruption of ecosystems.'}", "{'keyLearningPoint': 'Organisms can be classified into groups based on their characteristics at the microscopic, cellular level.'}", "{'keyLearningPoint': 'The common features of the cells of animals, plants, fungi and bacteria.'}", "{'keyLearningPoint': 'Use of cell features to classify organisms into the kingdoms of animals, plants, fungi and bacteria.'}"], "7Variation (differences within species)Biology": ["{'keyLearningPoint': 'When organisms reproduce they make offspring of the same kind (species resemblance)'}", "{'keyLearningPoint': 'Offspring inherit features from both parents, so they look similar to their parents and one another (family resemblance)'}", "{'keyLearningPoint': 'Some features are inherited when DNA is passed from parents to offspring during reproduction'}", "{'keyLearningPoint': 'Some features are caused (or changed) by an organism\u2019s lifestyle and environment'}", "{'keyLearningPoint': 'There is usually variation between offspring; they are not usually identical to their parents or one another'}", "{'keyLearningPoint': 'Differences between species are greater than differences within species.'}", "{'keyLearningPoint': 'There are differences in the features of individuals of the same species, and this is called variation.'}", "{'keyLearningPoint': 'Some variation is caused only by the environment (e.g. injuries).'}", "{'keyLearningPoint': 'Some variation is caused only by inherited genetic information in the genome (e.g. blood type).'}", "{'keyLearningPoint': 'Some variation results from a combination of genetic and environmental/lifestyle factors (e.g. body mass).'}", "{'keyLearningPoint': 'Some features have discontinuous variation (limited variations falling into particular categories).'}", "{'keyLearningPoint': 'Some features have continuous variation (can take any value within a range).'}", "{'keyLearningPoint': 'Examples of features in humans, other animals and plants that show discontinuous and continuous variation.'}", "{'keyLearningPoint': 'Collecting primary data on examples of discontinuous and continuous variation in features.'}", "{'keyLearningPoint': 'Using a bar chart to display discontinuous data.'}", "{'keyLearningPoint': 'Plotting data for discontinuous variation on a bar chart.'}", "{'keyLearningPoint': 'Interpreting and describing a bar chart displaying data for discontinuous variation.'}", "{'keyLearningPoint': 'Discontinuous variation usually has only a genetic cause and is not affected by environment or lifestyle.'}", "{'keyLearningPoint': 'Using a histogram or line graph to display continuous data.'}", "{'keyLearningPoint': 'Plotting data for continuous variation on a histogram.'}", "{'keyLearningPoint': 'Interpreting and describing a histogram displaying data for continuous variation.'}", "{'keyLearningPoint': 'Continuous variation is usually influenced by many factors, including genetics, the environment and lifestyle.'}"], "8Earth's resourcesChemistry": ["{'keyLearningPoint': 'Components of rocks, such as sand, fossils, shells, crystals, help to indicate how those rocks formed and their age.'}", "{'keyLearningPoint': 'Rocks contain grains which can be round or interlocking.'}", "{'keyLearningPoint': 'Some rocks contain crystals that point in many directions while others are aligned.'}", "{'keyLearningPoint': \"Rock types and textures provide insights into geological processes and Earth's history.\"}", "{'keyLearningPoint': 'Rocks consist of minerals and rock fragments.'}", "{'keyLearningPoint': 'A mineral is a naturally occurring pure substance (an element or a compound) that has a crystal structure.'}", "{'keyLearningPoint': 'Minerals are identified by their crystal structure, composition, and physical properties.'}", "{'keyLearningPoint': 'Sedimentary rocks contain distinct grains that are stuck together.'}", "{'keyLearningPoint': 'Sedimentary rocks may contain fragments of shell or fossils, or larger pieces of grit or pebbles cemented together.'}", "{'keyLearningPoint': 'Igneous rocks contain crystals that point in many directions; metamorphic rocks contain crystals that mostly line up.'}", "{'keyLearningPoint': \"Rocks that contain interlocking grains or interlocking crystals are non-porous; rocks that don't are porous.\"}", "{'keyLearningPoint': 'The properties of rock influence their uses.'}", "{'keyLearningPoint': 'Earth is a spherical, rocky planet with a thin crust, partially covered in water.'}", "{'keyLearningPoint': 'Under Earth\u2019s crust is a dense rocky layer, called the mantle.'}", "{'keyLearningPoint': 'In the centre of Earth is a solid metallic core surrounded by a liquid outer core.'}", "{'keyLearningPoint': 'Temperature and pressure increases towards the centre of Earth, making the inner core extremely hot and solid.'}", "{'keyLearningPoint': \"Scientists use models to better understand phenomena, including Earth's structure.\"}", "{'keyLearningPoint': 'Occurrences of earthquakes and volcanic eruptions suggest Earth\u2019s layers are not static but interact with each other.'}", "{'keyLearningPoint': 'Evidence, such as rock formations and fossils, supports the idea that the continents were once all joined up.'}", "{'keyLearningPoint': 'Earth\u2019s crust is broken into pieces known as tectonic plates, which move very, very slowly.'}", "{'keyLearningPoint': 'Plate tectonics is a scientific theory that explains how tectonic plates move and interact with each other.'}", "{'keyLearningPoint': 'Plate tectonics help scientists better understand and predict changes to Earth\u2019s surface.'}", "{'keyLearningPoint': 'The melting point of rock is very high.'}", "{'keyLearningPoint': \"Melted rock is called either lava (on Earth's surface), or magma (underground).\"}", "{'keyLearningPoint': \"Extrusive igneous rock forms outside Earth's crust, while instrusive igneous rock forms inside the crust.\"}", "{'keyLearningPoint': 'Some substances form crystals when they freeze.'}", "{'keyLearningPoint': 'Crystal size depends on the rate at which melted rock cools.'}", "{'keyLearningPoint': 'In a crystal, the atoms are all arranged in a very regular pattern.'}", "{'keyLearningPoint': 'In some substances, very high pressure, at a high temperature, can push particles together to form crystals.'}", "{'keyLearningPoint': 'Between tectonic plates, the pressure and temperature are high enough for large crystals to grow inside solid rock.'}", "{'keyLearningPoint': 'Metamorphic rocks form under extreme pressure and temperature, altering original structures.'}", "{'keyLearningPoint': 'Aligned crystals in metamorphic rocks give them useful properties (e.g. decoration or easily separated into sheets).'}"], "9Series circuitsPhysics": ["{'keyLearningPoint': 'The names and symbols of the basic components of an electric circuit.'}", "{'keyLearningPoint': 'A series circuit is an electric circuit with one complete loop from one end of a battery to the other end.'}", "{'keyLearningPoint': 'A circuit is built systematically following a circuit diagram in one direction, starting from any point.'}", "{'keyLearningPoint': 'A circuit diagram is drawn systematically, following the circuit in one direction, starting from any point.'}", "{'keyLearningPoint': 'Wires in a circuit diagram are drawn using a ruler for clarity, with no gaps that would indicate a break in the circuit.'}", "{'keyLearningPoint': 'The path current flows through a filament bulb can be traced, from one connection and through the filament to another.'}", "{'keyLearningPoint': 'In a faulty filament bulb, the filament is broken and current cannot flow through it.'}", "{'keyLearningPoint': 'A circuit is not complete if there are any gaps in the circuit, or hidden in faulty wires or components.'}", "{'keyLearningPoint': 'A wire or component can be tested by putting it into a simple circuit with a battery and bulb.'}", "{'keyLearningPoint': 'A circuit with one faulty component will work if a wire is used to bypass the faulty component.'}", "{'keyLearningPoint': 'One end of a battery has a positive charge and one end has a negative charge, because of chemical reactions inside it.'}", "{'keyLearningPoint': 'A battery pushes electric charge (electrons) one way round a complete circuit.'}", "{'keyLearningPoint': 'There are electric charges in all atoms of the wires and components in a circuit, even when it is not turned on.'}", "{'keyLearningPoint': 'When a circuit is turned on, electrons everywhere in the circuit start moving at the same time.'}", "{'keyLearningPoint': 'Individual electrons move round a circuit slowly, at a speed of just a few millimetres each second.'}", "{'keyLearningPoint': 'An ammeter is used to measure the size of an electric current.'}", "{'keyLearningPoint': 'An ammeter measures the current flowing through it without affecting the current in the circuit it is connected into.'}", "{'keyLearningPoint': 'Electric current is measured in amps (A), which is short for amperes.'}", "{'keyLearningPoint': 'The current in a series circuit is the same everywhere.'}", "{'keyLearningPoint': 'Adding a component to a series circuit changes the current everywhere, on both sides of the component.'}", "{'keyLearningPoint': 'Voltage is a commonly used term for potential difference.'}", "{'keyLearningPoint': 'A voltmeter measures the voltage supplied by a cell or battery or across a component.'}", "{'keyLearningPoint': 'A voltmeter is connected across the terminals of a cell, battery, or component.'}", "{'keyLearningPoint': 'Voltage (or potential difference) is measured in volts (V).'}", "{'keyLearningPoint': \"The voltage of a cell or battery indicates the force 'pushing' electric charges around a circuit.\"}", "{'keyLearningPoint': 'The voltage of a battery measures the strength with which it can \u2018push\u2019 current around a circuit.'}", "{'keyLearningPoint': 'The voltage of a component in an electric circuit measures the size of \u2018push\u2019 that is moving current through it.'}", "{'keyLearningPoint': 'The voltage across each component in an electric circuit adds up to the voltage of the cell or battery.'}", "{'keyLearningPoint': 'A battery can be made of several electrical cells added together.'}", "{'keyLearningPoint': 'The voltage of a battery made of electrical cells added in series is equal to the voltages of the cells added together.'}", "{'keyLearningPoint': 'Some objects can be charged by rubbing with certain materials.'}", "{'keyLearningPoint': 'Objects with a static electric charge can exert a force on other objects (that contain electric charge).'}", "{'keyLearningPoint': 'The electrostatic force acts at a distance.'}", "{'keyLearningPoint': 'Objects with opposite electric charges attract each other.'}", "{'keyLearningPoint': 'Objects with the same electric charge as each other repel each other.'}", "{'keyLearningPoi
